# Supabase CLI configuration for the local stack (`supabase start`) and CI.
# Keys checked against the CLI source for v2.119.0 (the version CI pins in
# .github/workflows/db-cli.yml): apps/cli-go/pkg/config/templates/config.toml,
# auth.go and config.go at tag v2.119.0, read on 31 Oct 2026. Anything not
# listed here takes the CLI default.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# This file configures the LOCAL stack only. CI never runs `supabase config push`
# (that needs an account access token, which POPS-04 rules out), so hosted auth
# settings for scribe-staging and scribe-prod are set in the dashboard or with
# the Management API. The [auth] values below are ALSO the record of what the
# hosted projects must hold: supabase/auth-email.md section 3 maps each key to
# its dashboard field and Management API name. Change both together.
# See docs/ops/DEPLOY.md.
#
# No secret values live here. Every credential is an env() reference.
# supabase/tests/auth_config.test.mjs pins the auth values below.

project_id = "scribe"

[db]
# Must match the hosted projects (`show server_version;`). 17 is the CLI
# default for new projects; confirm once scribe-staging exists.
major_version = 17

[db.seed]
# No seed file: test data (the fictional family "Asha") lives in supabase/tests.
enabled = false

[auth]
enabled = true
# Templates build their links from this: {{ .SiteURL }}/auth/callback#token_hash=...
site_url = "https://earlyletters.com"
# Exact URLs only, never a wildcard and never the scribe:// scheme (any app can
# claim it). https://earlyletters.com/auth/callback is both the website page and
# the app's universal link (the AASA hands /auth/callback to the app), and the
# app sends exactly this as emailRedirectTo (apps/mobile/src/lib/auth/email.ts).
# /auth/confirm is not listed until the app accepts it (SIGN-04).
additional_redirect_urls = ["https://earlyletters.com/auth/callback"]
# Access token lifetime: 15 minutes (TDD 04 3.1).
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# The database refuses anonymous sessions (SQLSTATE SCANO); keep them off here too.
enable_anonymous_sign_ins = false
enable_manual_linking = false

# Supabase Auth limits (auth-email.md 3.6). sign_in_sign_ups and
# token_verifications are per IP per 5 minutes; email_sent is per hour for the
# whole project and only applies with custom SMTP (so not on the local stack).
# The per-address limit is [auth.email] max_frequency.
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

# Sign-in (D-054): Sign in with Apple, Sign in with Google, and email link plus
# 6-digit code. No passwords and no forgot-password flow. The CLI has no key
# that turns off email plus password sign-in; the app simply never offers it.
# Locally, sign-in emails are caught by the bundled mail viewer and never sent.
[auth.email]
enable_signup = true
# No account is usable until the inbox is proven.
enable_confirmations = true
# Secure email change: both the old and the new address must confirm.
double_confirm_changes = true
# One sign-in email per address per 60 s (the app's "Send a new email" wait).
max_frequency = "1m"
otp_length = 6
# 15 minutes. Every template and the app copy say "15 minutes" ({expiresIn},
# packages/emails/scripts/export-supabase.ts); keep them equal.
otp_expiry = 900

# Production only, set in the dashboard, never committed with a value:
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(RESEND_SMTP_API_KEY)"
# admin_email = "hello@earlyletters.com"
# sender_name = "Early Letters"

# Our templates, generated by packages/emails/scripts/export-supabase.ts
# (supabase/templates/README.md). Same subjects as config.toml.snippet.
# Path rule: template content_path is relative to the repository root.
# Notification content_path is relative to this supabase/ folder in the Go
# config loader (config.go resolve, tag v2.119.0); the v2.119.0 binary also
# accepts it there (run on 31 Oct 2026: removing templates/identity_linked.html
# fails the load). "./supabase/templates/..." for a notification works in the
# binary but not in the Go loader, so notifications use "./templates/...".
[auth.email.template.confirmation]
subject = "Confirm your email to start your book"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your sign-in link and code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Your code to confirm account deletion"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.notification.identity_linked]
enabled = true
subject = "{{ if eq .Provider \"google\" }}Sign in with Google is now on your account{{ else }}Sign in with Apple is now on your account{{ end }}"
content_path = "./templates/identity_linked.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Your sign-in email was changed"
content_path = "./templates/email_changed.html"

# Sign-in method removed: Supabase's default text until our own copy exists.
[auth.email.notification.identity_unlinked]
enabled = true

# None of these exist at v1.0 (no passwords, no phone sign-in, no MFA).
[auth.email.notification.password_changed]
enabled = false

[auth.email.notification.phone_changed]
enabled = false

[auth.email.notification.mfa_factor_enrolled]
enabled = false

[auth.email.notification.mfa_factor_unenrolled]
enabled = false

# Apple and Google are off until the founder has the credentials (BL-053).
# To try them locally, export the variables below and set enabled = true.
[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
