# Applies migrations to the hosted databases (D-041). The only way a
# migration reaches scribe-staging or scribe-prod. See docs/ops/DEPLOY.md.
#
#   staging     push to main that changes supabase/migrations/**
#   production  push of a tag db-v*, pointing at a commit on main, through the
#               GitHub Environment "production" (required reviewers)
#
# Each environment: dry run, then push. Credentials are one project-scoped
# Postgres URL per environment (SUPABASE_DB_URL_STAGING, SUPABASE_DB_URL_PROD),
# stored as Environment secrets. No account access token (POPS-04).
#
# After a push the workflow prints which files are not yet listed in
# .github/migrations-applied.txt. It never edits that file: a pull request
# records them (DEPLOY.md, "After a deploy").
#
# Staging also deploys on a push to develop that changes supabase/migrations/**
# (RA-20-04), behind the staging reviewer, so develop's Edge Functions never wait
# on main for their schema: deploy-functions.yml deploys nothing until staging
# has every migration on develop. Approve this run first when both wait.
#
# Staging then runs RA-07-06's content-free smoke (scripts/ops/staging-smoke.ts)
# with --db-only: the database checks this job owns, not function or Auth state
# it does not deploy. It also reads SUPABASE_STAGING_URL,
# SUPABASE_STAGING_PUBLISHABLE_KEY and SUPABASE_STAGING_PROJECT_REF from the
# staging Environment, all public values kept as secrets so logs mask them.
# Actions are pinned to commit SHAs (CI-06); the comment names the tag.
name: Deploy database

on:
  push:
    branches: [main, develop]
    tags: ['db-v*']

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.119.0

jobs:
  # Path filters are not used in `on:` so that tag pushes are never filtered
  # out; this job decides whether a main push changed any migration.
  changes:
    name: migrations changed
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No usable previous commit; treating migrations as changed."
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- supabase/migrations/)"
          if [ -n "$changed" ]; then
            printf 'Changed:\n%s\n' "$changed"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "No migration changes in this push."
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

  staging:
    name: deploy to staging
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-24.04
    # The push, then the smoke (function health retries and, if psql is
    # missing, an apt install).
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-db-staging
      cancel-in-progress: false
    steps:
      # On develop this job applies develop's tip, not the pushed commit. Jobs
      # join the concurrency group when they become ready, so runs can queue out
      # of push order, and a newer pending run replaces an older one. With the
      # tip, whichever run goes last applies every migration on develop, and an
      # older run never goes backwards (db push only moves forward). A push to
      # main keeps its own commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref == 'refs/heads/develop' && 'develop' || github.sha }}
          persist-credentials: false
      - name: Commit being deployed
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "Applying migrations from $sha (started by $TRIGGER_SHA)."
          {
            echo "### staging: migrations from \`$sha\`"
            echo
            echo "Started by \`$TRIGGER_SHA\`. On develop this job applies develop's tip at the time it started, so a later run never applies older migrations."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Check the secret exists
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_STAGING }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL_STAGING is not set on the staging environment (docs/ops/DEPLOY.md)."
            exit 1
          fi
      - name: Dry run
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_STAGING }}
        run: supabase db push --dry-run --db-url "$DB_URL"
      - name: Push
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_STAGING }}
        run: supabase db push --yes --db-url "$DB_URL"
      - name: Files to record in migrations-applied.txt
        run: |
          {
            echo "### staging: migrations not yet in .github/migrations-applied.txt"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          listed="$(sed -e 's/#.*//' -e 's/[[:space:]]//g' .github/migrations-applied.txt | grep -v '^$' || true)"
          for f in supabase/migrations/*.sql; do
            name="$(basename "$f")"
            if ! printf '%s\n' "$listed" | grep -qxF "$name"; then
              echo "$name" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          {
            echo '```'
            echo
            echo "Open a pull request that adds these lines (docs/ops/DEPLOY.md). This workflow never edits the file."
          } >> "$GITHUB_STEP_SUMMARY"
      # RA-07-06's content-free smoke after the push (RA-20-04; runbook
      # docs/ops/runbooks/staging-smoke.md): anonymous reads of the Data API,
      # Auth and the function health routes, and two read-only catalog
      # queries through psql. It prints statuses and closed values only: no
      # URL, key, row or table contents. It runs after the record step so a
      # red smoke still leaves the list above.
      - name: Smoke secrets and script are present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_STAGING_URL"
          [ -n "$SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing SUPABASE_STAGING_PUBLISHABLE_KEY"
          [ -n "$PROJECT_REF" ] || missing="$missing SUPABASE_STAGING_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Not set on the staging environment:$missing (docs/ops/DEPLOY.md). The migrations were pushed; the smoke did not run."
            exit 1
          fi
          if [ ! -f scripts/ops/staging-smoke.ts ]; then
            echo "::error::scripts/ops/staging-smoke.ts is not on this commit (RA-07-06, #202). The migrations were pushed; the smoke did not run."
            exit 1
          fi
      # The ubuntu-24.04 image lists PostgreSQL 16 with its client
      # (actions/runner-images, images/ubuntu/Ubuntu2404-Readme.md, image
      # 20261012). Checked here, not assumed; Ubuntu's postgresql-client if not.
      - name: PostgreSQL client for the smoke
        run: |
          if command -v psql > /dev/null 2>&1; then
            echo "psql is on the runner: $(psql --version)"
          else
            echo "::notice::psql is not on this runner image; installing postgresql-client from Ubuntu's archive."
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends postgresql-client
            psql --version
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Content-free smoke (RA-07-06)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_STAGING }}
          PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        # --db-only (#202): the database checks only. Function health and Auth
        # belong to deploy-functions.yml and AF-13, which this job does not deploy.
        run: node scripts/ops/staging-smoke.ts --project-ref "$PROJECT_REF" --db-only --summary "$GITHUB_STEP_SUMMARY"

  production:
    name: deploy to production
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'db-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-db-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must point at a commit on main
        # fetch-depth: 0 above brings every branch, so origin/main is present.
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Tag a commit that reached main and staging first."
            exit 1
          fi
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Check the secret exists
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL_PROD is not set on the production environment (docs/ops/DEPLOY.md)."
            exit 1
          fi
      - name: Dry run
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: supabase db push --dry-run --db-url "$DB_URL"
      - name: Push
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: supabase db push --yes --db-url "$DB_URL"
      - name: Files to record in migrations-applied.txt
        run: |
          {
            echo "### production ($GITHUB_REF_NAME): migrations not yet in .github/migrations-applied.txt"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          listed="$(sed -e 's/#.*//' -e 's/[[:space:]]//g' .github/migrations-applied.txt | grep -v '^$' || true)"
          for f in supabase/migrations/*.sql; do
            name="$(basename "$f")"
            if ! printf '%s\n' "$listed" | grep -qxF "$name"; then
              echo "$name" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          {
            echo '```'
            echo
            echo "If staging already recorded them, nothing is left to add. This workflow never edits the file."
          } >> "$GITHUB_STEP_SUMMARY"
