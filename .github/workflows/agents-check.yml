# Keeps the agent team consistent: roster, charters, memory files and the
# dispatcher's own tests. Runs on pull requests that touch any of them.
name: Agents check

on:
  pull_request:
    paths:
      - "agents/**"
      - ".claude/agents/**"
      - "scripts/agents/**"
      - "docs/BACKLOG.md"
      - "docs/agents/**"
  push:
    branches: [develop, main]
    paths:
      - "agents/**"
      - ".claude/agents/**"
      - "scripts/agents/**"

permissions:
  contents: read

jobs:
  check:
    name: agent team consistent
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Roster, charters and memory
        run: node scripts/agents/check.mjs
      - name: Dispatcher tests
        run: node --test 'scripts/agents/*.test.mjs'
