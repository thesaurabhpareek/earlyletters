# Compliance fence (CTO ruling CR-27, aligned with the Chief Compliance Officer; compliance/README.md).
# Protected paths (compliance/FENCE.json) need an `agent:<handle>` label for an assigned agent plus a CCO
# approval and a Karma approval bound to the current head commit. CCO-review paths (the age gate, consent
# SQL) need the CCO approval on the head. Migrations are also caught by what their diff mentions.
#
# Runs on pull_request_target so the copy of this workflow on the base branch is used. It never checks out
# or runs pull request code: the changed files, labels and comments come from the API, and the rules
# (compliance/FENCE.json) and the checker (compliance/fence/fence.mjs) come from the BASE commit through the
# API, so a pull request cannot loosen its own fence. Any API error fails closed.
#
# Limits, stated plainly:
# - Advisory until branch protection on develop and main lists `compliance-fence` as a required check
#   (founder step: scripts/release/apply-branch-settings.sh).
# - Every Claude session posts as the founder's account (CR-20), so the label and the approval prove that
#   the procedure ran, not who ran it.
# - A comment does not re-run this check (an issue_comment workflow would run from main, not develop). After
#   posting the approval, Karma adds the label `karma:approved`; the `labeled` event re-runs the check. The label
#   itself grants nothing: the check reads the approval comment.
name: Compliance fence

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: compliance-fence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compliance-fence:
    name: compliance-fence
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check protected compliance paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=compliance-fence::$1"; exit 1; }
          pr_json="$(gh api "repos/$REPO/pulls/$PR")" || fail "could not read the pull request; failing closed"
          base_sha="$(jq -r .base.sha <<<"$pr_json")"
          head_sha="$(jq -r .head.sha <<<"$pr_json")"
          dir="$RUNNER_TEMP/fence"; mkdir -p "$dir"
          # Fetch a file from the base commit. Exit 0 found, 4 not found (404), 1 any other error.
          fetch() {
            local out
            if out="$(gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/$1?ref=$base_sha" 2>"$dir/err")"; then
              printf '%s' "$out" > "$dir/$2"; return 0
            fi
            if grep -q 'HTTP 404' "$dir/err"; then return 4; fi
            return 1
          }
          set +e; fetch compliance/FENCE.json FENCE.json; c1=$?; fetch compliance/fence/fence.mjs fence.mjs; c2=$?; set -e
          if [ "$c1" = 1 ] || [ "$c2" = 1 ]; then fail "could not read the fence from the base commit; failing closed"; fi
          if [ "$c1" = 4 ] || [ "$c2" = 4 ]; then
            # Bootstrap only when the base truly has no fence (404): this workflow's own first PR. Fail closed on
            # any compliance-looking path, pass otherwise.
            gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename, (.[].previous_filename // empty)' > "$dir/files.txt" \
              || fail "could not list files; failing closed"
            if grep -Eq '^(compliance/|scripts/compliance/|docs/compliance/|supabase/migrations/[^/]*_compliance_|supabase/tests/compliance_|\.claude/skills/(regulatory-compliance|infosec)/|\.claude/agents/regulatory-affairs\.md|\.github/workflows/compliance-fence\.yml|apps/mobile/src/components/gate/|apps/mobile/src/lib/age-gate)' "$dir/files.txt"; then
              fail "the base branch has no compliance fence yet; a PR touching compliance paths needs the founder to merge it by hand"
            fi
            echo "no compliance fence on the base and no compliance path changed"; exit 0
          fi
          files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '[.[] | {filename, previous_filename, patch}]' | jq -s 'add')" \
            || fail "could not list files; failing closed"
          labels="$(jq '[.labels[].name]' <<<"$pr_json")"
          comments="$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '[.[] | {body, login: .user.login}]' | jq -s 'add // []')" \
            || fail "could not read comments; failing closed"
          trusted="$(gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/agents/roster.json?ref=$base_sha" \
            | jq --arg o "$OWNER" '[$o] + (.trusted_bots // [])')" || fail "could not read trusted logins; failing closed"
          jq -n --slurpfile c "$dir/FENCE.json" --argjson files "$files" --argjson labels "$labels" \
            --argjson comments "$comments" --argjson trusted "$trusted" --arg head "$head_sha" \
            '{config: $c[0], files: $files, labels: $labels, comments: $comments, trustedLogins: $trusted, headSha: $head}' \
            | node "$dir/fence.mjs"
