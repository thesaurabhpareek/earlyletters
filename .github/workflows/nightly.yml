# Nightly checks (TDD 07 section 10). Not required for merging.
#   fuzz  the verifier property test with a random seed and 10x the PR run
#         count (TDD 03 7.2). packages/core/test/verify.fuzz.test.ts reads
#         SCRIBE_FUZZ_SEED and SCRIBE_FUZZ_RUNS; PR CI pins the seed.
#   db    the same real-stack checks as db-cli.yml (start, reset, lint, test:db).
#   perf  the database plan checks and p95 budgets at launch scale (1,000 families
#         x 400 letters). Pull requests run the plan checks at 250 x 400 and do not
#         check budgets, so a slow runner cannot turn `required` red (S02, after #214).
#   legacy-grants  the database rules (PGlite) with Supabase's old automatic grants
#         (SCRIBE_DEFAULT_GRANTS=legacy). Pull requests run them without the
#         automatic grants, the world of every project created since 30 May 2026
#         (supabase/tests/harness.mjs), and db-cli.yml runs this legacy pass too on
#         every pull request that changes supabase/**. GitHub runs this file only
#         once it is on the default branch (main); until then db-cli.yml is the
#         proof.
#   report  a red scheduled run opens one `nightly` issue with the run link, or
#         comments on the one already open (never a second); a green scheduled
#         run closes it (RA-20-19; AUTOMATION.md 2.8; B2-22).
# Actions are pinned to commit SHAs (CI-06); the comment names the tag.
name: Nightly

on:
  schedule:
    - cron: '23 10 * * *' # 10:23 UTC daily (03:23 in California during daylight time)
  workflow_dispatch:
    inputs:
      seed:
        description: Fuzz seed to replay (blank for a random one)
        required: false
        default: ''
      runs:
        description: Fuzz runs
        required: false
        default: '100000'
      report_issue:
        description: Open or close the nightly issue as a scheduled run does (the planted failure in AUTOMATION.md 2.12)
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true

jobs:
  fuzz:
    name: verifier fuzz (random seed)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Pick the seed
        env:
          INPUT_SEED: ${{ inputs.seed }}
          INPUT_RUNS: ${{ inputs.runs }}
        run: |
          seed="${INPUT_SEED:-$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')}"
          runs="${INPUT_RUNS:-100000}"
          case "$seed$runs" in *[!0-9]*) echo "::error::seed and runs must be whole numbers"; exit 1 ;; esac
          echo "SCRIBE_FUZZ_SEED=$seed" >> "$GITHUB_ENV"
          echo "SCRIBE_FUZZ_RUNS=$runs" >> "$GITHUB_ENV"
          {
            echo "### Verifier fuzz"
            echo "Seed \`$seed\`, runs \`$runs\`. Replay locally:"
            echo
            echo "\`SCRIBE_FUZZ_SEED=$seed SCRIBE_FUZZ_RUNS=$runs npm test -w @scribe/core -- test/verify.fuzz.test.ts test/verify.r01.fuzz.test.ts --testTimeout=900000\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # The long timeout is needed because vitest's default (5 s) is per test
      # and the property test is one test; 100000 runs took about 20 s locally.
      - name: Property test
        run: npm test -w @scribe/core -- test/verify.fuzz.test.ts test/verify.r01.fuzz.test.ts --testTimeout=900000

  db:
    name: database (real stack)
    uses: ./.github/workflows/db-cli.yml

  perf:
    name: database performance budgets (launch scale)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # PERF_BUDGETS=1 seeds 1,000 x 400 and checks every p95 budget as well as every plan
      # (supabase/tests/perf.test.mjs, sync_perf.test.mjs). About 1.5 minutes locally.
      - name: Plans and p95 budgets, 400,000 letters (PGlite)
        env:
          PERF_BUDGETS: '1'
        run: npm run test:db:perf

  legacy-grants:
    name: database rules (old automatic grants)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Access rules, governance, classification, performance (PGlite, old automatic grants)
        env:
          SCRIBE_DEFAULT_GRANTS: legacy
        run: npm run test:db

  # RA-20-19. Scheduled runs only, or a dispatch with report_issue on. No checkout and no install: the script
  # below is the whole job, run by the image's Node. The default GITHUB_TOKEN here holds issues: write and nothing
  # else (job permissions replace the workflow's). It touches only open `nightly` issues this job opened
  # (github-actions[bot]), so a person's issue with the label is never commented on or closed. The text is the run
  # link, the time and the red jobs' names: no content. apps/mobile/test/nightly-issue.test.ts runs this exact
  # script against a stand-in for the GitHub API.
  report:
    name: nightly issue (opened on red, closed on green)
    needs: [fuzz, db, perf, legacy-grants]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.report_issue) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the nightly issue
        id: nightly-issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'JS'
          const api = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          const BOT = 'github-actions[bot]';
          async function call(method, path, body, okStatuses = []) {
            const res = await fetch(api + path, {
              method,
              headers: {
                authorization: `Bearer ${process.env.GH_TOKEN}`,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
                'content-type': 'application/json',
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            if (!res.ok && !okStatuses.includes(res.status)) throw new Error(`${method} ${path.split('?')[0]}: HTTP ${res.status}`);
            return res.status === 204 || !res.ok ? null : res.json();
          }
          const red = Object.entries(JSON.parse(process.env.NEEDS))
            .filter(([, job]) => job.result !== 'success')
            .map(([name, job]) => `${name}: ${job.result}`);
          const when = `${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC`;
          // Oldest first; only issues this job opened, never a pull request.
          const listed = await call('GET', '/issues?labels=nightly&state=open&sort=created&direction=asc&per_page=100');
          const open = listed.filter((i) => !i.pull_request && i.user?.login === BOT);
          if (red.length) {
            const body = `The nightly run of ${when} is red: ${process.env.RUN_URL}\n\n${red.map((r) => `- ${r}`).join('\n')}`;
            if (open.length) {
              await call('POST', `/issues/${open[0].number}/comments`, { body });
              console.log(`red: commented on #${open[0].number}`);
            } else {
              // 422: the label exists already.
              await call('POST', '/labels', { name: 'nightly', color: 'd73a4a', description: 'A red nightly run (nightly.yml)' }, [422]);
              const issue = await call('POST', '/issues', { title: 'Nightly checks are red', body: `${body}\n\nThe next green nightly run closes this issue.`, labels: ['nightly'] });
              // A label dropped on create would hide this issue from the next run and open a second one.
              if (!issue.labels?.some((l) => (l.name ?? l) === 'nightly')) await call('POST', `/issues/${issue.number}/labels`, { labels: ['nightly'] });
              console.log(`red: opened #${issue.number}`);
            }
          } else {
            for (const i of open) {
              await call('POST', `/issues/${i.number}/comments`, { body: `Green again on ${when}: ${process.env.RUN_URL}` });
              await call('PATCH', `/issues/${i.number}`, { state: 'closed', state_reason: 'completed' });
              console.log(`green: closed #${i.number}`);
            }
            if (!open.length) console.log('green: no nightly issue open');
          }
          JS
