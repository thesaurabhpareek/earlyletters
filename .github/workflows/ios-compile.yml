# Compiles the iOS app, including every Swift file under apps/mobile/modules, for the iOS Simulator. No signing,
# no secrets, no upload: it proves the native project generates and builds before anyone spends an EAS build on
# it. Until this runs, no Swift in this repository has ever been compiled.
#
# What it does: npm ci; `expo prebuild --platform ios --no-install` with the env of the eas.json `testflight`
# profile and EXPO_PUBLIC_SERVER_FEATURES=off; pod install; xcodebuild for the simulator with
# CODE_SIGNING_ALLOWED=NO. Compile errors become annotations on the file and line, and a list in the run summary.
#
# Runner and Xcode, checked on 16 Oct 2026:
# - Expo SDK 57 needs Xcode 26.4 or later (docs.expo.dev/versions/v57.0.0, "Support for Android and iOS versions";
#   source expo/expo packages/@expo/sdk-compatibility/src/sdk-compatibility.json: "xcodeVersionRange": ">=26.4.0").
# - macos-15 tops out at Xcode 26.3, so this uses macos-26 (arm64, 3 CPU, 7 GB), whose image ships Xcode 26.4.1,
#   26.5 and 26.6 (actions/runner-images images/macos/macos-26-arm64-Readme.md, image 20260907.0351.1).
#   XCODE_VERSION pins 26.6; the job fails with the list of installed Xcodes if the image drops it.
# - Standard GitHub-hosted runners, macOS included, are free and unlimited for public repositories
#   (docs.github.com/en/actions/reference/runners/github-hosted-runners, "Standard GitHub-hosted runners for
#   public repositories"). This repository is public.
#
# Caches: CocoaPods (the download cache and ios/Pods, keyed on the lockfile, the app config and the podspecs) and
# DerivedData (keyed on the same plus the Swift sources, restoring the newest older one, so a re-run in the same
# pull request builds incrementally). A pull request's caches are its own; once this file is on the default branch,
# a workflow_dispatch run on develop seeds caches every pull request can read.
#
# Two jobs since 24 Oct 2026: `compile` (the above, Debug, on a change to native files: the `changes` job decides)
# and `launch` (the store build's JavaScript in Release, installed and launched on a simulator for 20 s, on every
# mobile change). A build that compiles can still crash at launch: every Release bundle did until #276, and no
# check here had launched one.
name: iOS compile

on:
  pull_request:
    # Every mobile change for `launch` (the app's JavaScript is apps/mobile and the packages it bundles). `compile`
    # keeps its native-only list through the `changes` job.
    paths:
      - apps/mobile/**
      - packages/**
      - package-lock.json
      - .github/workflows/ios-compile.yml
      - .github/scripts/sim-crash-report.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  XCODE_VERSION: '26.6'
  NODE_VERSION: '22'

jobs:
  compile:
    name: iOS simulator build (no signing)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Step helper (failures become annotations)
        run: |
          cat > "$RUNNER_TEMP/step.sh" <<'SH'
          #!/usr/bin/env bash
          # step.sh <title> <command...>: runs the command, keeps its output in $RUNNER_TEMP/<title>.log, and on
          # failure turns the last 60 lines into one error annotation (the full log stays in the job log).
          title="$1"; shift
          log="$RUNNER_TEMP/${title// /-}.log"
          "$@" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -60 "$log" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > "$log.tail"
            echo "::error title=${title} failed (exit ${status})::$(cat "$log.tail")"
          fi
          exit "$status"
          SH
          chmod +x "$RUNNER_TEMP/step.sh"

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -euo pipefail
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            echo "::error::Xcode ${XCODE_VERSION} is not on this image. Installed:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci
        run: '"$RUNNER_TEMP/step.sh" "npm ci" npm ci --no-audit --no-fund'

      - name: Build env from the eas.json testflight profile (server features off)
        run: |
          set -euo pipefail
          node -e '
            const env = require("./apps/mobile/eas.json").build.testflight.env || {};
            env.EXPO_PUBLIC_SERVER_FEATURES = "off";
            for (const [k, v] of Object.entries(env)) {
              if (!/^EXPO_PUBLIC_[A-Z0-9_]+$/.test(k) || /[\r\n]/.test(String(v))) { console.error("refusing " + k); process.exit(1); }
              console.log(k + "=" + v);
            }
          ' | tee -a "$GITHUB_ENV"

      - name: expo prebuild --platform ios --no-install
        working-directory: apps/mobile
        run: '"$RUNNER_TEMP/step.sh" "expo prebuild" npx expo prebuild --platform ios --no-install --clean'

      - name: Native project facts
        id: project
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          # prebuild writes <Name>.xcodeproj; pod install adds <Name>.xcworkspace next to it.
          shopt -s nullglob
          projects=(*.xcodeproj)
          if [ "${#projects[@]}" -ne 1 ]; then echo "::error::expected one .xcodeproj in apps/mobile/ios, found: ${projects[*]:-none}"; ls -la; exit 1; fi
          name="${projects[0]%.xcodeproj}"
          echo "workspace=${name}.xcworkspace" >> "$GITHUB_OUTPUT"
          echo "scheme=${name}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Native project::${name}.xcodeproj; Podfile.properties.json: $(tr -d '\n' < Podfile.properties.json)"

      - name: Restore CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            apps/mobile/ios/Pods
          key: pods-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('package-lock.json', 'apps/mobile/app.config.ts', 'apps/mobile/modules/**/*.podspec', 'apps/mobile/ios/Podfile.properties.json') }}
          restore-keys: |
            pods-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: pod install
        working-directory: apps/mobile/ios
        run: '"$RUNNER_TEMP/step.sh" "pod install" pod install'

      - name: Restore DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/DerivedData
          key: dd-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('package-lock.json', 'apps/mobile/app.config.ts', 'apps/mobile/modules/**') }}
          restore-keys: |
            dd-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: xcodebuild (iOS Simulator, Debug, CODE_SIGNING_ALLOWED=NO)
        working-directory: apps/mobile/ios
        env:
          WORKSPACE: ${{ steps.project.outputs.workspace }}
          SCHEME: ${{ steps.project.outputs.scheme }}
        run: |
          # The default shell stops at the first failure; this step reports the errors before it fails.
          set +e
          set -uo pipefail
          log="$RUNNER_TEMP/xcodebuild.log"
          # Full log to a file; only the lines a person needs on screen.
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -IDEBuildingContinueBuildingAfterErrors=YES \
            build > "$log" 2>&1
          status=$?
          grep -E '(error|warning): |\*\* BUILD (SUCCEEDED|FAILED) \*\*|^The following build commands failed' "$log" | grep -v '/Pods/' | head -400 || true
          # Every compile error as an annotation on its file and line, and a list in the summary.
          root="$GITHUB_WORKSPACE/"
          {
            echo "### iOS compile: $([ $status -eq 0 ] && echo succeeded || echo failed) (Xcode ${XCODE_VERSION}, scheme ${SCHEME})"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          errors="$RUNNER_TEMP/compile-errors.txt"
          grep -E '^/[^:]+:[0-9]+:[0-9]+: (fatal )?error: ' "$log" | sed -e "s#^${root}##" | sort -u > "$errors" || true
          count=$(wc -l < "$errors" | tr -d ' ')
          # GitHub shows at most 10 error annotations per step: the first 9 go on their file and line, and one more
          # carries the whole list, so the API (check-run annotations) always has every error.
          n=0
          while IFS= read -r line; do
            n=$((n + 1)); [ "$n" -gt 9 ] && break
            rel="${line%%:*}"; rest="${line#*:}"; ln="${rest%%:*}"; rest="${rest#*:}"; col="${rest%%:*}"; msg="${rest#*error: }"
            echo "::error file=${rel},line=${ln},col=${col}::${msg//%/%25}"
          done < "$errors"
          if [ "$count" -gt 0 ]; then
            echo "::error title=${count} compile error(s)::$(sed -e 's/%/%25/g' "$errors" | head -200 | awk 'BEGIN{ORS="%0A"} {print}')"
            sed -e 's/^/- `/' -e 's/: \(fatal \)\{0,1\}error: /`: /' "$errors" >> "$GITHUB_STEP_SUMMARY"
          elif [ $status -ne 0 ]; then
            # Failed without a compiler error (a script phase, the linker, a missing file): annotate the failure section.
            { grep -E -A 20 '^The following build commands failed' "$log"; echo '...'; tail -60 "$log"; } | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > "$RUNNER_TEMP/fail.txt"
            echo "::error title=xcodebuild failed (exit ${status}) without a compiler error::$(cat "$RUNNER_TEMP/fail.txt")"
          else
            echo "::notice title=iOS compile succeeded::Xcode ${XCODE_VERSION}, scheme ${SCHEME}, $(grep -c ': warning: ' "$log" || true) warnings in total"
          fi
          # Each local module on its own: built (its product exists), or how many of the errors are in its files.
          # xcodebuild keeps going after an error (above), so one broken module does not hide the others.
          products="$RUNNER_TEMP/DerivedData/Build/Products"
          modules=""
          for spec in "$GITHUB_WORKSPACE"/apps/mobile/modules/*/ios/*.podspec; do
            pod=$(basename "$spec" .podspec)
            dir=$(basename "$(dirname "$(dirname "$spec")")")
            errs=$(grep -c "apps/mobile/modules/${dir}/" "$errors" || true)
            if [ -n "$(find "$products" -maxdepth 3 \( -name "lib${pod}.a" -o -name "${pod}.framework" \) -print -quit 2>/dev/null)" ]; then
              state="built"
            elif [ "$errs" -gt 0 ]; then
              state="FAILED, ${errs} error(s)"
            else
              state="not built (no error in its files; a dependency or the build stopped first)"
            fi
            modules="${modules}${dir} (${pod}): ${state}%0A"
            echo "- ${dir} (\`${pod}\`): ${state}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "::notice title=Local modules::${modules}"
          if [ $status -ne 0 ]; then
            echo "Last 150 lines of the log:"; tail -150 "$log"
          fi
          exit $status

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 14

  # Which files changed: the Debug compile above keeps its native-only scope; the launch check below runs on every
  # mobile change. A diff git cannot answer runs the compile (never a reason to skip).
  changes:
    name: native files changed?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          native=true
          if [ "$EVENT" = pull_request ] && files="$(git diff --name-only "${BASE}...${HEAD}")"; then
            if ! grep -qE '^(apps/mobile/modules/|apps/mobile/app\.config\.ts$|apps/mobile/package\.json$|apps/mobile/ios/|package-lock\.json$|\.github/workflows/ios-compile\.yml$)' <<< "$files"; then
              native=false
            fi
          fi
          echo "native=${native}" | tee -a "$GITHUB_OUTPUT"

  # The store build's JavaScript, Release, launched: the check that would have stopped the build-1 launch crash
  # (#276: every Release bundle threw at lib/billing/letter-ledger.native.ts:10, found by kill-harness.yml's launch
  # job). It builds the testflight profile's env (servers off, no EXPO_PUBLIC_E2E), checks the bundle carries no seam
  # and has its source map, installs it on a simulator and fails if, 20 s after launch, the app is gone, the
  # simulator log cannot be read, the log holds no line from the app, or it holds an RCTFatalException. On failure,
  # .github/scripts/sim-crash-report.sh prints the uncaught exception and its stack read back to file and line.
  # The same check runs in kill-harness.yml (release-launch); this one runs on every mobile change.
  launch:
    name: store-profile Release launch (testflight env, no seam, 20 s)
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -euo pipefail
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            echo "::error::Xcode ${XCODE_VERSION} is not on this image. Installed:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$app/Contents/Developer"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Build env from the eas.json testflight profile (server features off, no e2e)
        run: |
          set -euo pipefail
          node -e '
            const env = require("./apps/mobile/eas.json").build.testflight.env || {};
            env.EXPO_PUBLIC_SERVER_FEATURES = "off";
            if ("EXPO_PUBLIC_E2E" in env) { console.error("the testflight profile must not set EXPO_PUBLIC_E2E (B-9)"); process.exit(1); }
            for (const [k, v] of Object.entries(env)) {
              if (!/^EXPO_PUBLIC_[A-Z0-9_]+$/.test(k) || /[\r\n]/.test(String(v))) { console.error("refusing " + k); process.exit(1); }
              console.log(k + "=" + v);
            }
          ' | tee -a "$GITHUB_ENV"

      - name: expo prebuild --platform ios --no-install
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Native project facts
        id: project
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          shopt -s nullglob
          projects=(*.xcodeproj)
          if [ "${#projects[@]}" -ne 1 ]; then echo "::error::expected one .xcodeproj in apps/mobile/ios, found: ${projects[*]:-none}"; exit 1; fi
          name="${projects[0]%.xcodeproj}"
          echo "workspace=${name}.xcworkspace" >> "$GITHUB_OUTPUT"
          echo "scheme=${name}" >> "$GITHUB_OUTPUT"

      - name: Restore CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            apps/mobile/ios/Pods
          key: pods-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('package-lock.json', 'apps/mobile/app.config.ts', 'apps/mobile/modules/**/*.podspec', 'apps/mobile/ios/Podfile.properties.json') }}
          restore-keys: |
            pods-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: pod install
        working-directory: apps/mobile/ios
        run: pod install

      # Restore only: the Release DerivedData that kill-harness.yml's builds save on develop, read by every pull
      # request, so the build is mostly the JavaScript bundle and the app target. A pull request saves none of its own.
      - name: Restore DerivedData (Release)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/DerivedData
          key: dd-release-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('package-lock.json', 'apps/mobile/app.config.ts', 'apps/mobile/modules/**') }}
          restore-keys: |
            dd-release-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: xcodebuild (iOS Simulator, Release, CODE_SIGNING_ALLOWED=NO)
        working-directory: apps/mobile/ios
        env:
          WORKSPACE: ${{ steps.project.outputs.workspace }}
          SCHEME: ${{ steps.project.outputs.scheme }}
        run: |
          set +e
          log="$RUNNER_TEMP/xcodebuild-release.log"
          mkdir -p "$RUNNER_TEMP/store-app"
          # The bundle phase writes the Hermes source map here (react-native-xcode.sh) and keeps no copy in the app.
          export SOURCEMAP_FILE="$RUNNER_TEMP/store-app/main.jsbundle.map"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            build > "$log" 2>&1
          status=$?
          echo "- store-profile Release build: exit ${status} after $((SECONDS / 60)) min $((SECONDS % 60)) s on runner image ${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          grep -E '(fatal )?error: |\*\* BUILD (SUCCEEDED|FAILED) \*\*' "$log" | grep -v '/Pods/' | head -200
          if [ "$status" -ne 0 ]; then echo "::error title=xcodebuild failed (exit ${status})::store-profile Release build"; tail -150 "$log"; fi
          exit "$status"

      - name: The app is the store-profile build, carries no seam and has its source map
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -n 1)"
          [ -n "$app" ] || { echo "::error::no .app in the Release-iphonesimulator products"; exit 1; }
          id="$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")"
          case "$id" in
            *.preview) ;;
            *) echo "::error::bundle id ${id} is not the preview one the testflight profile builds"; exit 1 ;;
          esac
          [ -f "$app/main.jsbundle" ] || { echo "::error::no main.jsbundle in the app"; exit 1; }
          if grep -aq e2eKillDrill "$app/main.jsbundle"; then echo "::error::the store-profile bundle carries the e2e seam (B-8)"; exit 1; fi
          [ -s "$RUNNER_TEMP/store-app/main.jsbundle.map" ] || { echo "::error::no Hermes source map at \$RUNNER_TEMP/store-app/main.jsbundle.map"; exit 1; }
          ditto "$app" "$RUNNER_TEMP/store-app/App.app"
          echo "APP_ID=$id" >> "$GITHUB_ENV"

      # Step timeouts, so a hung boot or launch frees the runner (5 macOS jobs at once on this plan): the boot took
      # 6m39s on #284's run and 2 to 3 min before; the launch step (install, launch, 20 s, log read) took 1m23s to 4m07s.
      - name: Simulator
        timeout-minutes: 15
        run: |
          set -euo pipefail
          udid=""
          for type in 'iPhone SE (3rd generation)' 'iPhone 17e'; do
            if udid="$(xcrun simctl create launch-sim "$type" 2>/dev/null)"; then break; fi
            udid=""
            echo "::warning::no '${type}' simulator on this image"
          done
          [ -n "$udid" ] || { echo "::error::could not create a simulator"; exit 1; }
          xcrun simctl bootstatus "$udid" -b > "$RUNNER_TEMP/bootstatus.log" 2>&1 || { tail -40 "$RUNNER_TEMP/bootstatus.log"; exit 1; }
          echo "::notice title=Simulator::${type}"
          echo "UDID=$udid" >> "$GITHUB_ENV"

      - name: Launch and stay up for 20 s
        timeout-minutes: 10
        run: |
          set -euo pipefail
          xcrun simctl install "$UDID" "$RUNNER_TEMP/store-app/App.app"
          out="$(xcrun simctl launch "$UDID" "$APP_ID")"
          pid="${out##*: }"
          echo "launched ${APP_ID}, pid ${pid}"
          sleep 20
          exe="$(plutil -extract CFBundleExecutable raw "$RUNNER_TEMP/store-app/App.app/Info.plist")"
          log="$RUNNER_TEMP/launch-log.txt"
          if ! xcrun simctl spawn "$UDID" log show --last 2m --style compact --predicate "process == \"${exe}\"" > "$log" 2>&1; then
            echo "::error title=Release launch::could not read the simulator log, so the launch was not checked"
            tail -20 "$log" | sed -e 's/::/: :/g' -e 's/##\[/# #[/g'
            exit 1
          fi
          if ! grep -qF "${exe}[" "$log"; then
            echo "::error title=Release launch::the simulator log holds no line from the app, so the launch was not observed"; exit 1
          fi
          if grep -q RCTFatalException "$log"; then
            echo "::error title=Release launch::the store-profile app threw an unhandled JavaScript exception at launch"; exit 1
          fi
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error title=Release launch::the store-profile app is gone 20 s after launch"; exit 1
          fi
          echo "::notice title=Release launch::the store-profile app is up 20 s after launch, no fatal exception"
          echo "- store-profile Release app: up 20 s after launch, no fatal exception" >> "$GITHUB_STEP_SUMMARY"

      - name: Why the app stopped (on failure)
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          if [ -n "${UDID:-}" ] && [ -f "$RUNNER_TEMP/store-app/App.app/Info.plist" ]; then
            .github/scripts/sim-crash-report.sh "$UDID" "$RUNNER_TEMP/store-app/App.app" "$RUNNER_TEMP/diag" "$RUNNER_TEMP/store-app/main.jsbundle.map"
          else
            echo "no simulator or no app yet: nothing to report"
          fi
          exit 0

      - name: Keep the diagnostics and the build log (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/diag
            ${{ runner.temp }}/xcodebuild-release.log
          if-no-files-found: ignore
          retention-days: 14
