# Web journeys (CR-37 pipeline step 1). The real app, exported for the web and driven in Chromium at phone size by
# Playwright: every flow in apps/mobile/e2e-web (about 90 tests, the J01 to J22 journeys and their unhappy paths).
# A stand-in for a device, not a replacement (e2e-web/playwright.config.ts says what it cannot prove).
#
# When: on a pull request that changes the app's screens (apps/mobile/src/**), the flows themselves
# (apps/mobile/e2e-web/**) or the words the app says (packages/content/**), and nightly. Not required for merging
# (it is not in the `required` job of ci.yml); a red run is read like any other check. GitHub runs the schedule only
# once this file is on the default branch (main).
#
# What it does: npm install from the lockfile cache (.github/actions/setup); Chromium for the pinned @playwright/test
# version in package-lock.json (cached by that version, the OS packages it needs installed every run); then
# `npm run e2e:web -w @scribe/mobile`, whose global setup makes the three web exports (plain, design preview, server
# features on) and serves them. The config reads PLAYWRIGHT_CHROMIUM_PATH, set here from Playwright itself.
# On failure the HTML report, traces and screenshots (apps/mobile/e2e-web/.results) are kept for 14 days.
#
# Time: about 15 minutes for the flows on 2 workers (CI=1 sets 2), plus 3 to 5 for the exports; the timeout leaves
# room for a slow runner. If it nears the timeout, shard (`playwright test --shard=1/2`) rather than raise it.
#
# Actions are pinned to commit SHAs (CI-06); the comment names the tag.
name: Web journeys

on:
  pull_request:
    paths:
      - apps/mobile/src/**
      - apps/mobile/e2e-web/**
      - packages/content/**
      - .github/workflows/web-journeys.yml
  schedule:
    - cron: '41 10 * * *' # 10:41 UTC daily, after nightly.yml (03:41 in California during daylight time)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-journeys-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  flows:
    name: web journeys (Playwright, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Playwright version (from the lockfile)
        id: pw
        working-directory: apps/mobile
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # --with-deps installs the OS libraries Chromium needs (apt); the browser download is skipped when cached.
      - name: Install Chromium for that version
        working-directory: apps/mobile
        run: |
          npx --no-install playwright install --with-deps chromium
          path="$(node -p "require('@playwright/test').chromium.executablePath()")"
          test -x "$path" || { echo "::error::Chromium not found at $path"; exit 1; }
          echo "PLAYWRIGHT_CHROMIUM_PATH=$path" >> "$GITHUB_ENV"

      - name: Run every web flow
        run: npm run e2e:web -w @scribe/mobile

      - name: Keep the report, traces and screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-journeys-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/mobile/e2e-web/.results/report
            apps/mobile/e2e-web/.results/artifacts
          if-no-files-found: ignore
          retention-days: 14
