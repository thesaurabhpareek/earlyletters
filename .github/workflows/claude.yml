# @claude anywhere in this repo, for the founder only. Mention @claude in an
# issue, a PR comment or a review and Claude Code answers or makes the change
# on a branch. On this public repo, mentions from anyone else are ignored.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.author_association == 'OWNER') ||
      (github.event_name == 'issues' && contains(format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude') && github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      # Until the founder adds ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN
      # (docs/agents/HARNESS.md section 12) this job ends here, green, with a
      # notice, instead of failing on a missing credential.
      - name: Check credentials
        id: creds
        env:
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_API_KEY" = "true" ] || [ "$HAS_OAUTH_TOKEN" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@claude is not switched on: add the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret (docs/agents/HARNESS.md section 12). Skipping."
          fi
      # develop is the integration branch; main is only updated on release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.ready == 'true'
        with:
          ref: develop
          fetch-depth: 0
      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        uses: ./.github/actions/setup
      - uses: anthropics/claude-code-action@v1
        if: steps.creds.outputs.ready == 'true'
        with:
          # Either secret works. CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`)
          # uses the founder's own subscription; this workflow only runs when he
          # mentions @claude himself.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: develop
          track_progress: true
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
