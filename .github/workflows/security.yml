# Secret scanning of the full history and a production dependency audit (CI-05).
# Not part of the `required` aggregator: a newly published advisory should not
# block unrelated pull requests. See .github/README.md for which checks to
# require once branch protection exists.
name: Security

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC: catches advisories published since the last push
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release checksums file.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: secrets (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      # Pull requests scan every commit reachable from the PR (base history plus
      # the PR), so a PR is not failed by fixtures on unrelated branches.
      # Pushes, the weekly run and manual runs scan every branch.
      - name: Scan commits
        env:
          SCOPE: ${{ github.event_name == 'pull_request' && 'HEAD' || '--all' }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .github/gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="$SCOPE" .

  audit:
    name: npm audit (production, high)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Reads only package-lock.json; no install needed. The dated ignore list
      # is .github/audit-ignore.json. Never run `npm audit fix --force`.
      # npm exits nonzero both when it finds advisories (some are on the ignore
      # list) and when the audit itself fails, so its status is captured, not
      # discarded, and handed to the gate. The gate fails closed on empty or
      # non-JSON output, an npm `error` object, a report without the expected
      # shape, or a nonzero exit that no reported advisory explains.
      - name: npm audit --omit=dev --audit-level=high, with the reviewed ignore list
        run: |
          status=0
          npm audit --omit=dev --audit-level=high --json > "$RUNNER_TEMP/audit.json" || status=$?
          echo "npm audit exit status: $status"
          node .github/scripts/audit-gate.mjs --level high --ignore .github/audit-ignore.json --npm-exit "$status" < "$RUNNER_TEMP/audit.json"
