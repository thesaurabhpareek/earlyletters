name: Bug
description: Something in Early Letters is broken or wrong.
title: "bug: "
labels: ["bug", "inbox"]
body:
  - type: markdown
    attributes:
      value: |
        **This is a public repo. Do not paste any letter text, transcript, audio or child name.**
        Describe the problem in your own words. If you need an example, use the made-up family "Asha". Never a real family.
        Issues are intake only. The founder moves real work into `docs/BACKLOG.md`.
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you did and what you saw. Short is fine.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: App version or build
      description: For example 1.0 (12). TestFlight shows it under the app name.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      description: For example iPhone 15, iOS 19.1.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not paste any letter text, transcript, audio or child name.
          required: true
