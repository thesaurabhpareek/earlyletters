name: good prt
on:
  pull_request_target:
    types: [opened]
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.1.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: safe interpolation
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE"
