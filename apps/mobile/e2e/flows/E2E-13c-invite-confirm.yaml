# E2E-13c  Co-parent invite round trip, back on simulator A (Mama): the joined
# co-parent appears as a member and the pending invite is gone (sync pull;
# PRD 7.3 budget is p95 5 s, measured on device; here up to 60 s).
appId: ${APP_ID}
name: E2E-13c Co-parent invite, confirm (simulator A)
tags:
  - e2e-coparent
  - E2E-13
  - p0-nightly
  - B-REQ-007
  - needs-backend
---
- launchApp:
    stopApp: true
# With a co-parent joined the row's value is their signature and it opens the family page (a pushed page, no tab).
- runFlow:
    file: ../subflows/open-settings.yaml
- tapOn: "Asha"
- tapOn:
    id: "child.bookRow"
- extendedWaitUntil:
    visible:
      id: "family.member"
      index: 1
    timeout: 60000
- assertNotVisible:
    id: "family.pending"
- stopApp
