# E2E-13a  Co-parent invite round trip, simulator A (Mama): make the invite.
# Run by bin/run-coparent.sh, which then reads the link from simulator A's
# pasteboard (`xcrun simctl pbpaste`) and hands it to E2E-13b on simulator B.
# Proves (with 13b and 13c): B-REQ-007 (a parent invites a co-parent to one
# child's book; the link works once), A-REQ-028 (the invite survives the 18+
# gate and sign-in on the other phone), PRD-REQ-014 (the invite names one
# child), D-055 (co-parent only at launch).
appId: ${APP_ID}
name: E2E-13a Co-parent invite, create (simulator A)
tags:
  - e2e-coparent
  - E2E-13
  - p0-nightly
  - B-REQ-007
  - PRD-REQ-014
  - D-055
  - needs-backend
env:
  E2E_EMAIL: ${MAMA_EMAIL || "delivered+e2e13-mama@resend.dev"}
---
- runFlow:
    file: ../subflows/launch-fresh.yaml
    env:
      E2E_SEED: "asha"
# Family is not a tab (founder, 11 Nov 2026). The invite starts from Settings > Asha > "Write this book together". UNVERIFIED on a device.
- runFlow:
    file: ../subflows/open-settings.yaml
- tapOn: "Asha"
- tapOn:
    id: "child.bookRow"
- assertVisible:
    id: "inviteNew.screen"
- runFlow:
    file: ../subflows/sign-in-email.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL}
# Signed in and consented: the invite sheet again; the book syncs first.
- extendedWaitUntil:
    visible:
      id: "inviteNew.share"
    timeout: 30000
- tapOn:
    id: "inviteNew.share"
# The system share sheet: Copy puts the message (with the link) on A's pasteboard.
- extendedWaitUntil:
    visible:
      text: "Copy"
    timeout: 10000
- tapOn: "Copy"
- extendedWaitUntil:
    notVisible:
      id: "inviteNew.share"
    timeout: 15000
- stopApp
