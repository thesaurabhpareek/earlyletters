# A fresh install: app data, Keychain and permissions reset, then launch with
# the e2e seams from TESTID_REQUESTS.md section 3. Parameters (runFlow env):
# E2E_SEED, E2E_OFFLINE, E2E_TRANSCRIBER, E2E_CLOCK_OFFSET_HOURS, E2E_CONFIG.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: unset
    arguments:
      e2eSeed: ${E2E_SEED || "none"}
      e2eOffline: ${E2E_OFFLINE || "0"}
      e2eTranscriber: ${E2E_TRANSCRIBER || "auto"}
      e2eClockOffsetHours: ${E2E_CLOCK_OFFSET_HOURS || "0"}
      e2eConfig: '${E2E_CONFIG || "{}"}'
- runFlow:
    when:
      true: ${E2E_DEV_CLIENT == "1"}
    file: dev-client-open.yaml
