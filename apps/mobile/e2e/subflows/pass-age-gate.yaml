# Answer Before you begin (PRD-REQ-019, LEGAL-REQ-002, founder decision F2): Yes plus the agreement box.
# Continue is never disabled; tapped too early it shows the reason line and stores nothing, which is how
# flows prove nothing is preselected (no answer, box unticked).
appId: ${APP_ID}
---
- assertVisible:
    id: "gate.screen"
- scrollUntilVisible:
    element:
      id: "gate.continue"
    direction: DOWN
- tapOn:
    id: "gate.continue"
- assertVisible:
    id: "gate.reason"
- assertVisible:
    id: "gate.screen"
- scrollUntilVisible:
    element:
      id: "gate.yes"
    direction: UP
- tapOn:
    id: "gate.yes"
- scrollUntilVisible:
    element:
      id: "gate.agree"
    direction: DOWN
- tapOn:
    id: "gate.agree"
- scrollUntilVisible:
    element:
      id: "gate.continue"
    direction: DOWN
- tapOn:
    id: "gate.continue"
- assertNotVisible:
    id: "gate.screen"
