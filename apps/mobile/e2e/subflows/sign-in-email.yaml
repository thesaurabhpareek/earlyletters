# Sign in with the email code, confirm the account, then the consent sheets
# (PRD A F4, A-REQ-018; PRD-REQ-002; G-01 "Is this your account?", G-05 8-digit
# code). Starts on a screen that shows the sign-in sheet (signIn.sheet).
# Parameters: E2E_EMAIL, OTP_SOURCE (admin or mailpit), NEW_USER, SENSITIVE
# (agree, the default, or decline).
appId: ${APP_ID}
---
- runFlow:
    file: sign-in-code.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL}
      OTP_SOURCE: ${OTP_SOURCE || "admin"}
      NEW_USER: ${NEW_USER || "0"}
# G-01: the first sign-in on a phone whose letters belong to no account yet
# shows the account email and claims nothing until "Yes, this is me".
- runFlow:
    when:
      visible:
        id: "accountConfirm.screen"
    commands:
      - assertVisible:
          id: "accountConfirm.email"
      - assertVisible:
          id: "accountConfirm.no"
      - tapOn:
          id: "accountConfirm.yes"
# Consent sheets, whichever my_sync_gate() asks for (AUTH_SETUP section 9).
- extendedWaitUntil:
    visible:
      id: "consent.(terms|age|sensitive).*"
    timeout: 15000
- runFlow:
    when:
      visible:
        id: "consent.terms"
    commands:
      - tapOn:
          id: "consent.terms.agree"
- runFlow:
    when:
      visible:
        id: "consent.age.yes"
    commands:
      - tapOn:
          id: "consent.age.yes"
- extendedWaitUntil:
    visible:
      id: "consent.sensitive"
    timeout: 15000
- runFlow:
    when:
      true: ${(SENSITIVE || "agree") == "agree"}
    commands:
      - tapOn:
          id: "consent.sensitive.agree"
- runFlow:
    when:
      true: ${(SENSITIVE || "agree") == "decline"}
    commands:
      - tapOn:
          id: "consent.sensitive.decline"
- extendedWaitUntil:
    notVisible:
      id: "consent.sensitive"
    timeout: 15000
- assertNotVisible:
    id: "consent.failed"
