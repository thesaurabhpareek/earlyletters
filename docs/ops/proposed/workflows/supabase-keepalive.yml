# Free plan keep-alive for scribe-prod (founder, 8 Nov 2026: "nightly 1 call to keep supabase active").
#
# This file does NOT run in the earlyletters repository. Copy it unchanged to
# `.github/workflows/supabase-keepalive.yml` in the PRIVATE repository `earlyletters-backups`, next to
# supabase-backup.yml. Private, so an outage issue is not public. Runbook: docs/ops/runbooks/free-tier-ops.md.
#
# Once a day it makes one anonymous, content-free Data API read that reaches Postgres
# (scripts/ops/keepalive.ts: `GET /rest/v1/policy_versions?select=document&limit=1` with the
# publishable key, up to 3 attempts). Supabase pauses a Free project with too little "user database
# activity over the past week" and names API calls as activity
# (https://supabase.com/docs/guides/platform/free-project-pausing, read 8 Nov 2026). Whether one
# automated read a day is "sufficient" is UNVERIFIED: the page says "Typically a few user requests to
# the database each day over the previous week is enough". The nightly backup also connects every day.
#
# On failure it opens (or comments on) one `ops-alert` issue in this repository with GITHUB_TOKEN only.
# GitHub emails the repository owner about the new issue and, for a failed scheduled run, the person who
# last changed the `cron` line (docs/ops/runbooks/staging-backup-free.md, read 8 Nov 2026).
#
# Secrets (Settings > Secrets and variables > Actions > Secrets). Both are public by design (they ship in
# the app); they are secrets only so the log masks them:
#   PROD_SUPABASE_URL              https://<prod ref>.supabase.co
#   PROD_SUPABASE_PUBLISHABLE_KEY  the publishable key the app ships (sb_publishable_...). Never a secret or service_role key: the script refuses it
# Variables (same page, Variables tab):
#   PROD_PROJECT_REF               the prod project ref (the script refuses a URL for any other project)
#   EARLYLETTERS_SHA               the full 40-character commit of thesaurabhpareek/earlyletters whose
#                                  scripts/ops this runs (pinned: a later push to that repository changes nothing here)
#
# Pins (checked 8 Nov 2026; the same pins the earlyletters workflows use):
#   actions/checkout 11bd71901bbe5b1630ceea73d27597364c9af683 = v4.2.2
#   actions/setup-node 49933ea5288caeca8642d1e84afbd3f7d6820020 = v4.4.0

name: Supabase keep-alive

on:
  schedule:
    - cron: '41 15 * * *'   # 15:41 UTC daily: 8:41 AM in California in summer, 7:41 AM in winter
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The pinned commit is a full sha
        env:
          SHA: ${{ vars.EARLYLETTERS_SHA }}
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Set the EARLYLETTERS_SHA variable to a full 40-character commit"; exit 1; }'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: thesaurabhpareek/earlyletters
          ref: ${{ vars.EARLYLETTERS_SHA }}
          persist-credentials: false
          sparse-checkout: scripts/ops
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: One database read against production
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
          PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
        run: node scripts/ops/keepalive.ts --project-ref "$PROJECT_REF"

  alert:
    needs: ping
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the ops-alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'Production keep-alive failed'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create ops-alert --color B60205 --description 'Production operations alert' 2>/dev/null || true
          body="Production did not answer the keep-alive read: $RUN_URL. Open the project in the Supabase dashboard. If it says Paused, choose Resume project, then re-run this workflow. Any other answer: read the run's last lines (HTTP status only)."
          n=$(gh issue list --label ops-alert --state open --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$TITLE" --label ops-alert --body "$body"; fi
