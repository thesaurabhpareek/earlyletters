# Proposed step for .github/workflows/ci.yml, job `unit` (BRIEF CI-SECRET, Option A: the repo's own scanner, no new action).
# Paste after the "Engine, verifier fuzz, ..." step. It runs even when an earlier step is red, so a leaked key is always reported.
# Output is file, line and rule name only, never the value. About 2 seconds on the repo.
      - name: Secret scan (tracked files, file and line only)
        if: ${{ !cancelled() }}
        run: node scripts/packs/secret-scan.mjs
