      retention: "Until leave, removal, book purge or account deletion"
      deletion_path: "Row delete on leave or removal; cascades from children and profiles"
      leaves_device: true
      verified: code
      columns:
        child_id: L3
        profile_id: L3
        role: L3
        joined_at: L2
        auto_add_letters: L2
    - name: child_member_prefs
      kind: table
      created_in: 20261002020000_data_governance.sql
      status: pending_apply
      level: L3
      purpose: "Per-member settings for one book: signature, reminders, celebrations pause"
      retention: "Until the membership ends, the book is purged or the account is deleted"
      deletion_path: "Cascades from child_members"
      leaves_device: true
      verified: code
