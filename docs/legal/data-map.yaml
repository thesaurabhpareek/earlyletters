      purpose: "Queue of Storage objects to delete through the Storage API"
      retention: "7 days after done (purge_due step 5)"
      deletion_path: "purge_due deletes done rows after 7 days; the worker that drains the queue is planned, not built"
      leaves_device: true
      verified: code
      columns:
        id: L2
        bucket_id: L2
        object_path: L3
        is_prefix: L2
        reason: L2
        request_id: L2
        enqueued_at: L2
        attempts: L2
        done_at: L2
        next_attempt_at: L2
        last_error_code: L2

device_sqlite:
  file: "scribe.db in the app sandbox (apps/mobile/src/lib/store.ts, migrator apps/mobile/src/lib/db/migrations.ts)"
  notes: "The whole file is handled as L4 (DATA_CLASSIFICATION 4.5). iOS Data Protection class and SQLCipher are open (LEGAL-REQ-022). Sync to the server arrives with sign-in (D-023); until then nothing in this file leaves the phone. The user's own OS device backup may include it"
  tables:
    - name: entries
      level: L4
      purpose: "Letters on this phone, including letters written before sign-in"
      retention: "Until the author deletes the letter (tombstone, then removed), or the app is deleted"
      deletion_path: "Tombstone in the app; removal of the row and its audio after the undo window (purge sync planned); deleting the app removes the file"
      leaves_device: false
      status: in_code
      verified: code
      notes: "After sign-in and sync consent, letter text and metadata sync to postgres entries (planned). Audio never syncs in v1.0 (decision 9)"
      columns:
        id: L3
        kind: L2
        occurred_on: L3
        captured_at: L2
        capture_mode: L2
        edit_level: L2
        prompt_key: L2
        engine_version: L2
        raw_transcript: L4
        machine_edits: L4
        final_text: L4
        in_book: L2
        sounds_like_me: L2
        updated_at: L2
        deleted_at: L2
        synced_at: L2
        child_id: L3
        author_id: L3
        author_signs_as: L3
        audio_uri: L3
        audio_duration_ms: L2
        audio_sha256: L4
        audio_bytes: L2
        transcript_status: L2
    - name: children
      level: L4
      purpose: "Each child's book on this phone"
      retention: "Until the book is deleted or the app is deleted"
      deletion_path: "Row delete in the app; deleting the app removes the file"
      leaves_device: false
      status: in_code
      verified: code
      notes: "Syncs to postgres children after sign-in (planned)"
      columns:
        id: L3
        name: L4
        birthday: L4
        due_date: L4
        signs_as: L3
        reminders_on: L2
        family_can_read: L2
        created_at: L2
        updated_at: L2
        hidden_at: L2
    - name: drafts
      level: L4
      purpose: "Capture in progress, so a crash never loses a recording or typed words"
      retention: "Until saved as a letter or discarded"
      deletion_path: "Deleted in the same transaction that saves the letter, or on discard"
      leaves_device: false
      status: in_code
      verified: code
      columns:
        id: L3
        child_id: L3
        capture_mode: L2
        prompt_key: L2
        created_at: L2
        audio_uri: L3
        audio_duration_ms: L2
        raw_transcript: L4
        typed_text: L4
        state: L2
        audio_sha256: L4
        audio_bytes: L2
        recovered_at: L2
    - name: orphan_audio
      level: L3
      purpose: "Recordings found with no draft or letter, reported in Settings and never deleted automatically"
      retention: "Until the user acts on them in Settings or deletes the app"
      deletion_path: "User action in Settings, Recordings; deleting the app"
      leaves_device: false
      status: in_code
      verified: code
      notes: "file_name is treated as L3 because recording file names can carry ids (assumed)"
      columns:
        file_name: L3
        bytes: L2
        found_at: L2
    - name: settings
      level: L4
      purpose: "Device settings as key and value pairs; keys are listed in device_kv"
      retention: "Until the app is deleted"
      deletion_path: "deleteSetting in the app; deleting the app"
      leaves_device: false
      status: in_code
      verified: code
      notes: "Table level is L4 only because the retired key family held child data; current keys are L2 or L3"
      columns:
        key: L2
        value: L4

