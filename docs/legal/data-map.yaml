# Early Letters (codename scribe): machine-readable data map.
#
# Every place personal data can live or travel: server tables and columns,
# Storage buckets, the device database and its settings keys, device files,
# SDKs, hosts, logs and analytics properties. Levels L1 to L4 are defined in
# docs/legal/DATA_CLASSIFICATION.md section 1; this file does not redefine them.
# Checked by scripts/check-data-map.mjs (see that file for usage).
#
# AI-drafted engineering inventory for counsel review. Not legal advice. It
# states what is built or decided; it draws no legal conclusions.
#
# Field meanings
#   level           Highest level the item can hold (rule 1.1.1, highest wins).
#                   For tables it must equal the highest column level.
#   leaves_device   true when the data is held or sent anywhere other than the
#                   user's own phone (our servers, a processor, a third party).
#                   The user's own OS device backup is noted separately.
#   status          applied        in a migration that is applied live
#                   pending_apply  in a migration that is not applied yet
#                                  (supabase/APPLY.md). For tables this is the
#                                  creating migration; later columns may be pending.
#                   in_code        built in the app or packages, not released
#                   planned        decided or documented, not built
#                   deferred       moved out of v1.0 by a founder decision
#                   retired        no longer written; kept for old installs
#                   dev_only       written only by development tooling
#                   not_used       considered and rejected
#   verified        code      checked against this repo on as_of
#                   decision  founder decision (docs/agents/BRIEF-2026-10-03.md),
#                             not yet visible in code
#                   doc       taken from a repo document, not checked against a
#                             running system or a contract
#                   assumed   the author's assumption; confirm before relying on it
#
# Format: a strict YAML subset so the checker needs no YAML library (no new
# dependency). Allowed: block mappings, block sequences, plain or quoted
# scalars, flow lists of scalars, {} and [], # comments. Not allowed: anchors,
# aliases, tags, block scalars (| and >), flow mappings with content, and
# ambiguous plain scalars (yes, no, on, off, unquoted dates, decimals). Quote
# any value that contains ": " or " #".

schema_version: 1
as_of: "2026-10-03"
classification: docs/legal/DATA_CLASSIFICATION.md
schema_basis: "supabase/migrations as changed by PR #32 (fix/db-pending-hardening): server entitlement tables removed (founder decision 3)"
release_scope: "v1.0 (iOS, TestFlight first). Decision 9: no audio upload in v1.0; decision 3: purchases only on the device with Apple; decision 12: analytics opt-in"

# Changes in open pull requests that this map already reflects. The checker
# accepts these differences against an older migration set (with a warning) and
# asks for the entry to be removed once the migrations match the map.
pending_changes:
  - pr: 32
    branch: fix/db-pending-hardening
    note: "Removes server entitlements (founder decision 3) and adds the book_children view (D-039)"
    adds: [book_children, children.client_created_at, child_invites.code_hash]
    removes: [app_account_tokens, store_subscriptions, store_notifications, profiles.first_run_closed_at]
  - pr: 31
    branch: fix/analytics-enums-core
    note: "Renames ordinal to child_ordinal and replaces child_added.mode with has_date (PDATA-10, PPRIV-02); levels stay L2"
    adds: [analytics.events.child_added.has_date, analytics.events.child_added.child_ordinal, analytics.events.child_switched.child_ordinal, analytics.events.child_setting_changed.child_ordinal]
    removes: [analytics.events.child_added.mode, analytics.events.child_added.ordinal, analytics.events.child_switched.ordinal, analytics.events.child_setting_changed.ordinal]

hosts:
  - id: supabase
    name: "Supabase (Postgres, Auth, Storage, Edge Functions)"
    role: processor
    level: L4
    purpose: "Account sign-in, synced letter text and book data, photos, consent and deletion records"
    retention: "Per table and bucket below; daily backups roll off after 7 days (data-policy section 6)"
    deletion_path: "purge_due, the deletion worker and the Storage API (see postgres and storage_buckets)"
    leaves_device: true
    status: in_code
    verified: doc
    notes: "Project early-letters in us-west-1 (supabase/APPLY.md). The app in this repo has no Supabase client yet; sync arrives with sign-in (D-023). Encryption at rest is Unverified in writing (DATA_CLASSIFICATION open issue 5)"
  - id: resend
    name: "Resend (email)"
    role: processor
    level: L3
    purpose: "Transactional email: sign-in links, notices, and the hello@ mailbox"
    retention: "Provider message logs; period not recorded in this repo"
    deletion_path: "Provider log deletion; route not documented yet"
    leaves_device: true
    status: in_code
    verified: decision
    notes: "Decision 13: email runs through Resend and hello@earlyletters.com is live. Use as the Supabase Auth SMTP sender is assumed. subprocessors.md still shows a placeholder for the email provider. Email subjects and bodies never carry letter content (DATA_CLASSIFICATION 4.8)"
  - id: vercel
    name: "Vercel (website)"
    role: processor
    level: L3
    purpose: "One-page website, legal pages, universal-link files; waitlist if built"
    retention: "Provider request-log window (Unverified)"
    deletion_path: "Provider log expiry"
    leaves_device: true
    status: in_code
    verified: decision
    notes: "Decision 13. The website is built in a separate repo or thread; request logs hold IP address, user agent and path"
  - id: porkbun
    name: "Porkbun (domain registrar and DNS)"
    role: vendor
    level: L1
    purpose: "earlyletters.com and earlyletters.app domains"
    retention: "Not applicable (no user data)"
    deletion_path: "Not applicable"
    leaves_device: false
    status: in_code
    verified: decision
  - id: pack_cdn
    name: "Language pack and speech model host (Apple-hosted assets or a low-egress CDN; not chosen)"
    role: vendor
    level: L3
    purpose: "Downloads speech models and non-English language packs on demand (decision 15)"
    retention: "Pack files are public data (L1); provider access logs hold IP address and path, period depends on the host"
    deletion_path: "Provider log expiry"
    leaves_device: true
    status: planned
    verified: decision
    notes: "Level L3 because an access log pairs an IP address with the requested pack, and the pack name reveals a chosen language (languages are L4 in DATA_CLASSIFICATION). See open_issues"
  - id: posthog
    name: "PostHog (US Cloud)"
    role: processor
    level: L2
    purpose: "Opt-in product analytics, allowlisted events only (decision 12)"
    retention: "12 months, proposed; set in the PostHog project"
    deletion_path: "Person delete with events for each analytics id the device holds; route planned"
    leaves_device: true
    status: planned
    verified: code
    notes: "The catalogue, consent gate and adapter exist in packages/analytics; the app does not install or import the PostHog SDK yet"
  - id: sentry
    name: "Sentry (crash reporting)"
    role: processor
    level: L2
    purpose: "Scrubbed crash and error reports"
    retention: "90 days, proposed"
    deletion_path: "Provider retention expiry"
    leaves_device: true
    status: planned
    verified: code
    notes: "Listed in subprocessors.md and ADR 0008. Not installed anywhere in this repo on as_of"
  - id: powersync
    name: "PowerSync Cloud"
    role: processor
    level: L4
    purpose: "Sync engine considered in ADR 0004"
    retention: "Replicated rows until purge and compaction"
    deletion_path: "Follows Postgres"
    leaves_device: true
    status: not_used
    verified: doc
    notes: "D-023 recommends an outbox sync on expo-sqlite instead; if the founder confirms, PowerSync is not used. Not installed"
  - id: apple
    name: "Apple (Sign in with Apple, App Store and StoreKit, APNs)"
    role: independent
    level: L3
    purpose: "Sign-in, purchases and subscription management through Apple only, push delivery"
    retention: "Apple's own terms"
    deletion_path: "Revoke Sign in with Apple at account deletion (planned); purchases stay with Apple"
    leaves_device: true
    status: planned
    verified: decision
    notes: "Decision 3: StoreKit 2 on the device; no server of ours sees purchases and no App Store Server Notifications endpoint exists. Family Sharing gives a co-parent Plus"
  - id: google
    name: "Google (Sign in with Google)"
    role: independent
    level: L3
    purpose: "Sign-in"
    retention: "Google's own terms"
    deletion_path: "Unlink at account deletion"
    leaves_device: true
    status: planned
    verified: decision
    notes: "Decision 4 lists Sign in with Google; subprocessors.md says from v1.1. Confirm the release"

storage_buckets:
  - id: entry-photos
    path: "{child_id}/{author_id}/{entry_id}.{jpg,jpeg,heic,png}"
    level: L4
    purpose: "Photos attached to letters"
    retention: "Life of the letter"
    deletion_path: "Letter or book purge queues the object in storage_purge_queue; the worker deletes it through the Storage API (worker planned)"
    leaves_device: true
    status: applied
    verified: code
    notes: "Private bucket created in 20260930000000_scribe_core.sql. The app has no photo upload yet"
  - id: backup-audio
    path: "per ADR 0006 (name not chosen)"
    level: L4
    purpose: "Encrypted backup of recordings"
    retention: "Life of the letter"
    deletion_path: "Crypto-shred plus Storage API deletion (planned)"
    leaves_device: true
    status: deferred
    verified: decision
    notes: "Decision 9: no audio upload in v1.0"
  - id: inbox
    path: "{child_id}/{entry_id}"
    level: L4
    purpose: "Recordings from the family web contribution page"
    retention: "Until moved into the letter"
    deletion_path: "Storage API deletion (planned)"
    leaves_device: true
    status: deferred
    verified: decision
    notes: "Decision 9: the web contribution page is v1.1"
  - id: child-photos
    path: "{child_id}/..."
    level: L4
    purpose: "Child profile photo"
    retention: "Life of the book"
    deletion_path: "Storage API deletion at book purge (planned)"
    leaves_device: true
    status: planned
    verified: code
    notes: "children.photo_path exists; no bucket is created in the migrations"
  - id: avatars
    path: "{profile_id}/..."
    level: L3
    purpose: "Member photo"
    retention: "Life of account"
    deletion_path: "Storage API deletion at account deletion (planned)"
    leaves_device: true
    status: planned
    verified: doc
  - id: exports
    path: "{profile_id}/{export_id}.zip"
    level: L4
    purpose: "Server-built exports"
    retention: "7 days"
    deletion_path: "Expiry job (planned, DATA-REQ-054)"
    leaves_device: true
    status: planned
    verified: doc
  - id: ops-ledger
    path: "purges/YYYY-MM-DD.jsonl"
    level: L3
    purpose: "Purged ids for replay after a restore"
    retention: "60 days"
    deletion_path: "Expiry job (planned)"
    leaves_device: true
    status: planned
    verified: doc

postgres:
  notes: "Columns and levels must match the COMMENT ON COLUMN labels in the migrations; the checker compares them. purge_due exists in the migrations but no schedule is created (the cron line is commented out), and the deletion worker Edge Function is not built, so deletion paths that rely on them are planned work"
  auth:
    - name: auth.users and auth.identities
      level: L3
      purpose: "Sign-in identity: email, Apple and Google subject ids"
      retention: "Life of account"
      deletion_path: "auth.admin.deleteUser by the deletion worker (planned)"
      leaves_device: true
      status: planned
      verified: doc
    - name: auth.sessions and auth.refresh_tokens
      level: L4
      purpose: "Session secrets"
      retention: "Rolling; removed with the user"
      deletion_path: "Removed with the user"
      leaves_device: true
      status: planned
      verified: doc
    - name: Auth audit log
      level: L3
      purpose: "Sign-in events (may hold IP addresses)"
      retention: "Unverified; target 90 days (DELETION spec OQ-5)"
      deletion_path: "Provider window"
      leaves_device: true
      status: planned
      verified: doc
  tables:
    - name: entries
      kind: table
      created_in: 20260930000000_scribe_core.sql
      status: applied
      level: L4
      purpose: "Letters: exact transcript, machine edits, the text the book shows, and metadata"
      retention: "Until the author deletes the letter, the book is purged or the account is deleted"
      deletion_path: "Letter delete: 30-day tombstone, then purge_due deletes the row (cascades versions), records the id in purge_ledger and queues the photo for Storage API deletion"
      leaves_device: true
      verified: code
      columns:
        id: L3
        child_id: L3
        author_id: L3
        kind: L2
        occurred_on: L3
        captured_at: L2
        capture_mode: L2
        edit_level: L2
        prompt_key: L2
        prompt_library_version: L2
        engine_version: L2
        raw_transcript: L4
        stt_meta: L4
        machine_edits: L4
        final_text: L4
        in_book: L2
        photo_path: L3
        audio_kept_on_device: L2
        sounds_like_me: L2
        created_at: L2
        updated_at: L2
        deleted_at: L2
        search: L4
        deleted_reason: L2
        raw_sha256: L4
        author_signs_as: L3
        approval: L2
        reviewed_by: L3
        reviewed_at: L2
    - name: entry_versions
      kind: table
      created_in: 20260930000000_scribe_core.sql
      status: applied
      level: L4
      purpose: "Previous versions of a letter's text, so every change is reversible"
      retention: "Life of the letter"
      deletion_path: "Cascades from entries"
      leaves_device: true
      verified: code
      columns:
        id: L2
        entry_id: L3
        final_text: L4
        in_book: L2
        created_at: L2
        machine_edits: L4
        superseded_by: L3
    - name: book_entries
      kind: view
      created_in: 20261002020000_data_governance.sql
      status: pending_apply
      level: L4
      purpose: "Read-only view: letters as book members see them (no raw transcript, edits or STT metadata, PRD K-09)"
      retention: "No storage of its own (view over entries)"
      deletion_path: "Follows entries"
      leaves_device: true
      verified: code
      columns:
        id: L3
        child_id: L3
        author_id: L3
        author_signs_as: L3
        kind: L2
        occurred_on: L3
        captured_at: L2
        capture_mode: L2
        edit_level: L2
        prompt_key: L2
        prompt_library_version: L2
        engine_version: L2
        final_text: L4
        in_book: L2
        photo_path: L3
        audio_kept_on_device: L2
        sounds_like_me: L2
        created_at: L2
        updated_at: L2
        deleted_at: L2
        search: L4
        approval: L2
    - name: children
      kind: table
      created_in: 20260930000000_scribe_core.sql
      status: applied
      level: L4
      purpose: "A child's book: name, birthday or due date, theme, sharing setting"
      retention: "Until the book's sole parent deletes the book, or account deletion"
      deletion_path: "Book deletion request, 30-day tombstone, then purge_due deletes the row (cascades members, invites, entries, versions, terms); photo objects queued for Storage API deletion"
      leaves_device: true
      verified: code
      columns:
        id: L3
        name: L4
        date_of_birth: L4
        created_by: L3
        created_at: L2
        client_created_at: L2
        updated_at: L2
        deleted_at: L2
        deletion_request_id: L2
        nickname: L4
        due_date: L4
        photo_path: L3
        book_look: L2
        family_can_read: L2
