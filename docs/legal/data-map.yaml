open_issues:
  - "Language pack downloads: the request path names the pack, so a host access log pairs an IP address with a chosen language, which DATA_CLASSIFICATION treats as L4. Decide the host and its logging before packs ship (decision 15)."
  - "Deletion: purge_due is not scheduled and the deletion and purge worker Edge Functions are not built, so server-side deletion stops at the queue until they ship."
  - "Analytics id deletion: the device keeps current and retired ids for deletion requests, but the server-side route that asks PostHog to delete them is not built."
  - "Recordings and the user's own OS device backup: D-033 (recommended, awaiting founder) keeps recordings in Documents so device backups include them; product copy that says recordings live only on this phone should match the decision."
  - "Copy describes encrypted backup of recordings and family playback; decision 9 defers all audio upload to v1.1. See docs/legal/CLAIMS.md."
  - "Sentry is listed in subprocessors.md and ADR 0008 but decision 12 names only PostHog; confirm whether crash reporting ships in v1.0."
