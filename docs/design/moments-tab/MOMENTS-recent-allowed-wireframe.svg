<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" role="img" aria-labelledby="t d">
  <title id="t">Moments tab, photo access allowed, Recent part (light, iPhone SE 3 width, PROPOSED wireframe; tab order shown is option A, Home first and default)</title>
  <desc id="d">Fictional family Asha. Each card is the parent's own photos, a phone-formatted date, and the parent's own label only if one was typed. No machine title, no place, no count, no map. The compose button hands the shown photos to Home capture.</desc>
  <rect width="375" height="812" fill="#FBF8F3"/>
  <text x="20" y="78" font-family="serif" font-size="34" fill="#2B2622">Moments</text>
  <!-- segmented switch (system control) -->
  <rect x="16" y="94" width="343" height="36" rx="18" fill="#EFE8DC"/>
  <rect x="190" y="97" width="166" height="30" rx="15" fill="#FFFFFF" stroke="#D9D0C3"/>
  <text x="103" y="118" font-family="sans-serif" font-size="14" fill="#6B625A" text-anchor="middle">For you</text>
  <text x="273" y="118" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2B2622" text-anchor="middle">Recent</text>
  <!-- card 1 -->
  <rect x="16" y="146" width="343" height="268" rx="18" fill="#FFFFFF" stroke="#E6DED2"/>
  <rect x="28" y="158" width="319" height="150" rx="10" fill="#F1E8DA"/>
  <rect x="32" y="162" width="156" height="72" rx="8" fill="#E9DCCB"/>
  <rect x="192" y="162" width="151" height="72" rx="8" fill="#DCE3D6"/>
  <rect x="32" y="238" width="156" height="66" rx="8" fill="#E3D6DD"/>
  <rect x="192" y="238" width="151" height="66" rx="8" fill="#D6DFE6"/>
  <text x="28" y="338" font-family="serif" font-size="20" fill="#2B2622">Sat 14 Oct</text>
  <text x="28" y="360" font-family="sans-serif" font-size="14" fill="#6B625A">At the park with Nani</text>
  <text x="28" y="378" font-family="sans-serif" font-size="11" fill="#6B625A">(only when the parent typed a label)</text>
  <rect x="236" y="354" width="111" height="44" rx="22" fill="#8A5A3C"/>
  <text x="291" y="381" font-family="sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">Say something</text>
  <!-- card 2 -->
  <rect x="16" y="428" width="343" height="188" rx="18" fill="#FFFFFF" stroke="#E6DED2"/>
  <rect x="28" y="440" width="154" height="92" rx="10" fill="#E9DCCB"/>
  <rect x="188" y="440" width="159" height="92" rx="10" fill="#DCE3D6"/>
  <text x="28" y="562" font-family="serif" font-size="20" fill="#2B2622">Thu 12 Oct</text>
  <text x="28" y="582" font-family="sans-serif" font-size="13" fill="#6B625A">no label, so the date alone</text>
  <rect x="236" y="560" width="111" height="44" rx="22" fill="#8A5A3C"/>
  <text x="291" y="587" font-family="sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">Say something</text>
  <!-- card 3 clipped, list continues -->
  <rect x="16" y="630" width="343" height="100" rx="18" fill="#FFFFFF" stroke="#E6DED2"/>
  <rect x="28" y="642" width="154" height="70" rx="10" fill="#E3D6DD"/>
  <text x="196" y="672" font-family="serif" font-size="20" fill="#2B2622">Mon 9 Oct</text>
  <rect x="0" y="740" width="375" height="72" fill="#F4EFE7"/><line x1="0" y1="740" x2="375" y2="740" stroke="#D9D0C3"/>
  <g font-family="sans-serif" font-size="13" text-anchor="middle" fill="#6B625A">
    <text x="47" y="790">Home</text><circle cx="47" cy="763" r="9" fill="none" stroke="#6B625A" stroke-width="2"/>
    <text x="140" y="790" font-weight="bold" fill="#2B2622">Moments</text><circle cx="140" cy="763" r="9" fill="none" stroke="#2B2622" stroke-width="2"/>
    <text x="234" y="790">Book</text><rect x="225" y="754" width="18" height="18" fill="none" stroke="#6B625A" stroke-width="2"/>
    <text x="328" y="790">Me</text><circle cx="328" cy="763" r="9" fill="none" stroke="#6B625A" stroke-width="2"/>
  </g>
</svg>
