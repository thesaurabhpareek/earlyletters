<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area D prototype: family, sharing and reminders</title>
<!--
  Area D end-to-end prototype (design lead, 20 Nov 2026). Self-contained: no network, no framework.
  Token values copied from packages/design-tokens/src/tokens.ts (light, dark, highContrast, radius, space, target).
  Material policy: docs/design/system/BRIEF.md section 3, COMPONENTS.md 1.1 and FOUNDATIONS.md 2.3 (glass only on navigation and control layer; solid under
  Reduce Transparency). Screen ids match DESIGN.md. Fictional family only (Asha). Words are intent; WORDS.md owns them.
  ASCII only.
-->
<style>
:root{
  --bg:#FBF8F3;--surface:#F5EFE7;--raised:#FFFFFF;--text:#2B2722;--muted:#6B645B;--accent:#8A5A3B;--accentSoft:#F1E6DC;
  --onAccent:#FFFFFF;--line:#E6DED3;--focus:#2F6F8F;--caution:#94661A;--success:#3F7A55;--control:#8A8175;
  --destructive:#B5473A;--scrim:rgba(43,39,34,.32);
  --glass:rgba(255,255,255,.62);--glassEdge:rgba(255,255,255,.7);--glassFallback:#FFFFFF;
  --k:1;
}
body.dark{
  --bg:#161412;--surface:#1B1917;--raised:#201D1A;--text:#F2ECE4;--muted:#B3AA9E;--accent:#D9A47E;--accentSoft:#3A2E25;
  --onAccent:#1E1612;--line:#33302C;--focus:#8CC4DE;--caution:#E3B866;--success:#8CC9A0;--control:#857C70;
  --destructive:#F08C7C;--scrim:rgba(0,0,0,.55);--glass:rgba(40,36,32,.6);--glassEdge:rgba(255,255,255,.12);--glassFallback:#282421;
}
body.hc{--muted:#524B43;--accent:#6E4529;--line:#6B645B;--control:#2B2722}
body.dark.hc{--muted:#D6CEC3;--accent:#E8BC9A;--line:#B3AA9E;--control:#F2ECE4}
body.ax5{--k:2.1}
*{box-sizing:border-box}
html,body{margin:0;font-family:-apple-system,"Mukta","Helvetica Neue",Arial,sans-serif;background:#ddd6cc;color:#2B2722}
body.dark{background:#0b0a09}
.app{display:flex;gap:20px;padding:16px;align-items:flex-start;flex-wrap:wrap}
.panel{width:340px;background:#fff;border-radius:12px;padding:12px;font-size:13px;color:#2B2722;max-height:calc(100vh - 32px);overflow:auto}
body.dark .panel{background:#26221e;color:#F2ECE4}
.panel h2{font-size:14px;margin:12px 0 6px}
.panel button,.panel select{font:inherit;margin:2px 0;min-height:32px}
.panel .tog{display:flex;flex-wrap:wrap;gap:6px}
.panel .tog label{display:flex;gap:4px;align-items:center;border:1px solid #bbb;border-radius:6px;padding:3px 6px}
.panel .states button{margin:2px;border-radius:6px;border:1px solid #aaa;background:#f6f3ee;padding:2px 6px;cursor:pointer}
body.dark .panel .states button{background:#3a342e;color:#F2ECE4}
.panel .states button.on{background:#8A5A3B;color:#fff}
.note{background:#f5efe7;border-left:3px solid #8A5A3B;padding:6px 8px;margin:6px 0;white-space:pre-wrap}
body.dark .note{background:#33302c}
.phone{width:375px;height:812px;border-radius:48px;border:10px solid #1c1a18;background:var(--bg);position:relative;overflow:hidden;color:var(--text);flex:none}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:14px;font-weight:600}
.screen{position:absolute;top:44px;left:0;right:0;bottom:0;overflow:auto}
.idtag{position:absolute;top:6px;left:50%;transform:translateX(-50%);font:600 10px monospace;background:#1c1a18;color:#fff;padding:2px 8px;border-radius:8px;z-index:20}
/* type, scaled by --k for AX5 */
.t-title1{font:500 calc(28px*min(var(--k),1.8))/1.2 Georgia,"Literata",serif}
.t-title2{font:500 calc(22px*min(var(--k),2))/1.25 Georgia,"Literata",serif;margin:0}
.t-headline{font-weight:600;font-size:calc(18px*var(--k));line-height:1.28}
.t-body{font-size:calc(18px*var(--k));line-height:1.34}
.t-callout{font-size:calc(17px*var(--k));line-height:1.3}
.t-sub{font-size:calc(16px*var(--k));line-height:1.32}
.t-foot{font-size:calc(14px*var(--k));line-height:1.36;color:var(--muted)}
.t-cap{font-size:calc(13px*var(--k));letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:500}
.t-letter{font:400 calc(20px*var(--k))/1.6 Georgia,"Literata",serif}
.t-sig{font:italic 400 calc(20px*var(--k))/1.6 Georgia,serif;text-align:right}
.t-date{font-size:calc(14px*min(var(--k),2.4));letter-spacing:.6px;font-weight:500;color:var(--muted);text-transform:uppercase}
.muted{color:var(--muted)}
.pad{padding:0 16px}.padR{padding:0 20px}
.gap>*+*{margin-top:12px}
/* buttons: 56 pt lg, 44 pt min */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:9999px;border:1px solid var(--control);
  background:var(--surface);color:var(--text);font-weight:500;font-size:calc(18px*var(--k));padding:8px 16px;cursor:pointer;text-align:center;font-family:inherit}
.btn.primary{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--accent);min-height:44px}
.btn.sm{min-height:44px;width:auto;font-size:calc(16px*var(--k))}
.btn.notready{background:transparent;color:var(--muted);border-color:var(--control)}
.btn.destructive{color:var(--destructive);background:transparent;border-color:transparent}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pair{display:flex;gap:12px}.pair>.btn{flex:1}
body.ax5 .pair{flex-direction:column}
.stack>.btn+.btn{margin-top:12px}
/* list (content layer, system grouped style) */
.sec{margin:20px 16px 0}
.sec .hd{margin:0 16px 6px}
.list{background:var(--raised);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 16px;border-top:1px solid var(--line);cursor:default}
.row:first-child{border-top:none}
.row.tap{cursor:pointer}
.row .grow{flex:1;min-width:0}
body.ax5 .row{flex-wrap:wrap}
body.ax5 .row .grow{flex-basis:100%}
.chev:after{content:">";color:var(--muted);font-size:calc(16px*var(--k))}
.sw{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:none;border:1px solid var(--control);cursor:pointer}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.on{background:var(--success);border-color:var(--success)}.sw.on:after{left:22px}
.sw.dis{opacity:.45}
.sw .lbl{position:absolute;left:-9999px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.chip{min-height:44px;min-width:44px;padding:0 12px;border-radius:9999px;border:1px solid var(--control);display:flex;align-items:center;justify-content:center;font-size:calc(16px*var(--k));font-weight:500}
.chip.sel{background:var(--accentSoft);border:1.5px solid var(--accent)}
.chip.sel:before{content:"\2713";margin-right:4px}
.warn{display:flex;gap:8px;align-items:flex-start}
.warn:before{content:"!";flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--caution);color:var(--caution);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;min-height:48px}
.gbtn{min-height:44px;min-width:44px;padding:0 14px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:calc(16px*var(--k));cursor:pointer;color:var(--text)}
/* glass: navigation and control layer only */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--glassEdge);box-shadow:0 8px 24px rgba(43,39,34,.14)}
body.rt .glass{background:var(--glassFallback);-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid var(--line);box-shadow:none}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:5}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;border-radius:28px;z-index:6;display:flex;flex-direction:column;max-height:calc(100% - 24px)}
.sheet.full{top:12px;left:0;right:0;bottom:0;border-radius:28px 28px 0 0}
.sheet.full.glass{background:var(--raised)}
body.ax5 .sheet{top:12px;left:0;right:0;bottom:0;border-radius:28px 28px 0 0}
.sheet .body{padding:24px 20px 12px;overflow:auto;flex:1}
.sheet .foot{padding:12px 20px 28px;border-top:1px solid transparent}
.sheet .foot.ruled{border-top-color:var(--line)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--control);margin:8px auto 0;opacity:.5}
.toast{position:absolute;left:16px;right:16px;bottom:100px;border-radius:9999px;padding:10px 12px 10px 20px;display:flex;align-items:center;gap:8px;z-index:7}
body.ax5 .toast{border-radius:24px;flex-wrap:wrap}
.tabbar{position:absolute;left:24px;right:24px;bottom:20px;height:62px;border-radius:9999px;display:flex;justify-content:space-around;align-items:center;z-index:4}
.tab{font-size:12px;text-align:center;min-width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tab.on{color:var(--accent);font-weight:600}
.thumb{width:64px;height:64px;border-radius:8px;border:1px solid var(--line);background:linear-gradient(135deg,#d9c3a8,#b48c66);position:relative;overflow:hidden;margin-top:8px}
.thumb:after{content:"";position:absolute;left:14px;top:30px;width:36px;height:22px;border-radius:50% 50% 0 0;background:#8a6a4a}
/* lock screen */
.lock{position:absolute;inset:0;background:linear-gradient(160deg,#3b4a5c,#1f2630);color:#fff;padding-top:44px}
.lock .clock{font:200 80px/1 -apple-system,Arial;text-align:center;margin-top:10px}
.lock .day{text-align:center;font-size:18px;margin-top:6px}
.notif{margin:12px 10px 0;border-radius:22px;padding:12px 14px;background:rgba(255,255,255,.28);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);color:#fff}
body.rt .notif{background:#4a5563}
.notif .hdr{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.85}
.notif .ico{width:20px;height:20px;border-radius:5px;background:linear-gradient(#9A613C,#7F4F30)}
.notif .tt{font-weight:600;font-size:15px;margin-top:4px}
.notif .bd{font-size:15px}
.bubble{margin:10px 16px;max-width:290px;padding:10px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:calc(15px*var(--k))}
.bubble.me{margin-left:auto;background:var(--accentSoft)}
.web{background:#fff;color:#2B2722;min-height:100%;padding:24px}
body.dark .web{background:#161412;color:#F2ECE4}
.flag{font:600 10px monospace;color:var(--caution)}
</style>
</head>
<body>
<div class="app">
  <div class="panel" id="panel">
    <b>Area D prototype</b>: family, sharing, reminders. Ids match DESIGN.md.
    <h2>Display</h2>
    <div class="tog">
      <label><input type="checkbox" id="tDark"> Dark</label>
      <label><input type="checkbox" id="tAx5"> AX5 text</label>
      <label><input type="checkbox" id="tRT"> Reduce Transparency</label>
      <label><input type="checkbox" id="tHC"> Increase Contrast</label>
    </div>
    <h2>Journey</h2>
    <select id="jSel" style="width:100%"></select>
    <div style="display:flex;gap:6px"><button id="jPrev">Prev step</button><button id="jNext">Next step</button><span id="jPos"></span></div>
    <div class="note" id="jNote"></div>
    <h2>Screen</h2>
    <select id="sSel" style="width:100%"></select>
    <h2>State</h2>
    <div class="states" id="stBtns"></div>
    <div class="note" id="sNote"></div>
  </div>
  <div class="phone" id="phone">
    <div class="status"><span>9:41</span><span>LTE 100%</span></div>
    <div class="idtag" id="idtag"></div>
    <div class="screen" id="scr"></div>
  </div>
</div>
<script>
"use strict";
var cur={s:"D-S02",st:"default"};
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function btn(l,k,go,extra){return '<button class="btn '+(k||"")+'" '+(go?'onclick="go(\''+go[0]+'\',\''+go[1]+'\')"':'')+' aria-label="'+esc(l)+'" '+(extra||"")+'>'+esc(l)+'</button>'}
function sw(on,label,dis,go){return '<span class="sw'+(on?' on':'')+(dis?' dis':'')+'" role="switch" aria-checked="'+(on?'true':'false')+'" aria-label="'+esc(label)+'" '+(dis?'aria-disabled="true"':'')+(go&&!dis?' onclick="go(\''+go[0]+'\',\''+go[1]+'\')"':'')+'></span>'}
function row(title,sub,right,go){return '<div class="row'+(go?' tap':'')+'" '+(go?'role="button" onclick="go(\''+go[0]+'\',\''+go[1]+'\')"':'')+'><div class="grow"><div class="t-body">'+title+'</div>'+(sub?'<div class="t-foot">'+sub+'</div>':'')+'</div>'+(right||"")+'</div>'}
function sec(h,inner,foot){return '<div class="sec">'+(h?'<div class="hd t-cap" role="heading">'+h+'</div>':'')+'<div class="list">'+inner+'</div>'+(foot?'<div class="t-foot" style="margin:6px 16px 0">'+foot+'</div>':'')+'</div>'}
function nav(back,title){return '<div class="navbar"><span class="gbtn glass" role="button">&lt; '+back+'</span><span class="t-headline">'+title+'</span><span style="width:60px"></span></div>'}
function sheet(body,foot,opts){opts=opts||{};return '<div class="scrim"></div><div class="sheet glass'+(opts.full?' full':'')+'" role="dialog" aria-modal="true"><div class="grab"></div><div class="body">'+body+'</div>'+(foot?'<div class="foot'+(opts.ruled?' ruled':'')+'">'+foot+'</div>':'')+'</div>'}
function toast(msg,action){return '<div class="toast glass" role="status"><span class="t-sub" style="flex:1">'+msg+'</span>'+(action?'<button class="btn quiet sm">'+action+'</button>':'')+'</div>'}
function tabbar(on){var t=["Home","Book","Me"];return '<div class="tabbar glass" role="tablist">'+t.map(function(x){return '<div class="tab'+(x===on?' on':'')+'" role="tab">'+x+'</div>'}).join("")+'</div>'}
function warn(t){return '<div class="warn t-sub">'+t+'</div>'}

/* ---------- shared backgrounds ---------- */
function letterPage(withShare){
  return nav("Book","")+'<div class="padR gap" style="padding-top:8px;padding-bottom:120px">'+
  '<div class="t-date" role="heading" aria-level="1">Saturday 14 March 2026</div>'+
  '<div class="t-letter">We went to the park and Asha laughed at the ducks. Every time one came close, a new laugh.</div>'+
  '<div class="t-sig">From Mama</div>'+
  '<div class="card" style="display:flex;align-items:center;gap:12px;border-radius:9999px"><span style="width:44px;height:44px;border-radius:50%;background:var(--accent);display:inline-block"></span><span class="t-sub">Hear Mama</span></div>'+
  (withShare?btn("Share this letter","",["D-S02","pictureOff"]):"")+
  '<div class="t-cap" role="heading" aria-level="2" style="margin-top:20px">This letter</div>'+
  '<div class="list">'+row("Make private","","<span class='chev'></span>")+row("The day it is about","Saturday 14 March","<span class='chev'></span>")+'</div>'+
  '<div class="list">'+row('<span style="color:var(--destructive)">Delete</span>')+'</div></div>';
}
function homeBg(extra,kept){
  return '<div class="pad" style="padding-top:20px"><div class="t-date">Saturday 14 March</div><div class="t-foot" style="margin-top:4px">For Asha</div>'+
  (extra||"")+
  '<div class="t-title1" style="margin-top:16px">What made Asha laugh today?</div>'+
  '<div class="btn quiet sm" style="justify-content:flex-start;padding-left:0">Another thought</div></div>'+
  '<div class="glass" style="position:absolute;left:16px;right:16px;bottom:100px;border-radius:32px;padding:12px">'+
  '<div class="pair"><button class="btn primary" style="min-height:64px">Speak</button><button class="btn" style="min-height:64px">Type</button></div>'+
  (kept?'<div class="t-sub" style="display:flex;align-items:center;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap" role="status">A quiet day, kept. <button class="btn quiet sm" onclick="go(\'D-S21\',\'default\')">Undo</button></div>':
  '<button class="btn quiet sm" style="width:100%;margin-top:6px" onclick="go(\'D-S21\',\'kept\')" aria-label="Not much today">Not much today</button>')+
  '</div>'+tabbar("Home");
}
function bookBg(){return '<div class="pad" style="padding-top:12px"><div class="t-title1">Asha\'s book</div><div class="t-cap" style="margin-top:16px">This month</div>'+
  '<div class="card t-letter" style="margin-top:8px;font-size:calc(17px*var(--k))">We went to the park and Asha laughed...</div></div>'+tabbar("Book")}

/* ---------- screens ---------- */
var S={};
S["D-S01"]={t:"Letter page: Share control",states:{
  "default":"Own, kept, open letter with words: Share sits after Play and before the 'This letter' list. Content layer: a solid button, not glass.",
  "absent":"Other parent's letter, sealed, quiet mark, no words, not kept, or flag off: no control and no gap."},
  r:function(st){return letterPage(st!=="absent")}};
S["D-S02"]={t:"Share preview sheet",states:{
  "pictureOff":"Words only; the letter has a stored picture so the toggle shows, off. Sheet is glass; preview card and buttons are content (no glass on glass).",
  "wordsOnly":"No stored copy on this phone: toggle row absent, not greyed (R5b).",
  "pictureOn":"Toggle on: 64 pt thumbnail with hairline inside the preview card; ignores Smart Invert.",
  "error-share_temp_write_failed":"Temp copy failed: caution line with icon (shape, not colour alone); toggle back to off; next Continue sends words only.",
  "versionExact":"Version line when the Book shows 'Exactly as said'.",
  "long":"1,000 words: card scrolls; Continue and Not now pinned in the footer (R13b). Full height: the sheet turns opaque.",
  "rtl":"Right-to-left words; date and signature lines keep their order (isolates in the payload)."},
  r:function(st){
    var words=st==="rtl"?'<div dir="rtl" class="t-letter" style="text-align:right">\u0630\u0647\u0628\u0646\u0627 \u0625\u0644\u0649 \u0627\u0644\u062d\u062f\u064a\u0642\u0629 \u0648\u0636\u062d\u0643\u062a \u0622\u0634\u0627.</div>':
      '<div class="t-letter">We went to the park and Asha laughed at the ducks. Every time one came close, a new laugh.'+(st==="long"?' '+Array(14).join("Then the swings, and the long walk home past the bakery, and the way the light came through the trees. "):'')+'</div>';
    var pic=st==="pictureOn"?'<div class="thumb" role="img" aria-label="The picture, included"></div>':"";
    var err=st==="error-share_temp_write_failed"?'<div style="margin-top:8px">'+warn("The picture could not be added. The words will still go.")+'</div>':"";
    var tog=st==="wordsOnly"?"":row("Include the picture","",sw(st==="pictureOn","Include the picture",false,["D-S02",st==="pictureOn"?"pictureOff":"pictureOn"]));
    var body='<h2 class="t-title2" id="sh">This will be sent</h2>'+
      '<div class="card" style="margin-top:16px;'+(st==="long"?'max-height:300px;overflow:auto':'')+'" role="group" aria-label="What will be sent">'+
      '<div class="t-date">Saturday 14 March 2026</div><div style="height:8px"></div>'+words+'<div style="height:8px"></div><div class="t-sig">From Mama</div>'+pic+err+'</div>'+
      '<div class="list" style="margin-top:16px">'+row("&#10003; The words always go")+tog+'</div>'+
      '<p class="t-foot" style="margin-top:12px">'+(st==="versionExact"?"Sent exactly as said.":"Sent as it reads in the book, with small fixes.")+'</p>'+
      '<p class="t-foot">It goes only where you send it. Once sent, it cannot be taken back.</p>';
    var foot='<div class="pair">'+btn("Continue","",["D-S03",st==="pictureOn"?"textAndPicture":"text"])+btn("Not now","",["D-S01","default"])+'</div>';
    return letterPage(true)+sheet(body,foot,{full:st==="long",ruled:st==="long"});
  }};
S["D-S03"]={t:"iOS share sheet (system)",states:{
  "text":"System sheet with the text only. We pass no subject or title (R21).",
  "textAndPicture":"Text plus one file letter-photo.jpg, no metadata.",
  "completed":"Any completion (sent, cancelled, failed) returns here identically: preview closed, no toast, nothing recorded (R3b, R12, R22)."},
  r:function(st){
    if(st==="completed")return letterPage(true);
    return letterPage(true)+'<div class="scrim"></div><div class="sheet glass" style="z-index:6"><div class="grab"></div><div class="body">'+
      '<div class="card" style="display:flex;gap:10px;align-items:center">'+(st==="textAndPicture"?'<div class="thumb" style="margin:0;width:44px;height:44px"></div>':'')+
      '<div class="t-sub">Saturday 14 March 2026<br><span class="muted">Text'+(st==="textAndPicture"?' and letter-photo.jpg':'')+'</span></div></div>'+
      '<div style="display:flex;gap:14px;margin:18px 0;overflow:hidden">'+["Messages","Mail","WhatsApp","Notes"].map(function(a){return '<div style="text-align:center;font-size:12px"><div style="width:56px;height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--line)"></div>'+a+'</div>'}).join("")+'</div>'+
      '<div class="list">'+row("Copy")+row("Save to Files")+'</div>'+
      '<p class="t-foot" style="margin-top:12px">System UI. Drawn here only to place the hand-off.</p></div>'+
      '<div class="foot">'+btn("Close (iOS)","",["D-S03","completed"])+'</div></div>';
  }};
S["D-S04"]={t:"Reminder ask",states:{
  "default":"After the first kept letter, over the Book. Two equal answers (NS-13 door line). 'Change the time' is a control, not an answer. No Close, no swipe.",
  "pickTime":"System compact time picker in place: 7:00 AM to 9:30 PM in 15-minute steps.",

function render(){
  var s=S[cur.s];if(!s.states[cur.st])cur.st=Object.keys(s.states)[0];
  document.getElementById("scr").innerHTML=s.r(cur.st);
  document.getElementById("idtag").textContent=cur.s+"."+cur.st;
  document.getElementById("sSel").value=cur.s;
  document.getElementById("stBtns").innerHTML=Object.keys(s.states).map(function(k){return '<button class="'+(k===cur.st?'on':'')+'" onclick="go(\''+cur.s+'\',\''+k+'\')">'+k+'</button>'}).join("");
  document.getElementById("sNote").textContent=s.t+": "+s.states[cur.st];
}
function go(s,st){cur={s:s,st:st};render();}

function showStep(){var j=J[ji][1];js=Math.max(0,Math.min(js,j.length-1));var x=j[js];document.getElementById("jPos").textContent=(js+1)+" of "+j.length;document.getElementById("jNote").textContent=J[ji][0]+"\nStep "+(js+1)+": "+(x[2]||x[0]+"."+x[1]);go(x[0],x[1]);}

  var ss=document.getElementById("sSel");Object.keys(S).forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent=k+" "+S[k].t;ss.appendChild(o)});

  var jsel=document.getElementById("jSel");J.forEach(function(j,i){var o=document.createElement("option");o.value=i;o.textContent=j[0];jsel.appendChild(o)});
  jsel.onchange=function(){ji=+jsel.value;js=0;showStep()};
