<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area A. Capture: clickable prototype (PROPOSED words, fictional Asha)</title>
<!--
  Self-contained: no network, no framework. Token values copied from packages/design-tokens/src/tokens.ts (light, dark,
  highContrast, space, radius, target, type sizes). Material policy from docs/design/system/BRIEF.md section 3: glass only
  on the control layer, solid fallback under Reduce Transparency. Screen and state ids match DESIGN.md.
  Words are intent only; WORDS.md holds the PROPOSED keys. Pictures are drawn shapes, never people.
-->
<style>
:root{
  --bg:#FBF8F3;--surface:#F5EFE7;--raised:#FFFFFF;--text:#2B2722;--muted:#6B645B;--accent:#8A5A3B;--accentSoft:#F1E6DC;
  --onAccent:#FFFFFF;--line:#E6DED3;--focus:#2F6F8F;--recording:#B5473A;--success:#3F7A55;--caution:#94661A;
  --controlBorder:#8A8175;--editMark:#8A5A3B;--destructive:#B5473A;--scrim:rgba(43,39,34,.32);
  --glass:rgba(255,253,250,.58);--glassEdge:rgba(255,255,255,.75);--glassShadow:0 6px 16px rgba(43,39,34,.10);
  --serif:'Literata','Iowan Old Style','Georgia',serif;--sans:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
}
body{margin:0;font-family:var(--sans);background:#e9e4dc;color:#2B2722}
.app{display:grid;grid-template-columns:250px 415px 1fr;gap:16px;padding:16px;min-height:100vh;box-sizing:border-box}
.panel{background:#fff;border-radius:12px;padding:12px;font-size:13px;line-height:1.4;overflow:auto;max-height:calc(100vh - 32px)}
.panel h2{font-size:13px;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em;color:#6B645B}
.panel button{font:inherit;cursor:pointer}
.navlist button{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:6px}
.navlist button.on{background:#F1E6DC;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{border:1px solid #8A8175;background:#fff;border-radius:999px;padding:3px 9px;font-size:12px}
.chips button.on{background:#8A5A3B;color:#fff;border-color:#8A5A3B}
.toggles label{display:block;margin:3px 0}
.note{background:#F5EFE7;border-radius:8px;padding:8px;margin-top:8px;white-space:pre-wrap}
.jsteps li{margin:3px 0}.jsteps li.on{font-weight:700}
.stage{display:flex;justify-content:center;align-items:flex-start}
/* Phone: 375 x 812 pt */
.phone{width:375px;height:812px;border-radius:44px;border:10px solid #1d1b19;position:relative;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font:600 15px var(--sans);position:absolute;top:0;left:0;right:0;z-index:30}
.scr{position:absolute;top:44px;left:0;right:0;bottom:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;padding:8px 20px 280px}
.scroll.short{padding-bottom:40px}
.pinned{position:absolute;left:12px;right:12px;bottom:92px;z-index:10;padding:12px;border-radius:28px}
.pinned.nobar{bottom:16px}
.tabbar{position:absolute;left:16px;right:16px;bottom:14px;height:62px;border-radius:31px;display:flex;justify-content:space-around;align-items:center;z-index:12}
.tabbar div{font:600 11px var(--sans);text-align:center;color:var(--muted);min-width:60px}.tabbar div.on{color:var(--accent)}
.tabbar svg{display:block;margin:0 auto 2px}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:4px 12px;min-height:52px;z-index:11}
/* Materials */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:1px solid var(--glassEdge);box-shadow:var(--glassShadow)}
.glassClear{background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.35);color:#fff}
.rt .glass{background:var(--raised);-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid var(--line);box-shadow:none}
.rt .glassClear{background:#2B2722;-webkit-backdrop-filter:none;backdrop-filter:none}
.glassBtn{background:transparent;border:0;border-radius:999px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font:500 16px var(--sans);color:var(--accent);cursor:pointer}
/* Type (tokens.ts) and AX5 sizes */
.t-promptHero{font:400 28px/36px var(--serif)} .t-prompt{font:400 24px/32px var(--serif)}
.t-title1{font:500 28px/34px var(--serif)} .t-title2{font:500 22px/28px var(--serif)}
.t-headline{font:600 18px/23px var(--sans)} .t-body{font:400 18px/24px var(--sans)} .t-callout{font:400 17px/22px var(--sans)}
.t-subhead{font:400 16px/21px var(--sans)} .t-footnote{font:400 14px/19px var(--sans)}
.t-dateline{font:500 14px/18px var(--sans);letter-spacing:.6px;text-transform:uppercase}
.t-letter{font:400 20px/32px var(--serif)} .t-sig{font:italic 400 20px/32px var(--serif)}
.ax5 .t-promptHero{font-size:58px;line-height:68px}.ax5 .t-prompt{font-size:55px;line-height:64px}
.ax5 .t-title1{font-size:58px;line-height:66px}.ax5 .t-title2{font-size:56px;line-height:64px}
.ax5 .t-headline{font-size:53px;line-height:62px;font-weight:700}.ax5 .t-body{font-size:53px;line-height:62px}
.ax5 .t-callout{font-size:51px;line-height:60px}.ax5 .t-subhead{font-size:49px;line-height:58px}
.ax5 .t-footnote{font-size:44px;line-height:52px}.ax5 .t-dateline{font-size:44px;line-height:52px}
.ax5 .t-letter{font-size:60px;line-height:76px}.ax5 .t-sig{font-size:60px;line-height:76px}
.ax5 .btn{font-size:49px;line-height:58px;font-weight:700}
.muted{color:var(--muted)} .accent{color:var(--accent)} .caution{color:var(--caution)}
/* Buttons */
.btn{border:0;border-radius:999px;min-height:44px;padding:10px 18px;font:600 17px/22px var(--sans);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-sizing:border-box;text-align:center;word-break:break-word}
.btn.primary{background:var(--accent);color:var(--onAccent);min-height:56px}
.btn.secondary{background:var(--raised);color:var(--text);border:1px solid var(--controlBorder)}
.btn.capture{background:var(--accent);color:var(--onAccent);min-height:64px;flex:1}
.btn.quiet{background:none;color:var(--accent);font-weight:500}
.btn.dim{opacity:.38;cursor:default}
.btn.full{width:100%}
.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:6px}
.ax5 .row.stackax{flex-direction:column}
.center{text-align:center;align-items:center;justify-content:center}
.card{background:var(--raised);border-radius:14px;padding:14px;box-shadow:0 2px 6px rgba(43,39,34,.06)}
.dark .card{box-shadow:none;border:1px solid var(--line)}
.sheetPaper{background:var(--raised);border-radius:28px 28px 14px 14px;padding:20px;box-shadow:0 6px 16px rgba(43,39,34,.10)}
.dark .sheetPaper{box-shadow:none;border:1px solid var(--line)}
.hctl{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--muted);cursor:pointer;background:none;border:0;padding:0;text-align:left}
.hctl u{text-decoration:none;border-bottom:1px dotted var(--controlBorder)}
.mark{border-bottom:2px dotted var(--editMark)} .struck{text-decoration:line-through;color:var(--muted)}
.lamp{position:absolute;top:-80px;right:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(233,170,90,.30),rgba(233,170,90,0) 65%);pointer-events:none}
.dark .lamp{background:radial-gradient(circle,rgba(217,164,126,.16),rgba(217,164,126,0) 65%)}
.pic{position:relative;border-radius:8px;overflow:hidden;background:linear-gradient(#cfe1ea,#f3dcc0);border:1px solid transparent}
.dark .pic,.hc .pic{border-color:var(--line)}
.pic .sun{position:absolute;width:30%;aspect-ratio:1;border-radius:50%;background:#f2b45c;top:14%;left:58%}
.pic .hill{position:absolute;left:-10%;right:-10%;bottom:-30%;height:60%;border-radius:50%;background:#7d9a6a}
.pic .hill2{position:absolute;left:30%;right:-40%;bottom:-38%;height:55%;border-radius:50%;background:#5f7d55}
.aura{width:240px;height:240px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(181,71,58,.22),rgba(181,71,58,0) 70%)}
.disc{width:120px;height:120px;border-radius:50%;background:var(--recording);cursor:pointer}
.disc.dimmed{opacity:.45}
.scrimL{position:absolute;inset:0;background:var(--scrim);z-index:20}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:21;border-radius:34px;padding:18px 20px 22px;max-height:84%;overflow:auto}
.alert{position:absolute;left:44px;right:44px;top:270px;z-index:21;border-radius:26px;padding:20px 16px 8px;text-align:center}
.toast{position:absolute;left:16px;right:16px;bottom:150px;z-index:15;border-radius:24px;padding:10px 10px 10px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.vo{display:inline-block;min-width:20px;height:20px;border-radius:10px;background:var(--focus);color:#fff;font:700 12px/20px var(--sans);text-align:center;margin-right:4px;vertical-align:middle}
.ax5 .vo{transform:scale(1.4)}
.field{border:1px solid var(--controlBorder);border-radius:8px;padding:12px;min-height:24px;background:var(--raised);color:var(--text)}
.chipsP{display:flex;flex-wrap:wrap;gap:8px}
.chipP{border:1px solid var(--controlBorder);border-radius:999px;padding:10px 14px;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center}
.chipP.sel{background:var(--accentSoft);border:2px solid var(--accent);font-weight:600}
.listRow{display:flex;justify-content:space-between;align-items:center;min-height:56px;border-bottom:1px solid var(--line);gap:8px;cursor:pointer}
.hyp{border:1px dashed var(--caution);border-radius:10px;padding:8px;margin:6px 0}
.ax5 .scroll{padding-bottom:100px}
.ax5 .btn svg{width:36px;height:36px}
.ax5 .hctl svg{width:32px;height:32px}
.ax5 .pinned{position:static;margin:16px 0 0;padding:0;border:0;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.glassBtn.glass{background:var(--glass);border:1px solid var(--glassEdge)}
.rt .glassBtn.glass{background:var(--raised);border:1px solid var(--line)}
.paperRegion{background:linear-gradient(rgba(0,0,0,0),var(--bg) 18%);box-shadow:none;border:0}
.ax5 .scroll .glass,.ax5 .pinned .glass{background:var(--raised);-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid var(--line);box-shadow:none}
.recCaps{display:flex;align-items:center;gap:10px;justify-content:center}
.dot{width:14px;height:14px;border-radius:7px;background:var(--recording);display:inline-block}
.dot.hollow{background:none;border:2px solid var(--recording)}
small.k{font-family:monospace;color:#6B645B}
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <strong>Area A. Capture</strong><br><span class="muted">Prototype for DESIGN.md. Words are intent (PROPOSED). Fictional family: Asha, and Kiran for two-book states.</span>
    <h2>Display</h2>
    <div class="toggles">
      <label><input type="checkbox" id="tDark"> Dark</label>
      <label><input type="checkbox" id="tAx5"> Largest text (AX5 plus Bold Text)</label>
      <label><input type="checkbox" id="tRt"> Reduce Transparency (solid glass fallback)</label>
      <label><input type="checkbox" id="tHc"> Increase Contrast</label>
      <label><input type="checkbox" id="tVo"> VoiceOver order badges</label>
    </div>
    <h2>Journeys</h2>
    <div class="navlist" id="jlist"></div>
    <h2>Screens</h2>
    <div class="navlist" id="slist"></div>
  </div>
  <div class="stage"><div class="phone" id="phone"></div></div>
  <div class="panel">
    <div id="title" style="font-weight:700;font-size:15px"></div>
    <h2>States</h2><div class="chips" id="states"></div>
    <div class="note" id="note"></div>
    <div id="jpanel"></div>
  </div>
</div>
<script>
'use strict';
/* ---------- Tokens (copied from packages/design-tokens/src/tokens.ts) ---------- */
var THEME={
  light:{bg:'#FBF8F3',surface:'#F5EFE7',raised:'#FFFFFF',text:'#2B2722',muted:'#6B645B',accent:'#8A5A3B',accentSoft:'#F1E6DC',onAccent:'#FFFFFF',line:'#E6DED3',focus:'#2F6F8F',recording:'#B5473A',success:'#3F7A55',caution:'#94661A',controlBorder:'#8A8175',editMark:'#8A5A3B',destructive:'#B5473A',scrim:'rgba(43,39,34,.32)',glass:'rgba(255,253,250,.58)',glassEdge:'rgba(255,255,255,.75)'},
  dark:{bg:'#161412',surface:'#1B1917',raised:'#201D1A',text:'#F2ECE4',muted:'#B3AA9E',accent:'#D9A47E',accentSoft:'#3A2E25',onAccent:'#1E1612',line:'#33302C',focus:'#8CC4DE',recording:'#F08C7C',success:'#8CC9A0',caution:'#E3B866',controlBorder:'#857C70',editMark:'#D9A47E',destructive:'#F08C7C',scrim:'rgba(0,0,0,.55)',glass:'rgba(40,36,32,.58)',glassEdge:'rgba(255,255,255,.14)'},
  hcLight:{muted:'#524B43',accent:'#6E4529',line:'#6B645B'},
  hcDark:{muted:'#D6CEC3',accent:'#E8BC9A',line:'#B3AA9E'}
};
var S={screen:'A-S01',state:'default',dark:false,ax5:false,rt:false,hc:false,vo:false,journey:null,step:0};

/* ---------- Icons (simple strokes) ---------- */
function ic(name,size,color){size=size||20;color=color||'currentColor';var p={
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 pen:'<path d="M4 20l4-1 11-11-3-3L5 16z"/>',
 image:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/>',
 chev:'<path d="M9 6l6 6-6 6"/>',chevd:'<path d="M6 9l6 6 6-6"/>',
 cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
 play:'<path d="M7 5l12 7-12 7z"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>',lock:'<rect x="6" y="11" width="12" height="9" rx="2"/><path d="M9 11V8a3 3 0 0 1 6 0v3"/>',
 refresh:'<path d="M20 11a8 8 0 1 0-2 6M20 5v6h-6"/>',home:'<path d="M4 11l8-7 8 7v9H4z"/>',book:'<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 5-6 8-6s7 2 8 6"/>',
 micoff:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 11 5M3 3l18 18"/>',warn:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16v1"/>'
 }[name]||'';return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';}

/* ---------- Helpers ---------- */
function v(n){return S.vo?'<span class="vo" title="VoiceOver order">'+n+'</span>':'';}
function T(style,text,cls,extra){return '<div class="t-'+style+' '+(cls||'')+'" '+(extra||'')+'>'+text+'</div>';}
function B(label,o){o=o||{};var cls='btn '+(o.kind||'secondary')+(o.full?' full':'')+(o.dim?' dim':'');
 var go=o.go?' data-go="'+o.go+'"':'';return '<button class="'+cls+'"'+go+(o.style?' style="'+o.style+'"':'')+'>'+(o.vo?v(o.vo):'')+(o.icon?ic(o.icon,20):'')+'<span>'+label+'</span></button>';}
function pic(w,h,pan){return '<div class="pic" style="width:'+w+';height:'+h+';'+(pan?'':'')+'" role="img" aria-label="Photo with this letter"><div class="sun"></div><div class="hill"></div><div class="hill2"></div></div>';}
function thumb(){var h=S.ax5?88:160;return '<div style="display:flex;justify-content:center">'+pic(Math.round(h*4/3)+'px',h+'px')+'</div>';}
function tabbar(){return '<div class="tabbar glass">'+[['home','Home',1],['book','Book',0],['me','Me',0]].map(function(t){return '<div class="'+(t[2]?'on':'')+'">'+ic(t[0],22)+t[1]+'</div>';}).join('')+'</div>';}
function closeHdr(extra,left,closeTo){return '<div class="hdr"><span>'+(left||'')+'</span><div class="glass" style="border-radius:999px;display:flex">'+(extra||'')+'<button class="glassBtn" data-go="'+(closeTo||'A-S01:default')+'">Close</button></div></div>';}
function screen(o){ // o: hdr, body, pinned, tab, pinnedNoBar, overlay, inlinePinnedAt
 var pinned=o.pinned?'<div class="pinned '+(o.pinnedClass||'glass')+(o.tab?'':' nobar')+'">'+o.pinned+'</div>':'';
 var body=o.body; if(S.ax5&&o.pinned){ body=body.replace('<!--INLINE-->',pinned); pinned=''; if(body.indexOf('class="pinned')<0) body+= '<div class="pinned">'+o.pinned+'</div>'; }
 return '<div class="scr">'+(o.lamp?'<div class="lamp"></div>':'')+(o.hdr||'')+'<div class="scroll'+(o.pinned?'':' short')+'">'+body+'</div>'+pinned+(o.toast||'')+(o.tab?tabbar():'')+(o.overlay||'')+'</div>';}
function sheet(title,inner){return '<div class="scrimL" data-go="'+(S._back||'A-S07:default')+'"></div><div class="sheet glass" role="dialog">'+T('headline',title,'','style="text-align:center;margin-bottom:12px"')+inner+'</div>';}
function toast(text,undo){return '<div class="toast glass" role="status"><span class="t-subhead">'+text+'</span>'+(undo?B('Undo',{kind:'quiet',go:undo}):'')+'</div>';}

/* ---------- A-S01 Home ---------- */
function home(st){
 var two=/twoBooks/.test(st)||st==='secondAccount';var nameless=st==='twoBooksNameless';
 var child=st==='secondAccount'?'Kiran':'Asha';
 var out='';
 if(two) out+='<button class="hctl t-subhead" data-go="A-S02:default" style="color:var(--text)">'+v(1)+'<span>For '+(nameless?'your child, born 2 March':child)+'</span>'+ic('chevd',16)+'</button>';
 out+=T('dateline',v(2)+(nameless?'Your child &middot; Month 7':(child+' &middot; '+(st==='beforeYou'?'Before You':(child==='Kiran'?'31 months':'7 months')))),'muted','style="margin-top:6px"');
 out+=T('title2',v(3)+'Good evening, <span class="muted">Mama.</span>','','style="margin-top:10px"');
 if(st==='typedDay') out+=T('callout','Nursery starts','','style="margin-top:18px;border-left:3px solid var(--accent);padding-left:10px"')+T('footnote','Your words, from a day you added','muted');
 if(st==='lowStorage') out+=T('footnote','This phone is nearly full. You can still speak a letter. (E-S17 line)','caution','style="margin-top:12px"');
 var prompt=st==='beforeYou'?'What do you want to tell '+child+' before you meet?':'What made '+child+' laugh today?';
 out+='<div style="margin-top:22px">'+T('promptHero',v(4)+prompt)+'<div style="margin-left:-16px;margin-top:6px">'+B('Another thought',{kind:'quiet',icon:'refresh',vo:5})+'</div></div>';
 out+='<!--INLINE-->';
 var slip='';
 if(st==='waiting'){slip='<div class="card" data-go="A-S07:default" style="cursor:pointer">'+v(6)+'<div class="row" style="align-items:center"><div style="flex:1">'+T('subhead','Recorded before the app closed.')+T('footnote','Tue 9 June &middot; 1 min','muted')+'</div>'+pic('40px','40px')+'</div>'+B('Pick it up',{kind:'quiet',go:'A-S07:default'})+'</div><div class="card" style="margin-top:10px">'+T('subhead','Waiting to be kept.')+T('footnote','"You found your toes today."','muted')+B('Open',{kind:'quiet',go:'A-S07:default'})+'</div>';}
 if(st==='heldMany'){slip='<div class="card">'+v(6)+T('subhead','Letters waiting to be kept.')+B('Show them',{kind:'quiet'})+'</div>';}
 if(st==='slipPast'){slip='<div class="card">'+v(6)+T('footnote','A LETTER FROM MAY','muted t-dateline')+T('letter','"You slept on my chest the whole film."')+'<span class="t-footnote muted">B-S17 draws this slip</span></div>';}
 if(slip) out+='<div style="margin-top:28px">'+slip+'</div>';
 // capture cluster
 var c='';
 if(st==='plusLine'||st==='planLapse') c+=T('footnote','New letters need Plus to be kept. Speaking and reading stay open.','muted center','style="padding:0 6px 8px;text-align:center"');
 c+='<div class="glass" style="border-radius:40px;padding:6px"><div class="row stackax">'+B('Speak',{kind:'capture',icon:'mic',go:'A-S05:recording',vo:7})+B('Type',{kind:'capture',icon:'pen',go:'A-S06:default',vo:8})+'</div></div>';
 if(st!=='photoOff') c+=B('Start from a photo',{kind:'quiet',icon:'image',go:'A-S03:open',full:true,vo:9});
 if(st==='quietKept') c+='<div class="row center" style="align-items:center;min-height:44px">'+T('subhead','A quiet day, kept.','muted')+B('Undo',{kind:'quiet',go:'A-S01:default'})+'</div>';
 else c+=B('Not much today',{kind:'quiet',go:'A-S01:quietKept',full:true,vo:10});
 return screen({body:out,pinned:c,tab:true,lamp:true,pinnedClass:'paperRegion'});
}
/* ---------- A-S02 Whose book ---------- */
function whose(st){var base=home('twoBooks');var nameless=st==='nameless';
 var rows=[['Asha',"Asha's book",'Month 7',true],['Kiran',"Kiran's book",'Month 31',false]];

var WORDS_CARDS={writing:['Writing down what you said.','Long recordings take a little more time.','','Read it back later'],

 if(st==='interrupted') out+=T('footnote','A call came in, so the recording stopped there. Everything before that is kept.','muted','style="margin-top:8px"');
 var wc=WORDS_CARDS[st];
 if(wc){out+='<div class="card col center" style="margin-top:18px;min-height:170px">'+T('headline',wc[0],'','style="text-align:center"')+(wc[1]?T('subhead',wc[1],'muted','style="text-align:center"'):'')+(wc[2]?B(wc[2],{kind:'primary',go:wc[2]==='Let it go'?'A-S11:confirm':'A-S13:voiceOnly'}):'')+(wc[3]?B(wc[3],{kind:'quiet',go:'A-S06:default'}):'')+'</div>'+B('Let it go',{kind:'quiet',go:'A-S11:confirm'});return screen({hdr:hdr,body:out});}

 var words;
 if(st==='typed'||st==='laterWords') words='You laughed at the dog until you hiccuped, and then you laughed at the hiccups.';
 else if(st==='exact') words='So um you laughed at the the dog until you hiccuped and then you laughed at the hiccups';

 else if(st==='photoNeedsWords') words='<span class="muted">No words yet.</span>';

 if(st==='editing') words='<div class="field t-letter" style="border:0;padding:0">'+words.replace(/<[^>]+>/g,'')+'<span style="border-left:2px solid var(--accent)"></span></div>';
 var sheetHdr='<div class="'+(S.ax5?'col':'row')+'" style="justify-content:space-between;align-items:flex-start;gap:4px"><div class="col" style="gap:0">'+(two?'<button class="hctl t-dateline" data-go="A-S02:default">'+v(4)+'<u>To Kiran</u>'+ic('chevd',14)+'</button>':'<span class="t-dateline muted" style="min-height:44px;display:flex;align-items:center">'+v(4)+'To Asha</span>')+'<button class="hctl t-dateline" data-go="A-S08:day">'+v(5)+'<u>'+day+'</u>'+ic('cal',14)+'</button></div>'+(fromOff?'<span class="t-dateline muted" style="min-height:44px;display:flex;align-items:center">'+v(6)+'From Mama</span>':'<button class="hctl t-dateline" data-go="A-S09:empty">'+v(6)+'<u>From '+from+'</u>'+ic('pen',14)+'</button>')+'</div>';
 var body;

 else body='<div class="t-letter" style="margin-top:8px">'+v(7)+words+'</div>';
 out+='<div class="sheetPaper" style="margin-top:16px'+(st==='editing'?';border:1.5px solid var(--accent)':'')+'">'+sheetHdr+body+'</div>';
 if(!/typed|laterWords|withheld|editing/.test(st)){
  out+='<div class="row" style="margin-top:14px;border:1px solid var(--controlBorder);border-radius:999px;padding:3px">'+'<div class="chipP '+(st==='exact'?'':'sel')+'" style="flex:1;justify-content:center;border:0">'+v(8)+(st==='exact'?'':'&#10003; ')+'With small fixes</div><div class="chipP '+(st==='exact'?'sel':'')+'" style="flex:1;justify-content:center;border:0">'+(st==='exact'?'&#10003; ':'')+'Exactly as said</div></div>';

 }

 else if(!/typed|withheld|editing/.test(st)) out+='<div style="margin-left:-16px">'+B('Add a photo',{kind:'quiet',icon:'image',go:'A-S03:open'})+'</div>';
 if(st!=='editing') out+='<div style="margin-left:-16px">'+B('Let it go',{kind:'quiet',go:st==='withPhoto'?'A-S11:confirmPhoto':'A-S11:confirm',style:'color:var(--muted)',vo:13})+'</div>';
 out+='<!--INLINE-->';
 var keepOff=st==='photoNeedsWords';
 var foot=st==='editing'?B('Done',{kind:'primary',full:true,go:'A-S07:default'}):
  (st==='saveFailed'?T('subhead','That did not save. Your words are still here.','caution','style="text-align:center;padding-bottom:6px" role="alert"'):'')+
  (keepOff?T('footnote','A letter needs words. Speak or type a few.','muted','style="text-align:center;padding-bottom:6px"'):'')+
  B(st==='saveFailed'?'Try again':(two?"Add to Kiran's book":"Add to Asha's book"),{kind:'primary',full:true,dim:keepOff,go:keepOff?'':(/withPhoto/.test(st)?'A-S13:savedPhoto':'A-S13:saved'),vo:14})+B('Keep private',{kind:'quiet',full:true,dim:keepOff,go:keepOff?'':'A-S13:savedPrivate',vo:15});
 var tst='';
 if(st==='photoUndo') tst=toast('Photo taken off.','A-S07:withPhoto');
 if(st==='withheldUndo') tst=toast('Words set aside.','A-S07:anotherLanguageOffer');
