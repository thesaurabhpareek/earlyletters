<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area B, Book and reading: motion prototype</title>
<!--
  Self-contained motion prototype for area B (Book and reading). No network, no framework.
  Every value is copied from packages/design-tokens/src/tokens.ts (tokens.motion and the colours).
  Moment ids (B-Mnn) and screen ids (B-Snn) match MOTION.md and DESIGN.md in this folder.
  Words on screen are placeholders: WORDS.md owns every string. Fictional family only (Asha).
  Pictures are drawn shapes, never photos of people.
-->
<style>
:root{
  --bg:#FBF8F3; --surface:#F5EFE7; --raised:#FFFFFF; --text:#2B2722; --muted:#6B645B; --accent:#8A5A3B;
  --accentSoft:#F1E6DC; --onAccent:#FFFFFF; --line:#E6DED3; --controlBorder:#8A8175; --focus:#2F6F8F;
  --destructive:#B5473A; --scrim:rgba(43,39,34,0.32); --lampCore:rgba(255,226,168,0.55); --lampTail:rgba(243,201,139,0);
  --dusk:rgba(184,129,175,0.14); --glassRGB:255,255,255;
}
.dark{
  --bg:#161412; --surface:#1B1917; --raised:#201D1A; --text:#F2ECE4; --muted:#B3AA9E; --accent:#D9A47E;
  --accentSoft:#3A2E25; --onAccent:#1E1612; --line:#33302C; --controlBorder:#857C70; --focus:#8CC4DE;
  --destructive:#F08C7C; --scrim:rgba(0,0,0,0.55); --lampCore:rgba(255,226,168,0.16); --lampTail:rgba(243,201,139,0);
  --dusk:rgba(128,118,226,0.30); --glassRGB:44,40,36;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#E9E4DC;color:#2B2722}
body.darkPage{background:#0d0c0b;color:#F2ECE4}
.app{display:flex;gap:24px;padding:20px;align-items:flex-start;flex-wrap:wrap}
aside{width:330px;flex:none}
aside h1{font-size:18px;margin:0 0 6px}
aside p.sub{font-size:13px;margin:0 0 12px;opacity:.8;line-height:1.4}
.toggles{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;padding:10px;border:1px solid rgba(128,128,128,.4);border-radius:10px}
.toggles label{font-size:14px;display:flex;gap:8px;align-items:center;min-height:32px}
nav .grp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.7;margin:14px 0 4px}
nav button{display:block;width:100%;text-align:left;font:inherit;font-size:13px;padding:8px 10px;margin:2px 0;border-radius:8px;border:1px solid transparent;background:transparent;color:inherit;cursor:pointer;min-height:36px}
nav button:hover{border-color:rgba(128,128,128,.5)}
nav button.on{background:rgba(138,90,59,.15);border-color:rgba(138,90,59,.6)}
main{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.phoneWrap{position:relative}
.phone{width:375px;height:812px;border-radius:48px;border:10px solid #1d1b19;box-sizing:content-box;overflow:hidden;position:relative;background:var(--bg)}
#screen{position:absolute;inset:0;overflow:hidden;background:var(--bg);color:var(--text)}
.demoTag{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:12px;padding:4px 10px;border-radius:999px;background:#2F6F8F;color:#fff;opacity:0;pointer-events:none;white-space:nowrap;z-index:9}
.side2{width:400px;max-width:100%}
#controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
#controls button{font:inherit;font-size:14px;padding:9px 14px;border-radius:999px;border:1px solid #8A8175;background:#fff;color:#2B2722;cursor:pointer;min-height:44px}
body.darkPage #controls button{background:#201D1A;color:#F2ECE4;border-color:#857C70}
#info{font-size:13px;line-height:1.45;border:1px solid rgba(128,128,128,.4);border-radius:12px;padding:12px 14px}
#info h2{font-size:16px;margin:0 0 6px}
#info dt{font-weight:600;margin-top:8px}
#info dd{margin:2px 0 0 0}
#caption{font-size:13px;min-height:40px;margin:10px 0;padding:8px 10px;border-left:3px solid #2F6F8F;background:rgba(47,111,143,.08)}

.paper{position:absolute;z-index:51;background:var(--raised);pointer-events:none}
.carried{position:absolute;z-index:53;pointer-events:none;margin:0}
.page{position:absolute;inset:0;z-index:52;overflow-y:auto;scrollbar-width:none}

.pagehead{height:91px;display:flex;align-items:flex-end;padding:0 12px 4px;gap:4px}

.pagebody .opening .dateline{font-size:13px}

.field{border:1px solid var(--controlBorder);border-radius:8px;min-height:44px;padding:10px 12px;font-size:15px;color:var(--muted);background:var(--bg)}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:70;color:var(--text);border-radius:18px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:10px;font-size:15px;min-height:52px}

.menu{position:absolute;z-index:62;right:16px;width:240px;background:var(--raised);border-radius:14px;border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.18);transform-origin:90% 0}
.menu div{min-height:48px;display:flex;align-items:center;padding:0 16px;border-top:1px solid var(--line);font-size:16px;cursor:pointer}
.menu div:first-child{border-top:0}
.find{position:absolute;inset:0;background:var(--bg);z-index:12;opacity:0}
.findbar{padding:51px 16px 8px;display:flex;gap:8px;align-items:center}
.findfield{flex:1;min-height:44px;border-radius:10px;background:var(--surface);display:flex;align-items:center;padding:0 12px;gap:8px;font-size:17px}
.findfield .caret{width:2px;height:22px;background:var(--focus)}
.frow{padding:12px 20px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.frow .s{font-family:Georgia,serif;font-size:16px;line-height:24px}
.frow u{text-decoration-thickness:2px;font-weight:600}
.kbd{position:absolute;left:0;right:0;bottom:0;height:291px;background:#D1D3D9;z-index:13;transform:translateY(100%)}
.dark .kbd{background:#2c2c2e}
.kbd .k{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding:10px 4px}
.kbd .k i{height:42px;border-radius:5px;background:rgba(255,255,255,.85)}
.dark .kbd .k i{background:#5b5b5e}
.rt{position:absolute;inset:0;z-index:15;background:var(--bg);opacity:0}

.rthead{height:91px;display:flex;align-items:flex-end;padding:0 8px 4px}
.hair{height:2px;margin:0 20px;background:var(--line);position:relative}
.hair i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.4}
.stage{position:absolute;left:0;right:0;top:100px;bottom:120px;overflow:hidden;touch-action:pan-y}
.rpage{position:absolute;inset:0;padding:28px 28px}

.glass{background:rgba(var(--glassRGB),calc(var(--ga,0)*0.62));-webkit-backdrop-filter:blur(calc(var(--gb,0)*1px)) saturate(calc(1 + var(--ga,0)*0.6));backdrop-filter:blur(calc(var(--gb,0)*1px)) saturate(calc(1 + var(--ga,0)*0.6));box-shadow:0 0 0 1px rgba(128,128,128,calc(var(--ga,0)*0.28)),0 4px 18px rgba(0,0,0,calc(var(--ga,0)*0.10))}

.findbarG{position:absolute;left:12px;right:12px;top:51px;z-index:14;display:flex;gap:6px;align-items:center;border-radius:22px;padding:4px}

</style>

<body>
<div class="app">
  <aside>
    <h1>Area B: Book and reading. Motion</h1>
    <p class="sub">Pick a moment, then use the buttons under the phone to play it. Ids match MOTION.md. Every number comes from <code>tokens.motion</code> (and the v2 proposals, where marked). Each moment names its v2 primitive (<code>m.*</code>) and transition row (<code>T-*</code>). Words are placeholders for WORDS.md.</p>
    <div class="toggles">
      <label><input type="checkbox" id="rm"> Reduce Motion</label>
      <label><input type="checkbox" id="rt"> Reduce Transparency (glass becomes solid)</label>
      <label><input type="checkbox" id="dark"> Dark</label>
      <label><input type="checkbox" id="v2spring"> v2 standard spring (0.30 s, proposed; off = today's 0.40 s)</label>
      <label><input type="checkbox" id="slow"> Slow (x4, to study a move; not a real setting)</label>
    </div>
    <nav id="list"></nav>
  </aside>
  <main>
    <div class="phoneWrap">
      <div class="demoTag" id="tag"></div>
      <div class="phone" id="phone"><div id="screen"></div></div>
    </div>
    <div class="side2">
      <div id="controls"></div>
      <div id="caption" aria-live="polite"></div>
      <div id="info"></div>
    </div>
  </main>
</div>
<script>
'use strict';
/* ---------------- tokens (copied from packages/design-tokens/src/tokens.ts) ---------------- */
var M = {
  fadeMs: 200, exitMs: 160, swapMs: 150, enter: { dy: 8, ms: 280 }, staggerMs: 30, staggerMax: 6,
  snappy: { k: 520, c: 46, m: 1 }, standard: { k: 260, c: 30, m: 1 }, standardToday: { k: 260, c: 30, m: 1 }, standardV2: { k: 439, c: 38.5, m: 1 }, glassMs: 250,
  cardToPage: { contentFrom: 0.6, holdMs: 136, clearPt: 24, homePt: 4 }, pageTurn: { dx: 24 },
  lamp: { leaveMs: 160, returnMs: 280, arriveMs: 1200 }, dissolveMs: 280, newMarkMs: 1600, drawMs: 1200,
  press: { card: 0.98 }, handOff: { leaveMs: 140, arriveFromMs: 80, arriveMs: 120 }, HAND_OFF: 0.35
};
var RM = false, RTX = false, SLOW = 1, gen = 0;
var screen = document.getElementById('screen');

/* ---------------- motion engine ---------------- */
function bezier(x1, y1, x2, y2) {
  function cx(t) { return 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t; }
  function cy(t) { return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t; }
  return function (x) {
    if (x <= 0) return 0; if (x >= 1) return 1;
    var lo = 0, hi = 1, t = x;
    for (var i = 0; i < 24; i++) { t = (lo + hi) / 2; if (cx(t) < x) lo = t; else hi = t; }
    return cy(t);
  };
}
var EASE = bezier(0.2, 0, 0, 1);
var EASE_EXIT = bezier(0.3, 0, 1, 1); /* v2 easing.exit (UNVERIFIED in v2) */
function lin(x) { return x; }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function tween(ms, f, o) {
  o = o || {}; var g = gen, ease = o.ease || lin, d = (o.delay || 0) * SLOW, dur = Math.max(1, ms * SLOW);
  return new Promise(function (res) {
    var t0 = performance.now();
    function fr() {
      if (g !== gen) return res(false);
      var t = performance.now() - t0 - d;
      if (t < 0) { requestAnimationFrame(fr); return; }
      var p = Math.min(1, t / dur); f(ease(p), p);
      if (p < 1) requestAnimationFrame(fr); else res(true);
    }
    if (d === 0) f(ease(0), 0);
    requestAnimationFrame(fr);
  });
}
function spring(cfg, f, o) {
  o = o || {}; var g = gen, from = o.from == null ? 0 : o.from, to = o.to == null ? 1 : o.to, x = from, v = o.v || 0, d = (o.delay || 0) * SLOW;
  return new Promise(function (res) {
    var t0 = performance.now(), last = null;
    function fr() {
      if (g !== gen) return res(false);
      var nowT = performance.now(), t = nowT - t0 - d;
      if (t < 0) { requestAnimationFrame(fr); return; }
      var dt = last == null ? 0 : (nowT - last) / 1000 / SLOW; last = nowT; dt = Math.min(dt, 1 / 30);
      var n = Math.max(1, Math.ceil(dt / 0.002)), h = dt / n;
      for (var i = 0; i < n; i++) { var a = (-cfg.k * (x - to) - cfg.c * v) / cfg.m; v += a * h; x += v * h; }
      f(x);
      var range = Math.abs(to - from) || 1;
      if (dt > 0 && Math.abs(x - to) < range * 0.002 && Math.abs(v) < range * 0.05) { f(to); res(true); }
      else requestAnimationFrame(fr);
    }
    f(from); requestAnimationFrame(fr);
  });
}
function wait(ms) { var g = gen; return new Promise(function (r) { setTimeout(function () { r(g === gen); }, ms * SLOW); }); }
function fade(el, from, to, ms, o) { return tween(ms, function (p) { el.style.opacity = from + (to - from) * p; }, o); }
/* v2 m.glass: animate the glass style ('none' <-> 'regular') over 0.25 s; children (.gc) swap in. Under Reduce
   Transparency the surface is solid, so it uses m.fade (opacity of a solid surface is allowed). */
function glassSet(el, v) { el.style.setProperty('--ga', v); el.style.setProperty('--gb', 18 * v); }
function glassInit(el, on) {

function renderList() {
  var nav = document.getElementById('list'), grp = null, html = '';
  S.forEach(function (s, i) {
    if (s.grp !== grp) { grp = s.grp; html += '<div class="grp">' + grp + '</div>'; }
    html += '<button data-i="' + i + '">' + s.id + ' ' + s.title + '</button>';
  });
  nav.innerHTML = html;
  Array.prototype.forEach.call(nav.querySelectorAll('button'), function (b) { b.onclick = function () { select(+b.getAttribute('data-i')); }; });
}
function select(i) {
  gen++; toastEl = null; open = null; RT.busy = false;
  current = S[i];
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) { b.classList.toggle('on', +b.getAttribute('data-i') === i); });
  caption('');
  current.setup();
  var c = document.getElementById('controls'); c.innerHTML = '';
  current.actions.forEach(function (a) {
    var b = document.createElement('button'); b.textContent = a.label;
    b.onclick = function () { gen++; RT.busy = false; a.run(); };
    c.appendChild(b);
  });
  var r = document.createElement('button'); r.textContent = 'Reset'; r.onclick = function () { select(i); }; c.appendChild(r);
  document.getElementById('info').innerHTML = '<h2>' + current.id + ': ' + current.title + '</h2><dl>' +
    '<dt>Screen and state (DESIGN.md)</dt><dd>' + current.screen + '</dd><dt>v2 primitive and transition</dt><dd>' + (current.v2 || '') + '</dd><dt>Trigger</dt><dd>' + current.trigger + '</dd><dt>What moves</dt><dd>' + current.moves + '</dd>' +
    '<dt>Reduce Motion</dt><dd>' + current.rm + '</dd><dt>Haptic</dt><dd>' + current.haptic + '</dd><dt>Never</dt><dd>' + current.never + '</dd></dl>';
}
document.getElementById('rm').onchange = function (e) { RM = e.target.checked; if (current) select(S.indexOf(current)); };
document.getElementById('rt').onchange = function (e) { RTX = e.target.checked; screen.classList.toggle('rtx', RTX); if (current) select(S.indexOf(current)); };
document.getElementById('v2spring').onchange = function (e) { M.standard = e.target.checked ? M.standardV2 : M.standardToday; };
document.getElementById('slow').onchange = function (e) { SLOW = e.target.checked ? 4 : 1; };
document.getElementById('dark').onchange = function (e) { document.getElementById('phone').classList.toggle('dark', e.target.checked); screen.classList.toggle('dark', e.target.checked); document.body.classList.toggle('darkPage', e.target.checked); };
renderList(); select(0);
</script>
</body>
</html>
