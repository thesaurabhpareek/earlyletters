<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area B, Book and reading: motion prototype</title>
<!--
  Self-contained motion prototype for area B (Book and reading). No network, no framework.
  Every value is copied from packages/design-tokens/src/tokens.ts (tokens.motion and the colours).
  Moment ids (B-Mnn) and screen ids (B-Snn) match MOTION.md and DESIGN.md in this folder.
  Words on screen are placeholders: WORDS.md owns every string. Fictional family only (Asha).
  Pictures are drawn shapes, never photos of people.
-->
<style>
:root{
  --bg:#FBF8F3; --surface:#F5EFE7; --raised:#FFFFFF; --text:#2B2722; --muted:#6B645B; --accent:#8A5A3B;
  --accentSoft:#F1E6DC; --onAccent:#FFFFFF; --line:#E6DED3; --controlBorder:#8A8175; --focus:#2F6F8F;
  --destructive:#B5473A; --scrim:rgba(43,39,34,0.32); --lampCore:rgba(255,226,168,0.55); --lampTail:rgba(243,201,139,0);
  --dusk:rgba(184,129,175,0.14);
}
.dark{
  --bg:#161412; --surface:#1B1917; --raised:#201D1A; --text:#F2ECE4; --muted:#B3AA9E; --accent:#D9A47E;
  --accentSoft:#3A2E25; --onAccent:#1E1612; --line:#33302C; --controlBorder:#857C70; --focus:#8CC4DE;
  --destructive:#F08C7C; --scrim:rgba(0,0,0,0.55); --lampCore:rgba(255,226,168,0.16); --lampTail:rgba(243,201,139,0);
  --dusk:rgba(128,118,226,0.30);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#E9E4DC;color:#2B2722}
body.darkPage{background:#0d0c0b;color:#F2ECE4}
.app{display:flex;gap:24px;padding:20px;align-items:flex-start;flex-wrap:wrap}
aside{width:330px;flex:none}
aside h1{font-size:18px;margin:0 0 6px}
aside p.sub{font-size:13px;margin:0 0 12px;opacity:.8;line-height:1.4}
.toggles{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;padding:10px;border:1px solid rgba(128,128,128,.4);border-radius:10px}
.toggles label{font-size:14px;display:flex;gap:8px;align-items:center;min-height:32px}
nav .grp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.7;margin:14px 0 4px}
nav button{display:block;width:100%;text-align:left;font:inherit;font-size:13px;padding:8px 10px;margin:2px 0;border-radius:8px;border:1px solid transparent;background:transparent;color:inherit;cursor:pointer;min-height:36px}
nav button:hover{border-color:rgba(128,128,128,.5)}
nav button.on{background:rgba(138,90,59,.15);border-color:rgba(138,90,59,.6)}
main{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.phoneWrap{position:relative}
.phone{width:375px;height:812px;border-radius:48px;border:10px solid #1d1b19;box-sizing:content-box;overflow:hidden;position:relative;background:var(--bg)}
#screen{position:absolute;inset:0;overflow:hidden;background:var(--bg);color:var(--text)}
.demoTag{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:12px;padding:4px 10px;border-radius:999px;background:#2F6F8F;color:#fff;opacity:0;pointer-events:none;white-space:nowrap;z-index:9}
.side2{width:400px;max-width:100%}
#controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
#controls button{font:inherit;font-size:14px;padding:9px 14px;border-radius:999px;border:1px solid #8A8175;background:#fff;color:#2B2722;cursor:pointer;min-height:44px}
body.darkPage #controls button{background:#201D1A;color:#F2ECE4;border-color:#857C70}
#info{font-size:13px;line-height:1.45;border:1px solid rgba(128,128,128,.4);border-radius:12px;padding:12px 14px}
#info h2{font-size:16px;margin:0 0 6px}
#info dt{font-weight:600;margin-top:8px}
#info dd{margin:2px 0 0 0}
#caption{font-size:13px;min-height:40px;margin:10px 0;padding:8px 10px;border-left:3px solid #2F6F8F;background:rgba(47,111,143,.08)}

/* ---------- phone UI ---------- */
.status{height:47px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font-size:15px;font-weight:600}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:83px;border-top:1px solid var(--line);background:var(--bg);display:flex;justify-content:space-around;padding-top:8px;font-size:11px;color:var(--muted);z-index:3}
.tabbar span{min-width:60px;text-align:center}
.tabbar span.on{color:var(--accent);font-weight:600}
.lamp{position:absolute;left:-20%;right:-20%;top:-30%;height:80%;background:radial-gradient(ellipse at 50% 30%,var(--lampCore),var(--lampTail) 65%);pointer-events:none;z-index:0}
.scroll{position:absolute;left:0;right:0;top:0;bottom:83px;overflow-y:auto;overflow-x:hidden;z-index:1;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.band{padding:4px 20px 8px}
.title{font-family:Georgia,"Times New Roman",serif;font-size:32px;line-height:38px;margin:4px 0 0;font-weight:600}
.age{font-size:16px;color:var(--muted);margin:2px 0 12px}
.btn{font:inherit;font-size:16px;border-radius:999px;border:1px solid var(--controlBorder);background:transparent;color:var(--text);min-height:44px;padding:0 16px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.btn.tint{background:var(--accentSoft);border-color:transparent}
.btn.full{width:100%}
.btn.quiet{border-color:transparent;padding:0 8px;color:var(--accent)}
.btn.danger{color:var(--destructive);border-color:var(--controlBorder)}
.iconbtn{width:44px;height:44px;border-radius:999px;border:0;background:transparent;color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.barrow{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.radio{display:inline-flex;border:1px solid var(--controlBorder);border-radius:999px;padding:2px;gap:2px}
.radio button{position:relative;font:inherit;font-size:14px;min-height:40px;min-width:44px;padding:0 12px;border-radius:999px;border:1.5px solid transparent;background:transparent;color:var(--text);cursor:pointer}
.radio button .fill{position:absolute;inset:-1.5px;border-radius:999px;background:var(--accentSoft);border:1.5px solid var(--accent);opacity:0;z-index:0}
.radio button span{position:relative;z-index:1}
.radio button.sel span{font-weight:600}
.opener{font-family:Georgia,"Times New Roman",serif;font-size:22px;margin:22px 20px 8px;font-weight:600}
.row{padding:0 20px 12px;overflow:hidden}
.card{background:var(--raised);border-radius:14px;padding:14px 16px;border:1px solid var(--line);position:relative;cursor:pointer;transform-origin:50% 50%}
.dark .card{border-color:var(--line)}
.card .wash{position:absolute;inset:0;border-radius:14px;background:var(--accentSoft);opacity:0;pointer-events:none}
.ctext{position:relative}
.dateline{font-size:13px;color:var(--muted);letter-spacing:.02em;margin-bottom:4px}
.words{font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:26px}
.meta{font-size:13px;color:var(--muted);margin-top:8px;font-style:italic;position:relative}
.thumb{height:130px;border-radius:8px;background:var(--surface);margin-bottom:10px;overflow:hidden;position:relative}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.hiddenrow{margin:0 20px 12px;padding:12px 16px;border-radius:14px;border:1px dashed var(--controlBorder);font-size:15px;color:var(--text);min-height:48px;display:flex;align-items:center;gap:10px}
.endmark{text-align:center;font-family:Georgia,serif;font-size:28px;color:var(--muted);padding:20px 0 40px}
.inlinebar{position:absolute;left:0;right:0;top:0;padding:47px 20px 6px;background:var(--bg);border-bottom:1px solid var(--line);z-index:2;opacity:0;pointer-events:none}
.inlinebar .r{display:flex;align-items:center;gap:6px;min-height:44px}
.inlinebar .t{flex:1;font-weight:600;font-size:17px}
.inlinebar .m{font-size:14px;color:var(--muted)}
.veil{position:absolute;inset:0;background:var(--bg);opacity:0;z-index:5;pointer-events:none}
.paper{position:absolute;z-index:6;background:var(--raised);pointer-events:none}
.carried{position:absolute;z-index:8;pointer-events:none;margin:0}
.page{position:absolute;inset:0;z-index:7;overflow-y:auto;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.page.solid{background:var(--bg)}
.pagehead{height:91px;display:flex;align-items:flex-end;padding:0 12px 4px;gap:4px}
.pagebody{padding:8px 36px 40px}
.pagebody .opening .dateline{font-size:13px}
.pagebody .words{font-size:17px;line-height:26px}
.list{margin:22px 0 0;border-radius:14px;background:var(--raised);border:1px solid var(--line);overflow:hidden}
.listtitle{font-weight:600;font-size:17px;margin:24px 0 0}
.lrow{min-height:56px;padding:10px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;cursor:pointer;position:relative;background:var(--raised)}
.lrow:first-child{border-top:0}
.lrow .lt{flex:1;font-size:15px}
.lrow .lv{font-size:15px;color:var(--muted);position:relative;min-width:90px;text-align:right}
.lrow .lv span{position:absolute;right:0;top:50%;transform:translateY(-50%);white-space:nowrap}
.switch{width:51px;height:31px;border-radius:999px;background:var(--controlBorder);position:relative;flex:none}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:#3F7A55}
.field{border:1px solid var(--controlBorder);border-radius:8px;min-height:44px;padding:10px 12px;font-size:15px;color:var(--muted);background:var(--bg)}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:20;background:var(--text);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:10px;font-size:15px;min-height:52px}
.toast button{font:inherit;font-weight:600;background:transparent;border:0;color:var(--bg);min-height:44px;padding:0 8px;cursor:pointer;text-decoration:underline}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:30;opacity:0}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--raised);border-radius:28px 28px 0 0;padding:10px 20px 34px;}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 8px;font-size:18px}
.sheet .opt{min-height:48px;display:flex;align-items:center;border-top:1px solid var(--line);font-size:16px;cursor:pointer}
.sheet p{font-size:15px;color:var(--muted);margin:0 0 12px;line-height:1.4}
.menu{position:absolute;z-index:32;right:16px;width:240px;background:var(--raised);border-radius:14px;border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.18);transform-origin:90% 0}
.menu div{min-height:48px;display:flex;align-items:center;padding:0 16px;border-top:1px solid var(--line);font-size:16px;cursor:pointer}
.menu div:first-child{border-top:0}
.find{position:absolute;inset:0;background:var(--bg);z-index:12;opacity:0}
.findbar{padding:51px 16px 8px;display:flex;gap:8px;align-items:center}
.findfield{flex:1;min-height:44px;border-radius:10px;background:var(--surface);display:flex;align-items:center;padding:0 12px;gap:8px;font-size:17px}
.findfield .caret{width:2px;height:22px;background:var(--focus)}
.frow{padding:12px 20px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.frow .s{font-family:Georgia,serif;font-size:16px;line-height:24px}
.frow u{text-decoration-thickness:2px;font-weight:600}
.kbd{position:absolute;left:0;right:0;bottom:0;height:291px;background:#D1D3D9;z-index:13;transform:translateY(100%)}
.dark .kbd{background:#2c2c2e}
.kbd .k{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding:10px 4px}
.kbd .k i{height:42px;border-radius:5px;background:rgba(255,255,255,.85)}
.dark .kbd .k i{background:#5b5b5e}
.rt{position:absolute;inset:0;z-index:15;background:var(--bg);opacity:0}
.rt .pool{position:absolute;left:-30%;right:-30%;bottom:-25%;height:60%;background:radial-gradient(ellipse at 50% 80%,var(--dusk),transparent 70%);opacity:0;pointer-events:none}
.rthead{height:91px;display:flex;align-items:flex-end;padding:0 8px 4px}
.hair{height:2px;margin:0 20px;background:var(--line);position:relative}
.hair i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.4}
.stage{position:absolute;left:0;right:0;top:100px;bottom:120px;overflow:hidden;touch-action:pan-y}
.rpage{position:absolute;inset:0;padding:28px 28px}
.rpage .dl{font-size:15px;color:var(--muted);margin-bottom:12px}
.rpage .w{font-family:Georgia,serif;font-size:24px;line-height:36px}
.rtbtns{position:absolute;left:16px;right:16px;bottom:34px;display:flex;gap:10px;z-index:2}
.rtbtns .btn{flex:1;min-height:56px}
.home .dl{font-size:13px;color:var(--muted);padding:0 20px;margin-top:8px;text-transform:uppercase;letter-spacing:.05em}
.home .gr{font-family:Georgia,serif;font-size:30px;padding:0 20px;margin:6px 0 16px}
.prompt{margin:0 20px;padding:18px;border-radius:20px;background:var(--raised);border:1px solid var(--line);font-family:Georgia,serif;font-size:21px;line-height:30px}
.slip{margin:14px 20px 0;padding:14px 16px;border-radius:14px;background:var(--raised);border:1px solid var(--line)}
.slip .k{font-size:13px;color:var(--muted)}
.slip .f{font-family:Georgia,serif;font-size:17px;line-height:26px;margin-top:4px}
.slip .nt{margin-top:6px}
.capture{position:absolute;left:20px;right:20px;bottom:100px;display:flex;gap:12px;z-index:2}
.capture .btn{flex:1;min-height:64px;font-size:18px}
.pic{height:180px;border-radius:8px;overflow:hidden;position:relative;background:var(--surface);margin:0 0 14px}
.pic svg{position:absolute;inset:0;width:100%;height:100%}
.moon path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.sr{position:absolute;left:-9999px}
</style>

<body>
<div class="app">
  <aside>
    <h1>Area B: Book and reading. Motion</h1>
    <p class="sub">Pick a moment, then use the buttons under the phone to play it. Ids match MOTION.md. Every number comes from <code>tokens.motion</code>. Words are placeholders for WORDS.md.</p>
    <div class="toggles">
      <label><input type="checkbox" id="rm"> Reduce Motion</label>
      <label><input type="checkbox" id="dark"> Dark</label>
      <label><input type="checkbox" id="slow"> Slow (x4, to study a move; not a real setting)</label>
    </div>
    <nav id="list"></nav>
  </aside>
  <main>
    <div class="phoneWrap">
      <div class="demoTag" id="tag"></div>
      <div class="phone" id="phone"><div id="screen"></div></div>
    </div>
    <div class="side2">
      <div id="controls"></div>
      <div id="caption" aria-live="polite"></div>
      <div id="info"></div>
    </div>
  </main>
</div>
<script>
'use strict';
/* ---------------- tokens (copied from packages/design-tokens/src/tokens.ts) ---------------- */
var M = {
  fadeMs: 200, exitMs: 160, swapMs: 150, enter: { dy: 8, ms: 280 }, staggerMs: 30, staggerMax: 6,
  snappy: { k: 520, c: 46, m: 1 }, standard: { k: 260, c: 30, m: 1 }, gentle: { k: 90, c: 18, m: 1 },
  cardToPage: { contentFrom: 0.6, holdMs: 136, clearPt: 24, homePt: 4 }, pageTurn: { dx: 24 },
  lamp: { leaveMs: 160, returnMs: 280, arriveMs: 1200 }, dissolveMs: 280, newMarkMs: 1600, drawMs: 1200,
  press: { card: 0.98 }, handOff: { leaveMs: 140, arriveFromMs: 80, arriveMs: 120 }, HAND_OFF: 0.35
};
var RM = false, SLOW = 1, gen = 0;
var screen = document.getElementById('screen');

/* ---------------- motion engine ---------------- */
function bezier(x1, y1, x2, y2) {
  function cx(t) { return 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t; }
  function cy(t) { return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t; }
  return function (x) {
    if (x <= 0) return 0; if (x >= 1) return 1;
    var lo = 0, hi = 1, t = x;
    for (var i = 0; i < 24; i++) { t = (lo + hi) / 2; if (cx(t) < x) lo = t; else hi = t; }
    return cy(t);
  };
}
var EASE = bezier(0.2, 0, 0, 1);
function lin(x) { return x; }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function tween(ms, f, o) {
  o = o || {}; var g = gen, ease = o.ease || lin, d = (o.delay || 0) * SLOW, dur = Math.max(1, ms * SLOW);
  return new Promise(function (res) {
    var t0 = performance.now();
    function fr() {
      if (g !== gen) return res(false);
      var t = performance.now() - t0 - d;
      if (t < 0) { requestAnimationFrame(fr); return; }
      var p = Math.min(1, t / dur); f(ease(p), p);
      if (p < 1) requestAnimationFrame(fr); else res(true);
    }
    if (d === 0) f(ease(0), 0);
    requestAnimationFrame(fr);
  });
}
function spring(cfg, f, o) {
  o = o || {}; var g = gen, from = o.from == null ? 0 : o.from, to = o.to == null ? 1 : o.to, x = from, v = o.v || 0, d = (o.delay || 0) * SLOW;
  return new Promise(function (res) {
    var t0 = performance.now(), last = null;
    function fr() {
      if (g !== gen) return res(false);
      var nowT = performance.now(), t = nowT - t0 - d;
      if (t < 0) { requestAnimationFrame(fr); return; }
      var dt = last == null ? 0 : (nowT - last) / 1000 / SLOW; last = nowT; dt = Math.min(dt, 1 / 30);
      var n = Math.max(1, Math.ceil(dt / 0.002)), h = dt / n;
      for (var i = 0; i < n; i++) { var a = (-cfg.k * (x - to) - cfg.c * v) / cfg.m; v += a * h; x += v * h; }
      f(x);
      var range = Math.abs(to - from) || 1;
      if (dt > 0 && Math.abs(x - to) < range * 0.002 && Math.abs(v) < range * 0.05) { f(to); res(true); }
      else requestAnimationFrame(fr);
    }
    f(from); requestAnimationFrame(fr);
  });
}
function wait(ms) { var g = gen; return new Promise(function (r) { setTimeout(function () { r(g === gen); }, ms * SLOW); }); }
function fade(el, from, to, ms, o) { return tween(ms, function (p) { el.style.opacity = from + (to - from) * p; }, o); }

/* ---------------- demo helpers ---------------- */
var tagT = null;
function haptic(name) {
  var t = document.getElementById('tag');
  t.textContent = 'Haptic: ' + name; t.style.opacity = 1; t.style.transition = 'none';
  clearTimeout(tagT); tagT = setTimeout(function () { t.style.transition = 'opacity .4s'; t.style.opacity = 0; }, 900);
}
function caption(s) { document.getElementById('caption').textContent = s || ''; }
function h(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function q(sel, root) { return (root || screen).querySelector(sel); }
function qa(sel, root) { return Array.prototype.slice.call((root || screen).querySelectorAll(sel)); }
function rel(el) { var s = screen.getBoundingClientRect(), r = el.getBoundingClientRect(); return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height }; }
function hex(c) { c = c.trim(); if (c[0] === '#') { var n = parseInt(c.slice(1, 7), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; } return [255, 255, 255]; }
function cssVar(n) { return getComputedStyle(screen).getPropertyValue(n); }
function mix(a, b, p) { return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * p); }).join(',') + ')'; }

/* ---------------- drawn content (fictional family: Asha) ---------------- */
var PIC = '<svg viewBox="0 0 300 130" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="300" height="130" fill="#E9D9C4"/><circle cx="230" cy="38" r="18" fill="#F3C98B"/><path d="M0 100 Q60 60 120 95 T240 85 T300 90 V130 H0Z" fill="#9DB08A"/><path d="M0 115 Q80 90 160 112 T300 108 V130 H0Z" fill="#7C9270"/></svg>';
var PIC2 = '<svg viewBox="0 0 300 130" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="300" height="130" fill="#D6E2E8"/><rect x="40" y="60" width="80" height="50" rx="6" fill="#8AA6B5"/><path d="M40 60 L80 32 L120 60Z" fill="#B5473A" opacity=".7"/><circle cx="210" cy="80" r="26" fill="#F3C98B" opacity=".8"/></svg>';
var LETTERS = [
  { id: 'a1', month: 'Month 7', date: 'Tuesday 12 March', from: 'From Mama', words: 'Asha, today you found the blue boat in the bath and would not let it go.', rest: 'You told it a long story with your hands. Papa sang the boat song twice, and you laughed harder at the second one.', photo: PIC },
  { id: 'a2', month: 'Month 7', date: 'Sunday 10 March', from: 'From Papa', words: 'We walked to the park in the rain and you kept your hand out to catch it.', rest: 'Your sleeve was wet up to the elbow and you did not mind at all.' },
  { id: 'a3', month: 'Month 7', date: 'Friday 8 March', from: 'From Mama', words: 'Nani called and you said something that sounded a lot like her name.', rest: 'She has decided it was her name.', first: 'said Nani' },

  trigger: 'Add a picture (from the system picker); Take the photo off; Undo.', moves: 'Added: the box is reserved, the picture fades in over 200 ms, the words below move to their place on standard. Taken off: fades out, the words close up on standard, the Undo toast enters.',
  rm: 'Fades only; the words move at once.', haptic: 'tap on add; warning on take off; tap on Undo', never: 'No zoom, no Ken Burns, no parallax.',
  setup: function () { mountPage(byId('a2')); }, actions: [
    { label: 'Add a picture', run: async function () { mountPage(byId('a2')); await addPic(); } },
    { label: 'Take the photo off', run: async function () { if (!q('#pic')) { mountPage(byId('a2'), { pic: true }); } await takePicOff(); } }] });
async function addPic() {
  var body = q('.pagebody'), opening = q('#opening'), rest = q('#rest');
  haptic('tap');
  var pic = h('<div class="pic" id="pic"></div>');
  await flip([opening, rest], function () { body.insertBefore(pic, opening); });
  var svg = h(PIC.replace('<svg', '<svg style="opacity:0"')); pic.appendChild(svg);
  await fade(svg, 0, 1, M.fadeMs);
}
async function takePicOff() {
  var pic = q('#pic'), opening = q('#opening'), rest = q('#rest');
  haptic('warning');
  await fade(pic, 1, 0, M.fadeMs);
  await flip([opening, rest], function () { pic.remove(); });
  toast('Photo taken off.', { label: 'Undo', run: async function () { hideToast(); haptic('tap'); var p = h('<div class="pic" id="pic"></div>'); await flip([opening, rest], function () { q('.pagebody').insertBefore(p, opening); }); var s = h(PIC); s.style.opacity = 0; p.appendChild(s); fade(s, 0, 1, M.fadeMs); } });
}

scene({ grp: 'Home slips and Read together (B-S17 to B-S20)', id: 'B-M37', title: 'One past letter on Home', screen: 'B-S17.present, .dismissed',
  trigger: 'Home on a cold launch; a tap; Not today.', moves: 'Enters with Home\'s cold-launch content (280 ms, after the prompt). Tap: the 200 ms hand-off to the page. Not today: fades out over 160 ms, what is below closes up on standard; focus to the next element.',
  rm: 'Rendered complete, no enter (NS-23); Not today: 200 ms fade, close-up at once.', haptic: 'none', never: 'The capture controls never move; no stamp, no ribbon, no count.',
  setup: function () { screen.innerHTML = homeHTML({ slip: 'past' }); bindSlip(); }, actions: [
    { label: 'Cold launch', run: async function () {
      screen.innerHTML = homeHTML({ slip: 'past' }); bindSlip();
      var parts = ['#h0', '#h1', '#h2', '#slip'].map(function (s) { return q(s); });
      parts.forEach(function (p) { p.style.opacity = 0; });
      parts.forEach(function (p, i) {
        if (RM) { if (p.id === 'slip') p.style.opacity = 1; else fade(p, 0, 1, M.fadeMs); }
        else tween(M.enter.ms, function (x) { p.style.opacity = x; p.style.transform = 'translateY(' + (M.enter.dy * (1 - x)) + 'px)'; }, { ease: EASE, delay: i * M.staggerMs });
      });
    } },
    { label: 'Not today', run: function () { var b = q('[data-act=nottoday]'); if (b) b.click(); } },
    { label: 'Tap the card', run: function () { var s = q('#slip'); if (s) s.click(); } }] });
function bindSlip() {
  var s = q('#slip'); if (!s) return;
  s.onclick = async function (e) {
    if (e.target.closest('[data-act=nottoday]')) return;
    var home = screen.innerHTML;
    var st = await cardToPage(s, byId('a1'), { noColumn: true });
    var b = q('#page [data-act=back]'); if (b) b.onclick = async function () { await pageBack(st); };
  };
  q('[data-act=nottoday]').onclick = async function (e) {
    e.stopPropagation();
    var below = followingSiblings(s);
    await fade(s, 1, 0, RM ? M.fadeMs : M.exitMs);
    await flip(below, function () { s.remove(); });
    caption('Gone until tomorrow. Focus moved to the next element. Speak and Type never moved.');
  };
}

/* ---------------- shell ---------------- */
var current = null;
function renderList() {
  var nav = document.getElementById('list'), grp = null, html = '';
  S.forEach(function (s, i) {
    if (s.grp !== grp) { grp = s.grp; html += '<div class="grp">' + grp + '</div>'; }
    html += '<button data-i="' + i + '">' + s.id + ' ' + s.title + '</button>';
  });
  nav.innerHTML = html;
  Array.prototype.forEach.call(nav.querySelectorAll('button'), function (b) { b.onclick = function () { select(+b.getAttribute('data-i')); }; });
}
function select(i) {
  gen++; toastEl = null; open = null; RT.busy = false;
  current = S[i];
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) { b.classList.toggle('on', +b.getAttribute('data-i') === i); });
  caption('');
  current.setup();
  var c = document.getElementById('controls'); c.innerHTML = '';
  current.actions.forEach(function (a) {
    var b = document.createElement('button'); b.textContent = a.label;
    b.onclick = function () { gen++; RT.busy = false; a.run(); };
    c.appendChild(b);
  });
  var r = document.createElement('button'); r.textContent = 'Reset'; r.onclick = function () { select(i); }; c.appendChild(r);
  document.getElementById('info').innerHTML = '<h2>' + current.id + ': ' + current.title + '</h2><dl>' +
    '<dt>Screen and state</dt><dd>' + current.screen + '</dd><dt>Trigger</dt><dd>' + current.trigger + '</dd><dt>What moves</dt><dd>' + current.moves + '</dd>' +
    '<dt>Reduce Motion</dt><dd>' + current.rm + '</dd><dt>Haptic</dt><dd>' + current.haptic + '</dd><dt>Never</dt><dd>' + current.never + '</dd></dl>';
}
document.getElementById('rm').onchange = function (e) { RM = e.target.checked; if (current) select(S.indexOf(current)); };
document.getElementById('slow').onchange = function (e) { SLOW = e.target.checked ? 4 : 1; };
document.getElementById('dark').onchange = function (e) { document.getElementById('phone').classList.toggle('dark', e.target.checked); screen.classList.toggle('dark', e.target.checked); document.body.classList.toggle('darkPage', e.target.checked); };
renderList(); select(0);
</script>
