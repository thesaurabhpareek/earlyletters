<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Area B: Book and reading. Clickable prototype (DRAFT, 20 Nov 2026)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Self-contained: no network, no framework, no external font. Token values copied from
  packages/design-tokens/src/tokens.ts (light, dark, highContrast, space, radius, type, motion.fadeMs).
  Fonts: Literata and Mukta are bundled in the app but not here; the page falls back to Georgia (serif)
  and the system sans. Pictures are drawn shapes, never photos of people. Family: Asha (fictional).
  Every visible word is placeholder intent; the words of record are in WORDS.md and need founder approval.
  Materials follow docs/design/system/BRIEF.md section 3: glass only on controls and navigation,
  content on paper, at most three glass surfaces, solid fallback under Reduce Transparency.
-->
<style>
:root{
  --bg:#FBF8F3;--surface:#F5EFE7;--surfaceRaised:#FFFFFF;--text:#2B2722;--textMuted:#6B645B;--accent:#8A5A3B;
  --accentSoft:#F1E6DC;--onAccent:#FFFFFF;--line:#E6DED3;--focus:#2F6F8F;--success:#3F7A55;--caution:#94661A;
  --controlBorder:#8A8175;--destructive:#B5473A;--scrim:rgba(43,39,34,0.32);
  --glass:rgba(255,255,255,0.56);--glassEdge:rgba(255,255,255,0.75);--glassShadow:0 6px 18px rgba(43,39,34,0.14);
  --gold:#FFE2A8;--amber:#F3C98B;--dusk:#B881AF;
  --s:1;--sd:1;
  --serif:Georgia,"Times New Roman",serif;--sans:-apple-system,"Segoe UI",system-ui,Helvetica,Arial,sans-serif;
}
.dark{
  --bg:#161412;--surface:#1B1917;--surfaceRaised:#201D1A;--text:#F2ECE4;--textMuted:#B3AA9E;--accent:#D9A47E;
  --accentSoft:#3A2E25;--onAccent:#1E1612;--line:#33302C;--focus:#8CC4DE;--success:#8CC9A0;--caution:#E3B866;
  --controlBorder:#857C70;--destructive:#F08C7C;--scrim:rgba(0,0,0,0.55);
  --glass:rgba(44,40,36,0.58);--glassEdge:rgba(255,255,255,0.14);--glassShadow:0 6px 18px rgba(0,0,0,0.4);
  --gold:rgba(255,226,168,0.16);--amber:rgba(243,201,139,0.18);--dusk:#8076E2;
}
.ic{--textMuted:#524B43;--accent:#6E4529;--line:#6B645B;--controlBorder:#2B2722;}
.dark.ic{--textMuted:#D6CEC3;--accent:#E8BC9A;--line:#B3AA9E;--controlBorder:#F2ECE4;}
.ax5{--s:2.2;--sd:1.6;}

*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:#d9d4cc;color:#222;display:flex;gap:18px;padding:16px;min-height:100vh}
body.pageDark{background:#0d0c0b;color:#ddd}
#side{width:300px;flex:none;font-size:13px;line-height:1.4}
#side h1{font-size:16px;margin:0 0 6px}
#side h2{font-size:13px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
#side button,#side select{font:inherit;margin:2px 0}
.jl button{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:3px 6px;cursor:pointer;color:inherit}
.jl button.on{border-color:#8A5A3B;background:rgba(138,90,59,.12)}
.toggles label{display:block;margin:2px 0;cursor:pointer}
#mid{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px}
#stage{flex:1;min-width:280px;font-size:13px;line-height:1.45}
#stage h3{margin:0 0 4px;font-size:15px}
#stage code{background:rgba(0,0,0,.07);padding:0 3px;border-radius:3px}
.steps{display:flex;gap:6px;align-items:center}
.steps button{font:inherit;padding:4px 10px}

/* the phone */
#phone{width:375px;height:812px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);color:var(--text);
  box-shadow:0 0 0 10px #1c1b1a,0 20px 50px rgba(0,0,0,.35);font-family:var(--sans)}
#fold{position:absolute;left:0;right:0;top:667px;border-top:1px dashed rgba(200,60,60,.7);z-index:90;pointer-events:none}
#fold span{position:absolute;right:6px;top:-15px;font:10px var(--sans);color:rgba(200,60,60,.9);background:rgba(255,255,255,.7);padding:0 3px}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600;position:relative;z-index:5}
.scroll{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden}
.scroll.withTabs{bottom:0;padding-bottom:96px}
.pad{padding:0 20px}
.lamp{position:absolute;left:-60px;right:-60px;top:-120px;height:460px;pointer-events:none;
  background:radial-gradient(ellipse at 35% 30%,var(--gold) 0%,var(--amber) 28%,transparent 70%);opacity:.75}
.rt .lamp,.ic .lamp{display:none}

/* type, scaled: UI scales by --s, display by --sd (cap), letters by --s */
.display{font-family:var(--serif);font-size:calc(34px*var(--sd));line-height:1.2;font-weight:500;margin:0}
.title2{font-family:var(--serif);font-size:calc(22px*var(--sd));line-height:1.27;font-weight:500;margin:0}
.callout{font-size:calc(17px*var(--s));line-height:1.3}
.body{font-size:calc(18px*var(--s));line-height:1.33}
.foot{font-size:calc(14px*var(--s));line-height:1.36;color:var(--textMuted)}
.cap{font-size:calc(13px*var(--s));line-height:1.3;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--textMuted)}
.dateline{font-size:calc(14px*min(var(--s),2.2));line-height:1.3;font-weight:600;letter-spacing:.04em;color:var(--textMuted)}
.letter{font-family:var(--serif);font-size:calc(20px*var(--s));line-height:1.6}
.letterSm{font-family:var(--serif);font-size:calc(17px*var(--s));line-height:1.45}
.sig{font-family:var(--serif);font-style:italic;font-size:calc(20px*var(--s));text-align:right}
.label{font-size:calc(18px*var(--s));font-weight:500}
.labelSm{font-size:calc(16px*var(--s));font-weight:500}
.muted{color:var(--textMuted)}

/* controls */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:calc(max(44px,44px*var(--s)*0.75));border-radius:999px;padding:6px 18px;
  font:500 calc(18px*var(--s))/1.2 var(--sans);cursor:pointer;border:1px solid var(--controlBorder);background:transparent;color:var(--text);width:100%;text-align:center}
.btn svg,.glassNo svg,.card svg{width:20px;height:20px;flex:none}
.ax5 .btn svg{width:30px;height:30px}
.btn.primary{background:var(--accent);color:var(--onAccent);border-color:var(--accent);min-height:56px}
.btn.quiet{border-color:transparent;color:var(--accent);width:auto;padding:6px 10px}
.btn.destr{color:var(--destructive);border-color:var(--controlBorder)}
.btn.sm{font-size:calc(16px*var(--s));width:auto}
.ibtn{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:transparent;color:var(--text)}
.ibtn svg{width:22px;height:22px}
.ax5 .ibtn{width:64px;height:64px}.ax5 .ibtn svg{width:32px;height:32px}

/* glass: control layer only. Regular; clear with 35% dim over pictures; solid under Reduce Transparency */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);
  border:1px solid var(--glassEdge);box-shadow:var(--glassShadow),inset 0 1px 0 var(--glassEdge)}
.glass.clear{background:rgba(0,0,0,0.35);color:#fff;border-color:rgba(255,255,255,.3)}
.rt .glass{background:var(--surfaceRaised);-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid var(--controlBorder);box-shadow:none}
.rt .glass.clear{background:var(--surfaceRaised);color:var(--text)}
.gcluster{display:inline-flex;align-items:center;border-radius:999px;padding:2px}


/* cards and lists: content layer */
.card{background:var(--surfaceRaised);border-radius:14px;padding:16px;margin:10px 0;cursor:pointer;box-shadow:0 2px 6px rgba(43,39,34,.06)}
.dark .card,.ic .card{border:1px solid var(--line);box-shadow:none}
.card.sealed{background:var(--surface);box-shadow:none;border:1px solid var(--controlBorder)}
.card.rule{border-left:3px solid var(--accent)}
.opener{display:flex;align-items:baseline;gap:12px;margin:26px 0 6px}
.num{font-family:var(--serif);font-size:calc(46px*min(var(--s),1.4));font-weight:500;line-height:1}
.fade{-webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent);mask-image:linear-gradient(to bottom,#000 60%,transparent)}
.clamp2{max-height:2.9em;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent);mask-image:linear-gradient(to bottom,#000 55%,transparent)}
.ax5 .clamp2{max-height:5.8em}
/* excerpts end in a fade, never an ellipsis glyph (DESIGN_LANGUAGE 9) */
.list{background:var(--surfaceRaised);border-radius:14px;overflow:hidden;margin:8px 0}
.dark .list,.ic .list{border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:none}
.row .t{flex:1}
.row .v{color:var(--textMuted);font-size:calc(16px*var(--s))}
.ax5 .row{flex-wrap:wrap}.ax5 .row .v{flex-basis:100%;padding-left:0}
.row svg{width:22px;height:22px;flex:none}
.h2{font-size:calc(13px*var(--s));font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--textMuted);margin:22px 4px 4px}
.chips{display:flex;gap:6px;margin:14px 0 4px}
.ax5 .chips{flex-direction:column}
.chip{flex:1;min-height:44px;border-radius:999px;border:1px solid var(--controlBorder);display:flex;align-items:center;justify-content:center;gap:6px;
  font:500 calc(16px*var(--s)) var(--sans);cursor:pointer;background:transparent;color:var(--text)}
.chip.sel{background:var(--accentSoft);border:1.5px solid var(--accent);color:var(--accent)}
.toggle{width:51px;height:31px;border-radius:999px;background:var(--line);position:relative;flex:none;border:1px solid var(--controlBorder)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on{background:var(--accent)}.toggle.on::after{left:22px}
.field{border:1px solid var(--controlBorder);border-radius:8px;min-height:48px;padding:10px 12px;font:calc(18px*var(--s)) var(--sans);background:var(--surfaceRaised);color:var(--text)}
.u{text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* tab bar (system native tabs, glass) */
.tabs{position:absolute;left:12px;right:12px;bottom:22px;height:62px;border-radius:999px;display:flex;justify-content:space-around;align-items:center;z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;color:var(--textMuted);cursor:pointer;min-width:64px}
.tab.on{color:var(--accent);font-weight:600}
.tab svg{width:24px;height:24px}
.ax5 .tab span{display:none}

/* sheets, toast, overlays */
.scrimL{position:absolute;inset:0;background:var(--scrim);z-index:60}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;border-radius:34px;z-index:61;padding:10px 18px 24px;max-height:86%;overflow-y:auto}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--controlBorder);opacity:.5;margin:2px auto 10px}
.sheet h4{margin:4px 0 12px;font-size:calc(18px*var(--s));font-weight:600}
.sheet .btn{margin-top:10px}
.sheet .btn.solid{background:var(--surfaceRaised)}
.toast{position:absolute;left:16px;right:16px;bottom:100px;border-radius:22px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:10px;z-index:55;font-size:calc(16px*var(--s))}
.ax5 .toast{flex-direction:column;align-items:stretch}
.topbar{position:absolute;top:48px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:30}
.topbar .gcluster{gap:0}
.inline{position:absolute;top:0;left:0;right:0;z-index:30;padding:44px 16px 8px;border-radius:0 0 22px 22px;display:flex;align-items:center;gap:6px}
.picture{border-radius:14px;overflow:hidden;border:1px solid transparent;position:relative}
.dark .picture,.ic .picture{border-color:var(--line)}
.blank{background:var(--surface)!important}
.note{border:1px dashed var(--controlBorder);border-radius:8px;padding:6px 8px;margin:6px 0;font-size:12px;color:var(--textMuted)}
.rtl{direction:rtl;text-align:right;unicode-bidi:isolate}
.thumb{width:72px;height:72px;border-radius:8px;flex:none;overflow:hidden}
.ax5 .thumb{width:100%;height:160px}
.cardrow{display:flex;gap:12px}.ax5 .cardrow{flex-direction:column}
.center{text-align:center}
</style>
</head>
<body>
<div id="side">
  <h1>Area B: Book and reading</h1>
  <div class="muted">DRAFT prototype, 20 Nov 2026. Ids key to DESIGN.md, MOTION.md, WORDS.md. Words are placeholder intent.</div>
  <h2>Show</h2>
  <div class="toggles">
    <label><input type="checkbox" id="tDark"> Dark</label>
    <label><input type="checkbox" id="tAx5"> AX5 text (Bold), SE 3 width</label>
    <label><input type="checkbox" id="tRt"> Reduce Transparency (solid glass)</label>
    <label><input type="checkbox" id="tIc"> Increase Contrast</label>
    <label><input type="checkbox" id="tFold" checked> SE 3 fold line (667 pt)</label>
  </div>
  <h2>Screen and state</h2>
  <select id="selScreen" style="width:100%"></select>
  <select id="selState" style="width:100%"></select>
  <h2>Journeys</h2>
  <div class="jl" id="journeys"></div>
</div>
<div id="mid">
  <div id="phone" class=""><div id="fold"><span>SE 3 fold</span></div><div id="screen"></div></div>
  <div class="steps"><button id="prev">Back a step</button><span id="stepLbl"></span><button id="next">Next step</button></div>
</div>
<div id="stage"><h3 id="sTitle"></h3><div id="sNote"></div></div>

<script>
/* ---------- icons (simple strokes, decorative) ---------- */
var I={
 find:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>',
 dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 11l8-7 8 7v9H4z"/></svg>',
 book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 5h7a2 2 0 012 2v13a2 2 0 00-2-2H3zM21 5h-7a2 2 0 00-2 2v13a2 2 0 012-2h7z"/></svg>',
 me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
 pic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>',
 env:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
 who:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="9" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3 19c1-3 3-4 6-4s5 1 6 4"/></svg>',
 ver:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 12a8 8 0 108-8M4 4v5h5"/></svg>',
 mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
 share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v12M7 8l5-5 5 5M5 13v7h14v-7"/></svg>',
 moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 14A8 8 0 019 3a8 8 0 1011 11z"/></svg>',
 eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 3l18 18M10 6a10 10 0 0111 6 10 10 0 01-3 4M6 8a10 10 0 00-3 4 10 10 0 0013 5"/></svg>',
 play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
 open:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6h7a2 2 0 012 2v12M21 6h-7a2 2 0 00-2 2"/></svg>',
 chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;opacity:.5"><path d="M9 5l7 7-7 7"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:16px;height:16px"><path d="M5 12l5 5 9-10"/></svg>'
};
/* drawn picture, never a person: hills and a sun, or a boat */
function pic(kind,h){
  var sky='#E9D9C6',hill='#B89878',hill2='#9C7B5E',sun='#F3C98B';
  if(kind==='boat'){return '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" style="width:100%;height:'+h+'px;display:block;background:#CFE0E6"><rect y="190" width="400" height="110" fill="#8FB3C0"/><path d="M120 190h160l-30 40H150z" fill="#4E6E8E"/><path d="M200 70v118M200 80l60 90h-60z" fill="#F5EFE7" stroke="#6B645B"/></svg>'}
  return '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" style="width:100%;height:'+h+'px;display:block;background:'+sky+'"><circle cx="300" cy="90" r="40" fill="'+sun+'"/><path d="M0 220Q100 140 200 210T400 190V300H0z" fill="'+hill+'"/><path d="M0 260Q120 200 260 250T400 240V300H0z" fill="'+hill2+'"/></svg>'
}

/* ---------- fixture: the fictional Asha book ---------- */
var L={
 boat:{date:'TUESDAY 3 MARCH',month:'Month 4',words:'Today you found the blue boat in the bath and would not let it go. You held it up to show me every few minutes, as if it might have changed.',sig:'From Mama',pic:'boat'},
 laugh:{date:'SUNDAY 15 FEBRUARY',month:'Month 3',words:'You laughed out loud for the first time while Papa was sneezing. Then you waited for him to do it again.',sig:'From Mama',first:'laughed out loud'},
 rain:{date:'FRIDAY 6 FEBRUARY',month:'Month 3',words:'It rained all afternoon and we watched it from the window. You fell asleep before it stopped.',sig:'From Papa',pic:'hills'},
 typed:{date:'MONDAY 2 FEBRUARY',month:'Month 3',words:'A short one tonight. You slept through, and so did we, almost.',sig:'From Mama'},
 hidden:{date:'SATURDAY 14 MARCH',month:'Month 4',words:'This is for the day you start school.',sig:'From Mama',seal:'10 January 2030'}
};

/* ---------- shared pieces ---------- */
function status(){return '<div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>'}
function tabs(on){
  return '<div class="tabs glass">'+
   tab('home','Home',on==='home','A-S01')+tab('book','Book',on==='book','B-S01:default')+tab('me','Me',on==='me','B-S21:on')+'</div>';
}
function tab(ic,l,on,go){return '<div class="tab'+(on?' on':'')+'" data-go="'+go+'" role="tab" aria-label="'+l+'">'+I[ic]+'<span>'+l+'</span></div>'}
function opener(n,label,range){return '<div class="opener" role="heading"><span class="num">'+n+'</span><span><div class="labelSm">'+label+'</div><div class="foot">'+range+'</div></span></div>'}
function letterCard(k,opt){
  opt=opt||{};var e=L[k];var go=opt.go||('B-S08:'+(k==='typed'?'ownTyped':k==='boat'?'withPicture':k==='laugh'?'firstMarked':'ownSpoken'));
  var thumb=(e.pic&&!opt.noPic)?(opt.thumbMissing?'':'<div class="thumb'+(opt.bg?' blank':'')+'">'+(opt.bg?'':pic(e.pic,72*(document.body.dataset.ax5==='1'?2.2:1)))+'</div>'):'';
  var firstLine=(opt.firstLabel&&e.first)?'<div class="label" style="margin-bottom:4px">'+e.first+'</div>':'';
  return '<div class="card" data-go="'+go+'" role="button"><div class="cardrow">'+(opt.showThumb?thumb:'')+'<div style="flex:1">'+firstLine+
   '<div class="dateline">'+e.date+'</div><div class="letterSm clamp2 fade" style="margin-top:6px">'+e.words+'</div><div class="foot" style="margin-top:6px">'+e.sig+'</div></div></div></div>';
}
function sealedCard(){
  var e=L.hidden;
  return '<div class="card sealed" data-go="B-S08:sealedAuthor" role="button" aria-label="Saturday 14 March. Hidden until 10 January 2030. Opens the letter."><div style="display:flex;gap:12px;align-items:flex-start"><span class="muted" aria-hidden="true">'+I.env+'</span><div><div class="dateline">'+e.date+'</div><div class="body" style="margin-top:4px">Hidden until '+e.seal+'</div></div></div></div>';
