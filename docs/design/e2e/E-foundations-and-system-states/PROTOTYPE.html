<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area E prototype: foundations and system states</title>
<!--
  Never glass inside glass: Close inside a sheet is a plain surface button.
  Area E, design lead, 20 Nov 2026. Self-contained: no network, no framework, no external font.
  Token values copied from packages/design-tokens/src/tokens.ts (light, dark, highContrast, space, radius, type, motion).
  Material policy from docs/design/system/BRIEF.md section 3: glass (regular) only on the tab bar, sheets,
  the Keep gate sheet, the capture cluster, the toast, navigation buttons; content layer (letters, lists,
  state screens, error screens) is never glass. Reduce Transparency: solid token surface plus hairline.
  Fictional family only (Asha). Pictures are drawn shapes. Words are existing keys or PROPOSED.
-->
<style>
:root{
  --bg:#FBF8F3;--surface:#F5EFE7;--raised:#FFFFFF;--text:#2B2722;--muted:#6B645B;--accent:#8A5A3B;
  --accentSoft:#F1E6DC;--onAccent:#FFFFFF;--line:#E6DED3;--focus:#2F6F8F;--recording:#B5473A;
  --success:#3F7A55;--caution:#94661A;--controlBorder:#8A8175;--scrim:rgba(43,39,34,.32);
  --glass:rgba(255,255,255,.55);--glassEdge:rgba(255,255,255,.7);--glassSolid:#FFFFFF;
  --s:1;--sT2:1;--sT1:1;--sD:1;
}
.dark{
  --bg:#161412;--surface:#1B1917;--raised:#201D1A;--text:#F2ECE4;--muted:#B3AA9E;--accent:#D9A47E;
  --accentSoft:#3A2E25;--onAccent:#1E1612;--line:#33302C;--focus:#8CC4DE;--recording:#F08C7C;
  --success:#8CC9A0;--caution:#E3B866;--controlBorder:#857C70;--scrim:rgba(0,0,0,.55);
  --glass:rgba(40,36,32,.55);--glassEdge:rgba(255,255,255,.12);--glassSolid:#201D1A;
}
.hc{--muted:#524B43;--accent:#6E4529;--line:#6B645B;--controlBorder:#2B2722}
.dark.hc{--muted:#D6CEC3;--accent:#E8BC9A;--line:#B3AA9E;--controlBorder:#F2ECE4}
.ax5{--s:3.1;--sT2:2.0;--sT1:1.8;--sD:1.6}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",sans-serif;background:#d9d4cc;color:#222;display:flex;gap:16px;padding:16px;min-height:100vh}
#side{width:330px;flex:none;font-size:13px;background:#f4f1ec;border-radius:12px;padding:12px;overflow:auto;max-height:calc(100vh - 32px)}
#side h1{font-size:15px;margin:0 0 8px}
#side h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#6b645b;margin:14px 0 6px}
#side button.j,#side button.s{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 6px;border-radius:6px;cursor:pointer;font:inherit;color:#2b2722}
#side button.j:hover,#side button.s:hover{background:#e9e3da}
#side button.on{background:#2b2722;color:#fff}
#main{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;background:#f4f1ec;padding:8px 10px;border-radius:10px;max-width:760px}
#controls label{display:flex;gap:4px;align-items:center}
#controls select,#controls button{font:inherit;padding:4px 8px}
#info{font-size:12px;color:#3d3832;max-width:760px;background:#f4f1ec;padding:8px 10px;border-radius:10px;white-space:pre-wrap}
#phone{width:375px;height:812px;border-radius:48px;border:10px solid #111;position:relative;overflow:hidden;background:var(--bg);color:var(--text);flex:none}
#phone.se{height:667px;border-radius:24px}
.status{height:47px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font-size:14px;font-weight:600}
.se .status{height:20px;font-size:11px;padding-bottom:2px}
.screen{position:absolute;top:47px;bottom:0;left:0;right:0;display:flex;flex-direction:column}
.se .screen{top:20px}
.scroll{flex:1;overflow:auto;padding:0 20px}
.footer{padding:12px 20px 34px;display:flex;flex-direction:column;gap:8px}
.se .footer{padding-bottom:12px}
.lamp{position:absolute;left:-40px;right:-40px;top:-120px;height:420px;background:radial-gradient(ellipse at 50% 30%,rgba(255,226,168,.75),rgba(243,201,139,.25) 45%,transparent 70%);pointer-events:none;z-index:0}
.dark .lamp{background:radial-gradient(ellipse at 50% 30%,rgba(243,201,139,.20),rgba(240,140,124,.10) 45%,transparent 70%)}
.lamp.center{top:120px}
.rm .breathe{animation:none!important}
.breathe{animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
.fade{animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rel{position:relative;z-index:1}
.body{font-size:calc(18px*var(--s));line-height:1.33}
.sub{font-size:calc(16px*var(--s));line-height:1.31}
.foot{font-size:calc(14px*var(--s));line-height:1.36;color:var(--muted)}
.cap{font-size:calc(13px*var(--s));font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}
.serif{font-family:Georgia,"Times New Roman",serif}
.t2{font-family:Georgia,serif;font-weight:500;font-size:calc(22px*var(--sT2));line-height:1.27;margin:0}
.t1{font-family:Georgia,serif;font-weight:500;font-size:calc(28px*var(--sT1));line-height:1.21;margin:0}
.disp{font-family:Georgia,serif;font-weight:500;font-size:calc(34px*var(--sD));line-height:1.2;margin:0}
.letter{font-family:Georgia,serif;font-size:calc(20px*var(--s));line-height:1.6}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:999px;border:0;font:inherit;font-weight:500;font-size:calc(18px*var(--s));cursor:pointer;padding:8px 18px;text-align:center}
.primary{background:var(--accent);color:var(--onAccent)}
.quiet{background:transparent;color:var(--accent);min-height:44px}
.outline{background:transparent;color:var(--text);border:1px solid var(--controlBorder)}
.apple{background:#000;color:#fff}
.dark .apple{background:#fff;color:#000}
.link{color:var(--accent);text-decoration:underline;cursor:pointer;background:none;border:0;font:inherit;min-height:44px;padding:0}
.state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:80px}
.ax5 .state{padding-top:16px}
.ax5 .art{display:none}
.art{width:120px;height:90px}
.glyph{width:72px;height:72px;border-radius:50%;background:var(--accentSoft);display:flex;align-items:center;justify-content:center}
.ax5 .glyph{display:none}
.field{width:100%;min-height:52px;border:1px solid var(--controlBorder);border-radius:8px;background:var(--raised);padding:10px 12px;font:inherit;font-size:calc(18px*var(--s));color:var(--text)}
.field.err{border-color:var(--caution);border-width:1.5px}
.errline{display:flex;gap:8px;align-items:flex-start;text-align:left;font-size:calc(16px*var(--s))}
.icon{flex:none;width:20px;height:20px}
.sysline{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;flex-wrap:wrap}
.hc .sysline{border:1px solid var(--line)}
.sysline .t{flex:1;min-width:160px}
.ax5 .sysline .act{flex-basis:100%}
.list{background:var(--raised);border-radius:14px;overflow:hidden;margin:8px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;min-height:44px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.row:last-child{border-bottom:0}
.ax5 .row{flex-direction:column;align-items:flex-start}
.sechead{font-size:calc(13px*var(--s));color:var(--muted);margin:18px 4px 4px;font-weight:500}
/* Glass layer */
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--glassEdge);box-shadow:0 6px 16px rgba(43,39,34,.10)}
.rt .glass{background:var(--glassSolid);backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid var(--line);box-shadow:none}
.hc .glass{border-color:var(--controlBorder)}
.tabbar{position:absolute;left:16px;right:16px;bottom:24px;height:62px;border-radius:31px;display:flex;justify-content:space-around;align-items:center;z-index:5}
.se .tabbar{bottom:8px}
.tab{font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);min-width:64px;min-height:44px;justify-content:center;background:none;border:0;cursor:pointer}
.tab.on{color:var(--accent);font-weight:600}
.ax5 .tab span{display:none}
.scrimlayer{position:absolute;inset:0;background:var(--scrim);z-index:6}
.sheet{position:absolute;left:0;right:0;bottom:0;top:56px;border-radius:34px 34px 0 0;z-index:7;display:flex;flex-direction:column}
.sheet.half{top:auto;left:8px;right:8px;bottom:8px;border-radius:34px}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--controlBorder);margin:8px auto 4px;opacity:.6}
.sheet.full{background:var(--bg)}
.sheet.full.glass{background:color-mix(in srgb,var(--bg) 92%,transparent)}
.close{position:absolute;top:10px;right:12px;min-width:44px;min-height:44px;border-radius:22px;border:0;font:inherit;cursor:pointer;color:var(--text);padding:0 12px;z-index:8}
.toast{position:absolute;left:16px;right:16px;bottom:100px;border-radius:22px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:9;flex-wrap:wrap}
.card{background:var(--raised);border-radius:14px;padding:14px 16px;text-align:left;border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;background:var(--accentSoft);font-size:calc(13px*var(--s));font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.pills{display:flex;gap:10px}
.ax5 .pills{flex-direction:column}
.pill{flex:1;min-height:56px;border-radius:999px;border:1px solid var(--controlBorder);background:transparent;color:var(--text);font:inherit;font-size:calc(18px*var(--s));cursor:pointer}
.pill.sel{background:var(--accentSoft);border:1.5px solid var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:calc(16px*var(--s));min-height:44px}
.box{width:24px;height:24px;border:1.5px solid var(--controlBorder);border-radius:6px;flex:none;margin-top:2px}
.alert{position:absolute;left:52px;right:52px;top:40%;border-radius:14px;z-index:10;text-align:center;overflow:hidden}
.alert .a-body{padding:16px;font-size:14px}
.alert .a-btns{display:flex;border-top:1px solid var(--line)}
.alert .a-btns button{flex:1;min-height:44px;border:0;background:none;color:#0a64d6;font:inherit;font-size:16px;cursor:pointer}
.dark .alert .a-btns button{color:#4ea1ff}
.ax5 .alert{left:12px;right:12px;top:15%}
.ax5 .alert .a-btns{flex-direction:column}
.note{font-size:11px;color:#3d3832}
#phone .note{color:var(--muted)}
.close{background:var(--surface)}
.prompt{font-family:Georgia,serif;font-size:calc(24px*var(--s));line-height:1.33}
.cluster{border-radius:32px;padding:10px;display:flex;gap:10px}
.ax5 .cluster{flex-direction:column}
.cluster .btn{min-height:64px}
.storeimg{height:180px;border-radius:14px;background:linear-gradient(160deg,#F3C98B,#8A5A3B);margin:8px 0}
.icon-tile{width:96px;height:96px;border-radius:22px;background:linear-gradient(#9A613C,#7F4F30);display:flex;align-items:center;justify-content:center;color:#FBF8F3;font-family:Georgia,serif;font-size:44px;flex:none}
.dark .icon-tile{background:linear-gradient(#2C2926,#1F1B18);color:#D9A47E}
.alias{border:1px dashed var(--controlBorder);border-radius:14px;padding:14px;margin-top:40px}
.vo{outline:2px solid var(--focus);outline-offset:2px}
.vonum{position:absolute;background:var(--focus);color:#fff;border-radius:9px;font-size:10px;min-width:18px;height:18px;text-align:center;line-height:18px;z-index:20;pointer-events:none}
</style>
</head>
<body>
<nav id="side" aria-label="Journeys and screens">
  <h1>Area E: foundations and system states</h1>
  <div class="note">Pick a journey, then use Next and Back, or tap buttons inside the phone. Every screen has a state switcher. Ids match DESIGN.md.</div>
  <h2>Journeys</h2>
  <div id="jlist"></div>
  <h2>Screens</h2>
  <div id="slist"></div>
</nav>
<div id="main">
  <div id="controls" role="group" aria-label="Prototype controls">
    <button id="back" type="button">Back</button>
    <button id="next" type="button">Next</button>
    <label>State <select id="stateSel" aria-label="State"></select></label>
    <label><input type="checkbox" id="tDark"> Dark</label>
    <label><input type="checkbox" id="tAx5"> AX5 text</label>
    <label><input type="checkbox" id="tSe"> SE 3 (375 x 667)</label>
    <label><input type="checkbox" id="tRt"> Reduce Transparency</label>
    <label><input type="checkbox" id="tHc"> Increase Contrast</label>
    <label><input type="checkbox" id="tRm"> Reduce Motion</label>
    <label><input type="checkbox" id="tVo"> VoiceOver order</label>
  </div>
  <div id="phone" role="region" aria-label="iPhone frame"><div class="status"><span>9:41</span><span>5G 80%</span></div><div class="screen" id="screen"></div></div>
  <div id="info" aria-live="polite"></div>
</div>
<script>
"use strict";
/* ---------- tiny helpers ---------- */
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const go=(target,label,cls)=>`<button type="button" class="btn ${cls||"primary"}" data-go="${target}" data-vo="1">${esc(label)}</button>`;
const lnk=(target,label)=>`<button type="button" class="link" data-go="${target}" data-vo="1">${esc(label)}</button>`;
const ICON={
 warn:'<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 5.5v5.5" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="14" r="1" fill="currentColor"/></svg>',
 info:'<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 9v5" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="6" r="1" fill="currentColor"/></svg>',
 cloud:'<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 15h9a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.6 1.2A3 3 0 0 0 5 15z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 3l14 14" stroke="currentColor" stroke-width="1.5"/></svg>',
 pause:'<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 6.5v7M12 6.5v7" stroke="currentColor" stroke-width="1.6"/></svg>',
 up:'<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 14V6M6.5 9.5 10 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
 disk:'<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="5" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="14" cy="10" r="1" fill="currentColor"/></svg>',
 mic:'<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="15" y="6" width="10" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 20a10 10 0 0 0 20 0M20 30v5M6 6l28 28" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>'
};
const ART={
 page:'<svg class="art" viewBox="0 0 120 90" aria-hidden="true"><rect x="30" y="8" width="60" height="76" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M40 28h40M40 40h40M40 52h28" stroke="currentColor" stroke-width="1.5"/></svg>',
 envelope:'<svg class="art" viewBox="0 0 120 90" aria-hidden="true"><rect x="18" y="20" width="84" height="54" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M18 22l42 30 42-30" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
 moon:'<svg class="art breathe" viewBox="0 0 120 90" aria-hidden="true"><path d="M70 14a32 32 0 1 0 22 52A26 26 0 0 1 70 14z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
 window:'<svg class="art" viewBox="0 0 120 90" aria-hidden="true"><rect x="28" y="10" width="64" height="70" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M60 10v70M28 45h64" stroke="currentColor" stroke-width="1.5"/></svg>',
 mark:'<svg width="64" height="40" viewBox="0 0 64 40" aria-label="Early Letters mark" role="img"><path d="M8 30c0-12 6-20 14-22M34 30c0-12 6-20 14-22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>'
};
function stateScreen(o){
  const pic=o.glyph?`<div class="glyph muted">${o.glyph}</div>`:(o.art||"");
  return `<div class="scroll"><div class="state fade rel">${pic}<h2 class="t2" data-vo="1" role="heading">${esc(o.title)}</h2>${o.body?`<p class="body muted" data-vo="1" style="margin:0">${esc(o.body)}</p>`:""}${o.note?`<p class="sub muted" data-vo="1" style="margin:0">${esc(o.note)}</p>`:""}${o.extra||""}</div></div><div class="footer">${o.actions||""}</div>`;
}
function sysline(kind,text,act){
  const ic={info:ICON.info,offline:ICON.cloud,paused:ICON.pause,action:ICON.up,waiting:ICON.info,disk:ICON.disk}[kind]||ICON.info;
  return `<div class="sysline muted" role="status" data-vo="1">${ic}<span class="t sub" style="color:var(--text)">${esc(text)}</span>${act?`<span class="act">${act}</span>`:""}</div>`;
}
function errline(text){return `<div class="errline" role="alert" data-vo="1" style="color:var(--text)">${ICON.warn}<span>${esc(text)}</span></div>`;}
function tabbar(on){
  const t=(id,l,dest)=>`<button type="button" class="tab ${on===id?"on":""}" data-go="${dest}" data-vo="1" aria-label="${l}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>${l}</span></button>`;
  return `<div class="tabbar glass" role="tablist">${t("home","Home","A-S01:default")}${t("book","Book","B-BOOK:default")}${t("me","Me","ME:default")}</div>`;
}
function homeScreen(opts){
  opts=opts||{};
  return `<div class="lamp breathe"></div><div class="scroll rel" style="padding-bottom:110px">
  <p class="cap" style="margin:12px 0 0" data-vo="1">Thursday evening. Asha, 4 months</p>
  <h1 class="t1" style="margin:4px 0 14px" data-vo="1">Home</h1>
  ${opts.slip||""}
  <p class="prompt" data-vo="1">What did Asha do today that you want to remember?</p>
  ${opts.plusLine?`<p class="foot" data-vo="1">Adding new letters to the book needs Plus. Recording, reading and export are always free.</p>`:""}
  <div class="cluster glass">${go(opts.speak||"A-S04:default","Speak")}${go("A-S06:default","Type","outline")}</div>
  <p style="text-align:center">${lnk("A-S01:default","Not much today")}</p>
  </div>${tabbar("home")}`;
}
function heldCard(){
  return `<div class="card" data-vo="1" aria-label="Waiting. Today Asha laughed at the rain on the window. From Mama"><span class="chip"><span class="dot"></span>Waiting</span><p class="letter" style="margin:8px 0 4px">Today Asha laughed at the rain on the window, a whole minute of it.</p><p class="serif muted" style="font-style:italic;margin:0">From Mama</p></div>`;
}
function areaStub(id,title,what){
  return `<div class="scroll"><div class="alias"><p class="cap">${esc(id)} is drawn by its own area. Shown here only so the journey reads end to end.</p><h2 class="t2" data-vo="1">${esc(title)}</h2><p class="sub muted">${esc(what)}</p></div></div><div class="footer">${STUBNEXT[id]||""}</div>`;
}
const STUBNEXT={};
/* ---------- screens ---------- */
/* each: {name, states:{stateName: () => html}} ; state "x" functions may read ctx */
const S={};
S["E-S27"]={name:"App Store page and install (system)",states:{
 default:()=>`<div class="scroll"><div style="display:flex;gap:14px;margin-top:12px"><div class="icon-tile" role="img" aria-label="App icon">EL</div><div><h2 class="t2" data-vo="1">Early Letters</h2><p class="foot" style="margin:4px 0">Baby book you fill by talking</p><button class="btn primary" style="min-height:36px;width:auto;padding:4px 22px" data-go="E-S27:installing" data-vo="1">Get</button></div></div>
 <div class="storeimg" role="img" aria-label="Screenshot placeholder, a drawn shape"></div>
 <p class="foot">Apple's App Store page. Every public line here is a claims row (CCO); no "fast", "accessible to everyone" or "smart reminders" (NS-33, NS-34, NS-32 claims). Privacy label as shipped.</p></div>`,
 installing:()=>`<div class="scroll"><div style="display:flex;gap:14px;margin-top:12px"><div class="icon-tile" role="img" aria-label="App icon">EL</div><div><h2 class="t2">Early Letters</h2><p class="foot">Installing</p><button class="btn outline" style="min-height:36px;width:auto" data-go="E-S27:installed" data-vo="1">Open</button></div></div><p class="foot">Download under 40 MB (NS-34). No account is needed to download.</p></div>`,

const J=[

];
/* ---------- engine ---------- */
let cur={screen:"E-S27",state:"default"},jIdx=-1,sIdx=0;
const $=id=>document.getElementById(id);
function parse(t){const [a,b]=t.split(":");return {screen:a,state:b||Object.keys(S[a].states)[0]};}
function render(){
  const scr=S[cur.screen];if(!scr){return;}
  if(!scr.states[cur.state])cur.state=Object.keys(scr.states)[0];
  $("screen").innerHTML=scr.states[cur.state]();
  const sel=$("stateSel");sel.innerHTML=Object.keys(scr.states).map(k=>`<option ${k===cur.state?"selected":""}>${k}</option>`).join("");
  document.querySelectorAll("#slist button").forEach(b=>b.classList.toggle("on",b.dataset.id===cur.screen));
  document.querySelectorAll("#jlist button").forEach((b,i)=>b.classList.toggle("on",i===jIdx));
  let jtxt=jIdx>=0?`${J[jIdx][0]}: step ${sIdx+1} of ${J[jIdx][1].length}\n`:"";
  $("info").textContent=`${jtxt}${cur.screen}.${cur.state}  ${scr.name}`;
  if($("phone").classList.contains("ax5"))axReflow();
  if($("tVo").checked)voOrder();
}
/* AX3 and above: the pinned footer keeps only its first (primary) action; quiet options follow the content in the scroll (DESIGN.md 5, AX rule). The Keep gate keeps both, as built. */
function axReflow(){
  const f=$("screen").querySelectorAll(".footer");
  f.forEach(ft=>{const sc=ft.parentElement.querySelector(".scroll");if(!sc||cur.screen==="E-S10")return;[...ft.children].slice(1).forEach(c=>{c.style.marginTop="12px";sc.appendChild(c);});});
}
function voOrder(){
  const ph=$("phone").getBoundingClientRect();
  [...$("screen").querySelectorAll("[data-vo]")].forEach((el,i)=>{el.classList.add("vo");const r=el.getBoundingClientRect();const n=document.createElement("span");n.className="vonum";n.textContent=i+1;n.style.left=(r.left-ph.left-4)+"px";n.style.top=(r.top-ph.top-4)+"px";$("phone").appendChild(n);});
}
function clearVo(){document.querySelectorAll(".vonum").forEach(n=>n.remove());}
function show(t,fromJourney){clearVo();cur=parse(t);if(!fromJourney&&jIdx>=0){/* stay in the journey when the target is one of its steps; otherwise leave it */ const k=J[jIdx][1].indexOf(t);if(k>=0)sIdx=k;else jIdx=-1;}render();}
$("screen").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b){e.preventDefault();show(b.dataset.go);}});
$("stateSel").addEventListener("change",e=>{clearVo();cur.state=e.target.value;render();});
$("next").onclick=()=>{if(jIdx<0)return;const st=J[jIdx][1];if(sIdx<st.length-1){sIdx++;show(st[sIdx],true);}};
$("back").onclick=()=>{if(jIdx<0)return;if(sIdx>0){sIdx--;show(J[jIdx][1][sIdx],true);}};
const toggles={tDark:"dark",tAx5:"ax5",tRt:"rt",tHc:"hc",tRm:"rm"};
Object.keys(toggles).forEach(id=>$(id).addEventListener("change",e=>{$("phone").classList.toggle(toggles[id],e.target.checked);clearVo();render();}));
$("tSe").addEventListener("change",e=>{$("phone").classList.toggle("se",e.target.checked);clearVo();render();});
$("tVo").addEventListener("change",()=>{clearVo();render();});
$("jlist").innerHTML=J.map((j,i)=>`<button type="button" class="j" data-i="${i}">${esc(j[0])}</button>`).join("");
$("jlist").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;jIdx=+b.dataset.i;sIdx=0;show(J[jIdx][1][0],true);});
$("slist").innerHTML=Object.keys(S).map(k=>`<button type="button" class="s" data-id="${k}">${k} ${esc(S[k].name)}</button>`).join("");
$("slist").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;jIdx=-1;show(b.dataset.id);});
if(matchMedia("(prefers-color-scheme: dark)").matches){$("tDark").checked=true;$("phone").classList.add("dark");}
if(matchMedia("(prefers-reduced-motion: reduce)").matches){$("tRm").checked=true;$("phone").classList.add("rm");}
jIdx=0;sIdx=0;show(J[0][1][0],true);
</script>
