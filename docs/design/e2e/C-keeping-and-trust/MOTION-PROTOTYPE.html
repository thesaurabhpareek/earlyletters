<!--
  Motion prototype for docs/design/e2e/C-keeping-and-trust/MOTION.md. Self-contained: no network, no framework.
  Token values copied from packages/design-tokens/src/tokens.ts (colour light and dark, motion) on 20 Nov 2026.
  Every item id (M-Cnn) and screen id (C-Snn) matches MOTION.md and DESIGN.md. Words on screen are placeholders;
  the real strings are PROPOSED keys in WORDS.md. Fictional family only: Asha.
  Native pushes, system alerts and the share sheet are approximations of the platform's, marked "system".
-->
<style>

.phone.dark { --bg:#161412; --surface:#1B1917; --raised:#201D1A; --text:#F2ECE4; --muted:#B3AA9E; --accent:#D9A47E; --accentSoft:#3A2E25; --onAccent:#1E1612; --line:#33302C; --focus:#8CC4DE; --success:#8CC9A0; --caution:#E3B866; --destructive:#F08C7C; --onDestructive:#1E1612; --controlBorder:#857C70; --scrim:rgba(0,0,0,0.55); --goldPeak:0.16; }

.navbar { height: 44px; display: flex; align-items: center; justify-content: center; position: relative; font-weight: 600; font-size: 17px; }

.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }

.alertbox .ab { font-size: 13px; padding: 0 16px 16px; line-height: 1.35; }

<body>
<header>
  <h1>Area C. Keeping and trust: motion</h1>
  <label><input type="checkbox" id="rm"> Reduce Motion</label>
  <label><input type="checkbox" id="dk"> Dark</label>
  <label><input type="checkbox" id="vo"> VoiceOver (simulated)</label>
  <label><input type="checkbox" id="sw"> Switch Control (simulated)</label>
  <label><input type="checkbox" id="slow"> Slow motion x4</label>
</header>
<main>
  <nav id="list" aria-label="Motion items"></nav>
  <div class="stagewrap">
    <div class="phone" id="phone">
      <div class="status"><span>9:41</span><span>100%</span></div>
      <div id="screen"></div>
    </div>
    <button class="replay" id="replay">Play again</button>
    <div id="hap" aria-live="polite"></div>
    <div id="vocap" aria-hidden="true"></div>
    <div id="rev"><div>Reviewer view of the undo window (not in the app: the app never shows a countdown)</div><div class="track"><div class="now"></div><div class="mark"></div></div><div id="revt"></div></div>
  </div>
  <div id="side">
    <div id="notes"><b>Choose an item on the left.</b> Each plays its transition; tap controls inside the phone where they show. Toggle Reduce Motion and play again to see the alternative.</div>
    <div id="log" aria-label="Timeline"></div>
  </div>
</main>
<script>
"use strict";
/* ---------- Tokens (packages/design-tokens/src/tokens.ts, motion) ---------- */
const M = {
  fadeMs: 200, exitMs: 160, enter: { dy: 8, ms: 280 }, swapMs: 150, staggerMs: 30, staggerMax: 6,
  easing: "cubic-bezier(0.2, 0, 0, 1)",
  snappy: { stiffness: 520, damping: 46, mass: 1 },
  standard: { stiffness: 260, damping: 30, mass: 1 },
  gentle: { stiffness: 90, damping: 18, mass: 1 },
  press: { scale: 0.97, cardScale: 0.98, opacity: 0.9 },
  emptyBreathMs: 8000,
  lamp: { arriveMs: 1200, leaveMs: 160, returnMs: 280 },
  handOff: { outMs: 140, inFrom: 80, inMs: 120 },
  toastMs: 4000
};
const HAPTIC = {
  tap: "selectionAsync() / Segment_Tick",
  press: "impactAsync(Light) / Context_Click",
  success: "notificationAsync(Success) / Confirm",
  warning: "notificationAsync(Warning) / Reject",
  soft: "impactAsync(Soft) / Long_Press"
};

/* ---------- State ---------- */
let RM = false, VO = false, SW = false, SLOW = 1, runId = 0, t0 = 0, currentItem = null;
const CANCEL = { cancel: true };
const $ = (s, r = document) => r.querySelector(s);
const phone = $("#phone"), screenEl = $("#screen"), logEl = $("#log");
const T = (ms) => ms * SLOW;

function log(msg) {
  const ms = Math.round((performance.now() - t0) / SLOW);
  logEl.textContent += "+" + String(ms).padStart(5, " ") + " ms  " + msg + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}
function haptic(name) {
  log("haptic " + name + " (" + HAPTIC[name] + ")");
  const h = $("#hap");
  h.textContent = "Haptic: " + name;
  h.animate([{ opacity: 1 }, { opacity: 1 }, { opacity: 0 }], { duration: 1400, fill: "forwards" });
}
let voBusyUntil = 0;
function announce(text) {
  const R = runId;
  log("announce: \"" + text + "\"");
  if (!VO) return Promise.resolve({ success: true, at: performance.now() });
  const box = $("#vocap");
  const readMs = Math.max(700, text.length * 55); // real time: a reading is not slowed
  box.textContent = "VoiceOver: " + text;
  box.style.opacity = 1;
  const start = Math.max(performance.now(), voBusyUntil);
  voBusyUntil = start + readMs;
  return new Promise((res) => setTimeout(() => {
    if (R !== runId) return;
    box.style.opacity = 0;
    log("VoiceOver finished reading (announcementFinished)");
    res({ success: true, at: performance.now() });
  }, voBusyUntil - performance.now()));
}

/* ---------- Animation helpers ---------- */
function A(el, frames, ms, o = {}) {
  if (!el) return Promise.resolve();
  const a = el.animate(frames, { duration: Math.max(1, T(ms)), easing: o.easing || M.easing, delay: T(o.delay || 0), fill: "both" });
  return a.finished.catch(() => {});
}
function springValues(from, to, cfg) {
  const out = [from]; let x = from, v = 0; const dt = 1 / 1000; let acc = 0; const range = Math.abs(to - from) || 1;
  for (let t = 0; t < 3; t += dt) {
    const f = -cfg.stiffness * (x - to) - cfg.damping * v;
    v += (f / cfg.mass) * dt; x += v * dt; acc += dt;
    if (acc >= 1 / 60) { acc -= 1 / 60; out.push(x); }
    if (Math.abs(x - to) < range * 0.002 && Math.abs(v) < range * 0.01) break;
  }
  out.push(to);
  return { vals: out, ms: (out.length - 1) * (1000 / 60) };
}
function springA(el, from, to, cfg, map) {
  const s = springValues(from, to, cfg);
  return A(el, s.vals.map(map), s.ms, { easing: "linear" });
}
const fadeIn = (el, ms = M.fadeMs, delay = 0) => A(el, [{ opacity: 0 }, { opacity: 1 }], ms, { delay });
const fadeOut = (el, ms = M.fadeMs, delay = 0) => A(el, [{ opacity: 1 }, { opacity: 0 }], ms, { delay });
function enter(el, delay = 0) {
  if (RM) return fadeIn(el, M.fadeMs, delay);
  return A(el, [{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "translateY(0)" }], M.enter.ms, { delay });
}
function exitEl(el) {
  if (RM) return fadeOut(el, M.fadeMs);
  return A(el, [{ opacity: 1, transform: "translateY(0)" }, { opacity: 0, transform: "translateY(8px)" }], M.exitMs);
}
/* The 200 ms hand-off (MOTION 5f): leaving over its first 140 ms, arriving over the last 120 ms from 80 ms. Both straight lines. */
async function handOff(outEl, inEl) {
  inEl.style.opacity = 0;
  outEl.setAttribute("aria-hidden", "true");
  const p1 = A(outEl, [{ opacity: 1 }, { opacity: 0 }], M.handOff.outMs, { easing: "linear" });
  const p2 = A(inEl, [{ opacity: 0 }, { opacity: 1 }], M.handOff.inMs, { delay: M.handOff.inFrom, easing: "linear" });
  setTimeout(() => log("focus moves to the arriving block's heading (at its mount, 80 ms)"), T(M.handOff.inFrom));
  await Promise.all([p1, p2]);
  inEl.style.opacity = 1;
  outEl.remove();
}
/* Words replaced in place: swapMs cross-fade (also the Reduce Motion form). */
async function swapText(holder, text) {
  const old = holder.firstElementChild;
  const n = document.createElement("span"); n.textContent = text; holder.appendChild(n);
  const p = [fadeIn(n, M.swapMs)]; if (old) p.push(fadeOut(old, M.swapMs));
  await Promise.all(p); if (old) old.remove();
}
/* A row leaves: fade exitMs, then the rows below close up on the standard spring. Reduce Motion: 200 ms fade, then close at once. */
async function collapse(row) {
  row.setAttribute("aria-hidden", "true");
  const h = row.offsetHeight; row.style.overflow = "hidden";
  if (RM) { await fadeOut(row, M.fadeMs); row.remove(); log("row gone; rows below close at once (Reduce Motion)"); return; }
  await fadeOut(row, M.exitMs);
  log("rows below close up (standard spring)");
  await springA(row, h, 0, M.standard, (v) => ({ height: Math.max(0, v) + "px", minHeight: "0px", paddingTop: "0px", paddingBottom: "0px", opacity: 0 }));
  row.remove();
}
async function press(el, card) {
  const s = card ? M.press.cardScale : M.press.scale;
  if (RM) { await A(el, [{ opacity: 1 }, { opacity: M.press.opacity }], 80); await A(el, [{ opacity: M.press.opacity }, { opacity: 1 }], 120); return; }
  await springA(el, 1, s, M.snappy, (v) => ({ transform: "scale(" + v + ")" }));
  await springA(el, s, 1, M.snappy, (v) => ({ transform: "scale(" + v + ")" }));
}
function breathe(el) {
  if (RM) { log("drawing is still (Reduce Motion)"); return; }
  el.animate([{ opacity: 1 }, { opacity: 0.85 }, { opacity: 1 }], { duration: T(M.emptyBreathMs), iterations: Infinity, easing: "ease-in-out" });
  log("drawing breathes: opacity 0.85 to 1 over 8 s, while focused");
}
function lamp(op, ms, label) {
  const l = $(".lamp", screenEl); if (!l) return Promise.resolve();
  if (RM) { l.style.opacity = op; log("lamp " + label + ": at its level at once (Reduce Motion)"); return Promise.resolve(); }
  const from = getComputedStyle(l).opacity;
  log("lamp " + label + " over " + ms + " ms");
  const p = A(l, [{ opacity: from }, { opacity: op }], ms, { easing: "linear" });
  return p.then(() => { l.style.opacity = op; });
}

/* ---------- Platform approximations (system) ---------- */
async function push(html, opts = {}) {
  const old = lastPage();
  const n = mk(html); screenEl.appendChild(n);
  log("native push (system; approximated here)");
  if (RM) { await Promise.all([fadeIn(n, M.fadeMs), old ? fadeOut(old, M.fadeMs) : 0]); }
  else {
    await Promise.all([
      A(n, [{ transform: "translateX(100%)" }, { transform: "translateX(0)" }], 350, { easing: "cubic-bezier(0.25, 1, 0.5, 1)" }),
      old ? A(old, [{ transform: "translateX(0)" }, { transform: "translateX(-30%)" }], 350, { easing: "cubic-bezier(0.25, 1, 0.5, 1)" }) : 0
    ]);
  }
  if (old && !opts.keep) old.remove();
  return n;
}
async function pop(toHtml) {
  const cur = lastPage();
  const n = mk(toHtml); screenEl.insertBefore(n, cur);
  log("native pop (system; approximated here)");
  if (RM) { await Promise.all([fadeIn(n, M.fadeMs), fadeOut(cur, M.fadeMs)]); }
  else {
    await Promise.all([
      A(cur, [{ transform: "translateX(0)" }, { transform: "translateX(100%)" }], 330, { easing: "cubic-bezier(0.25, 1, 0.5, 1)" }),
      A(n, [{ transform: "translateX(-30%)" }, { transform: "translateX(0)" }], 330, { easing: "cubic-bezier(0.25, 1, 0.5, 1)" })
    ]);
  }
  cur.remove();
  return n;
}
function sheet(inner, opts = {}) {
  const scrim = mk('<div class="scrim"></div>');
  const sh = mk('<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>' + inner + "</div>");
  screenEl.append(scrim, sh);
  const h = () => sh.offsetHeight;
  const open = (async () => {
    log("sheet rises" + (RM ? ": fades, no travel (Reduce Motion), 200 ms" : " on the standard spring; scrim with it"));
    if (RM) await Promise.all([fadeIn(scrim), fadeIn(sh)]);
    else await Promise.all([fadeIn(scrim, 250), springA(sh, h(), 0, M.standard, (v) => ({ transform: "translateY(" + v + "px)" }))]);
    log("sheet title takes VoiceOver focus" + (opts.locked ? "; not dismissible by swipe (its buttons only)" : ""));
  })();
  return {
    el: sh, opened: open,
    close: async () => {
      log("sheet falls" + (RM ? " (fade)" : " (standard spring)"));
      if (RM) await Promise.all([fadeOut(scrim), fadeOut(sh)]);
      else await Promise.all([fadeOut(scrim, 200), springA(sh, 0, h(), M.standard, (v) => ({ transform: "translateY(" + v + "px)" }))]);
      scrim.remove(); sh.remove();
    }
  };
}
function systemAlert(title, body, buttons) {
  const scrim = mk('<div class="scrim"></div>');
  const box = mk('<div class="alertbox" role="alertdialog"><div class="at"></div><div class="ab"></div></div>');
  $(".at", box).textContent = title; $(".ab", box).textContent = body;
  screenEl.append(scrim, box);
  log("system alert (the platform's; approximated)");

/* ---------- Toast and the T4 undo window ---------- */
let toastState = null;
function revReset() { $("#rev").style.display = "none"; }
function showToast(message, action, opts = {}) {
  if (toastState && toastState.el.isConnected) {
    // A new toast swaps words in place (swapMs); the replaced one's Undo closes with it.
    const st = toastState; st.closeAction("replaced by a new toast");
    const msg = $(".msg", st.el); swapText(msg, message);
    log("new toast: words cross-fade in place over " + M.swapMs + " ms; never stacked");
    st.setAction(action, opts); announce(action ? message + " " + action.label + "." : message);
    return st;
  }
  const el = mk('<div class="toast" role="status"><div class="msg"><span></span></div></div>');
  $(".msg span", el).textContent = message;
  screenEl.appendChild(el);
  enter(el);
  log("toast enters" + (RM ? " (fade 200 ms)" : " (y 8 to 0 and fade, 280 ms)") + "; its action is hittable from the first frame");
  const st = {
    el, timer: null, revTimer: null,
    setAction(action, opts) {
      const old = $(".act", el); if (old) old.remove();
      clearTimeout(st.timer); clearInterval(st.revTimer); revReset();

        el.appendChild(b);

      } else {

      }
    },
    window(N, message, action) {
      const shown = performance.now(); let readDone = shown; let focusOn = false;
      const rev = $("#rev"); rev.style.display = "block";
      const startLabel = "window N = " + N + " s" + (VO ? ", VoiceOver on" : "") + (SW ? ", Switch Control on" : "");
      log(startLabel);
      if (SW) { log("Switch Control: no clock; the window closes only when the parent moves on"); $("#revt").textContent = "Switch Control: open until the parent moves on"; return; }

        $(".mark", rev).style.left = "calc(100% - 2px)";

function bookCards(n, start = 0) { const out = []; for (let i = 0; i < n; i++) { const d = 20 - ((i + start) % 19); out.push(mk('<div class="lcard"><div class="d">' + d + ' October. Month 3</div><div class="w">Letter ' + (i + start + 1) + ": the rain on the window and your hand on mine.</div></div>")); } return out; }
item("M-C26", "C-S10", "Held screen to the Book", N("The first letters arrived, or 10 s passed", "Hand-off; the Book's first view: header settles (gentle), first 6 cards stagger, lamp arrives. The C-S12 line is in place with the header", "hand-off 200 ms; enter 280 ms + 5 x 30 ms; lamp 1.2 s", "one 200 ms fade; lamp at level", "none"), async (c) => {
  setScreen(PG.held("loading")); const held = $(".page", screenEl); breathe($(".drw", held)); await c.w(1200);
  const tmp = document.createElement("div"); tmp.innerHTML = PG.book(); const lampEl = tmp.querySelector(".lamp"); const bp = tmp.querySelector(".page"); const tb = tmp.querySelector(".tabbar");
  screenEl.insertBefore(lampEl, held); screenEl.appendChild(bp); screenEl.appendChild(tb);
  const cards = bookCards(8); cards.forEach((x) => $("#cards", bp).appendChild(x));
  const head = bp.querySelector("[data-h]"); [head, ...cards.slice(0, 6)].forEach((e) => (e.style.opacity = 0));
  await c.k(handOff(held, bp));
  lamp(0.6, M.lamp.arriveMs, "arrives (first lit room of the session)");
  if (RM) { await c.k(Promise.all([head, ...cards.slice(0, 6)].map((e) => fadeIn(e)))); }
  else {
    log("header settles on gentle: opacity 0.6 to 1, y 6 to 0");
    await c.k(Promise.all([springA(head, 0, 1, M.gentle, (v) => ({ opacity: 0.6 + 0.4 * Math.min(1, v), transform: "translateY(" + (6 * (1 - v)) + "px)" })), ...cards.slice(0, 6).map((e, i) => enter(e, i * M.staggerMs))]));
  }
  [head, ...cards].forEach((e) => (e.style.opacity = 1));
});
item("M-C27", "C-S12", "Letters arrive while reading: anchored", N("More letters arrive by sync", "New cards appear in place with no entrance, stagger or wash; the scroll stays on the card being read; no count", "0 ms", "same", "none"), async (c) => {
  setScreen(PG.book()); $(".lamp", screenEl).style.opacity = 0.6; const bp = $("#bookpage", screenEl); const list = $("#cards", bp);
  bookCards(10, 6).forEach((x) => list.appendChild(x)); await c.w(50);
  const reading = list.children[4]; reading.classList.add("reader"); bp.scrollTop = reading.offsetTop - 200; await c.w(800);
  for (let k = 0; k < 3; k++) {
    const before = reading.getBoundingClientRect().top;
    const add = bookCards(2, 20 + k * 2); const h0 = bp.scrollHeight;
    add.reverse().forEach((x) => list.insertBefore(x, list.firstChild));
    bp.scrollTop += bp.scrollHeight - h0; // maintainVisibleContentPosition

    log("2 letters arrived above; the card being read moved " + Math.round(after - before) + " pt (anchored)"); await c.w(900);
  }
});

/* ---------- Runner ---------- */
function buildList() {
  const nav = $("#list"); let last = "";
  const names = { "C-S01": "C-S01 Me", "C-S02": "C-S02 Account", "C-S03": "C-S03 Sign-out sheet", "C-S04": "C-S04 Save a copy", "C-S05": "C-S05 Printable book", "C-S06": "C-S06 Home slip", "C-S07": "C-S07 Which book", "C-S08": "C-S08 Where your letters live", "C-S09": "C-S09 Where the recording is", "C-S10": "C-S10 Opening your book", "C-S11": "C-S11 Returning consent", "C-S12": "C-S12 Book-level line", "C-S13": "C-S13 Earlier versions", "C-S14": "C-S14 An earlier version", "C-S15": "C-S15 A book in Me", "C-S16": "C-S16 Hidden books", "C-S17": "C-S17 Recently deleted", "C-S18": "C-S18 Storage", "C-S19": "C-S19 Erase everything", "C-S20": "C-S20 Delete account", "C-S21": "C-S21 Recording backup (flip)", "C-S22": "C-S22 Delete this book", "T4": "Undo windows (ruling T4)" };
  ITEMS.forEach((it) => {
    if (it.scr !== last) { const h = document.createElement("h2"); h.textContent = names[it.scr] || it.scr; nav.appendChild(h); last = it.scr; }
    const b = document.createElement("button"); b.innerHTML = "<b></b><span></span>"; b.querySelector("b").textContent = it.id; b.querySelector("span").textContent = it.title;
    b.onclick = () => play(it, b); it.btn = b; nav.appendChild(b);
  });
}
function showNotes(it) {
  const n = it.notes; const d = $("#notes"); d.innerHTML = "";
  const h = document.createElement("div"); h.innerHTML = "<b></b>"; h.firstChild.textContent = it.id + " (" + it.scr + "): " + it.title; d.appendChild(h);
  const dl = document.createElement("dl");
  [["Trigger", n.trigger], ["What moves", n.moves], ["Duration and easing", n.time], ["Reduce Motion", n.rm], ["Haptic", n.hap]].forEach(([k, v]) => { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.textContent = v; dl.append(dt, dd); });
  d.appendChild(dl);
}
async function play(it, btn) {
  const R = ++runId; currentItem = it; fillVal = 0; voBusyUntil = 0;
  if (toastState) { clearTimeout(toastState.timer); clearInterval(toastState.revTimer); }
  toastState = null; revReset(); $("#vocap").style.opacity = 0;
  document.querySelectorAll("nav button").forEach((b) => b.classList.remove("on")); (btn || it.btn).classList.add("on");
  screenEl.getAnimations && document.getAnimations().forEach((a) => { try { a.cancel(); } catch (e) {} });
  screenEl.innerHTML = ""; logEl.textContent = ""; t0 = performance.now(); showNotes(it);
  log(it.id + " start" + (RM ? " (Reduce Motion on)" : "") + (SLOW > 1 ? " (slow motion x4; times logged in design ms)" : ""));
  const c = {
    id: R,
    w: async (ms) => { await new Promise((r) => setTimeout(r, T(ms))); if (R !== runId) throw CANCEL; },
    k: async (p) => { const v = await p; if (R !== runId) throw CANCEL; return v; }
  };
  try { await it.run(c); if (R === runId) log("end"); } catch (e) { if (e !== CANCEL) { console.error(e); log("error: " + e.message); } }
}
$("#rm").onchange = (e) => { RM = e.target.checked; };
$("#dk").onchange = (e) => { phone.classList.toggle("dark", e.target.checked); document.body.classList.toggle("dk", e.target.checked); };
$("#vo").onchange = (e) => { VO = e.target.checked; };
$("#sw").onchange = (e) => { SW = e.target.checked; };
$("#slow").onchange = (e) => { SLOW = e.target.checked ? 4 : 1; };
$("#replay").onclick = () => { if (currentItem) play(currentItem); };
if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) { RM = true; $("#rm").checked = true; }
buildList();
</script>
